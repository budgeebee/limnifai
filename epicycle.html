<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Epicycle</title>
<style>
  :root {
    --bg: #0a141c;
    --fog: #4a6a80;
    --pale: #7ba4c4;
    --silver: #c8d8e8;
    --ice: #e8f0f8;
    --hairline: rgba(200, 216, 232, 0.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    cursor: crosshair;
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; display: block; }

  #title {
    position: fixed; top: 34px; left: 40px;
    color: var(--ice);
    font-size: 22px; letter-spacing: 0.35em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 1.8s ease;
    pointer-events: none;
    text-shadow: 0 0 24px rgba(200,216,232,0.25);
  }
  #title.show { opacity: 0.9; }

  .hud {
    position: fixed;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--hairline);
    pointer-events: none;
    line-height: 1.7;
    transition: color 0.4s ease;
  }
  #ratio { bottom: 30px; left: 40px; text-align: left; }
  #hint { bottom: 30px; right: 40px; text-align: right; opacity: 0.55; }
  #ratio .val { color: var(--silver); }
  #ratio .gap-near { color: var(--ice); text-shadow: 0 0 14px rgba(232,240,248,0.6); }
  #closest { color: var(--pale); }

  #phrase {
    position: fixed;
    bottom: 34%; left: 50%;
    transform: translateX(-50%);
    color: var(--silver);
    font-style: italic;
    font-size: 15px;
    letter-spacing: 0.06em;
    text-align: center;
    opacity: 0;
    transition: opacity 1.6s ease;
    pointer-events: none;
    max-width: 72%;
    text-shadow: 0 0 18px rgba(123,164,196,0.3);
  }
  #phrase.show { opacity: 0.85; }

  #flash {
    position: fixed; inset: 0;
    background: radial-gradient(circle at center, rgba(232,240,248,0.14), transparent 60%);
    opacity: 0; pointer-events: none;
    transition: opacity 0.9s ease;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="title">Epicycle</div>
<div id="ratio" class="hud">
  ratio&nbsp;k&nbsp;=&nbsp;<span class="val" id="kval">5.0000</span><br>
  <span id="closest">closest approach&nbsp;·&nbsp;<span id="gapval">—</span></span>
</div>
<div id="hint" class="hud">move to steer&nbsp;·&nbsp;seek the closing<br>click to begin again</div>
<div id="phrase"></div>
<div id="flash"></div>

<script>
(function () {
  "use strict";

  // ---- palette (cold-ethereal) ----
  const BG = "#0a141c";
  const FOG = "74, 106, 128";      // #4a6a80
  const PALE = "123, 164, 196";    // #7ba4c4
  const SILVER = "200, 216, 232";  // #c8d8e8
  const ICE = "232, 240, 248";     // #e8f0f8

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const titleEl = document.getElementById("title");
  const phraseEl = document.getElementById("phrase");
  const flashEl = document.getElementById("flash");
  const kEl = document.getElementById("kval");
  const gapEl = document.getElementById("gapval");
  const closestEl = document.getElementById("closest");

  // ---- state ----
  let W = 0, H = 0, DPR = 1;
  let S = 0;            // outer circle radius (px)
  let cx = 0, cy = 0;   // center in CSS px

  let k = 5.0;          // ratio (R-r)/r  ->  curve closes iff rational
  let penDist = 0.85;   // d / r   (0..1.3)
  let theta = 0;        // primary pen parameter
  let thetaG = 0;       // ghost pen parameter

  let targetK = 5.0;
  let targetD = 0.85;
  let pointerActive = false;
  let lastPointer = -10;
  let autoPhase = 0;

  let minGap = Infinity;
  let orbitN = -1;      // last completed outer orbit index
  let nearClosure = false;
  let flash = 0;

  const STEP = 0.032;   // theta advance per frame (rad)

  // offscreen trail buffer
  let trail = null, tctx = null;

  // ---- phrases ----
  const PHRASES = [
    "an orbit that almost closes",
    "the gap where beginning meets end",
    "wheels turning on wheels",
    "closest approach, never arrival",
    "a hair's breadth from return",
    "the seam the curve refuses to seal",
    "approach without contact",
    "the epicycle, forever circling home",
    "every orbit a near-miss",
    "between the pen and its own first mark",
    "return is a limit, not a place",
    "the wound the circle keeps open"
  ];
  let phraseIdx = 0;
  let phraseTimer = 0;

  // ---- hypotrochoid: circle rolling inside a fixed circle ----
  // R = S, r = S/(1+k), a = R-r, pen = dRatio * r
  function hypoPoint(kk, dRatio, th) {
    const r = S / (1 + kk);
    const a = S - r;
    const pen = dRatio * r;
    return [
      cx + a * Math.cos(th) + pen * Math.cos(kk * th),
      cy + a * Math.sin(th) - pen * Math.sin(kk * th)
    ];
  }

  function penRadius(kk, dRatio) {
    return dRatio * (S / (1 + kk));
  }

  // ---- resize ----
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    S = Math.min(W, H) * 0.42;
    cx = W * 0.5;
    cy = H * 0.5;

    // recreate trail buffer
    trail = document.createElement("canvas");
    trail.width = canvas.width;
    trail.height = canvas.height;
    tctx = trail.getContext("2d");
    tctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    clearTrail();
  }

  function clearTrail() {
    tctx.setTransform(1, 0, 0, 1, 0, 0);
    tctx.clearRect(0, 0, trail.width, trail.height);
    tctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    theta = 0; thetaG = 0; orbitN = -1;
  }

  // ---- background ----
  function drawBackground() {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.75);
    g.addColorStop(0, "#101c26");
    g.addColorStop(0.55, "#0b151d");
    g.addColorStop(1, "#070f15");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- fade the trail toward transparent ----
  function fadeTrail() {
    tctx.setTransform(1, 0, 0, 1, 0, 0);
    tctx.globalCompositeOperation = "destination-out";
    tctx.fillStyle = "rgba(0,0,0,0.032)";
    tctx.fillRect(0, 0, trail.width, trail.height);
    tctx.globalCompositeOperation = "source-over";
    tctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  // color by closeness (gap / maxGap normalized)
  function strokeColor(closeness, isGhost) {
    // closeness: 1 => near closure (bright ice), 0 => far (pale/fog)
    const r = isGhost ? PALE : (lerp(PALE, ICE, closeness));
    const a = isGhost ? 0.10 : 0.32 + 0.42 * closeness;
    return "rgba(" + r + "," + a + ")";
  }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function drawSegment(px, py, nx, ny, color) {
    tctx.strokeStyle = color;
    tctx.lineWidth = 1.1;
    tctx.lineCap = "round";
    tctx.beginPath();
    tctx.moveTo(px, py);
    tctx.lineTo(nx, ny);
    tctx.stroke();
  }

  // ---- advance and draw one pen ----
  function advancePen(isGhost, th, kk, dRatio, colorFn) {
    // number of sub-steps so the fast inner oscillation stays smooth
    const n = Math.max(1, Math.ceil((kk * STEP) / 0.05));
    const dth = STEP / n;
    let p = hypoPoint(kk, dRatio, th);
    for (let i = 0; i < n; i++) {
      const t2 = th + dth;
      const q = hypoPoint(kk, dRatio, t2);
      const col = colorFn(kk, dRatio, t2);
      drawSegment(p[0], p[1], q[0], q[1], col);
      p = q;
      th = t2;
    }
    return th;
  }

  // ---- beacon at the seam (where the orbit refuses to close) ----
  function drawBeacon(closeness) {
    const bx = cx + S - penRadius(k, penDist) + penRadius(k, penDist);
    // start point P(0) = (cx + a + pen, cy)  where a = S - r, pen = penDist*r
    const r = S / (1 + k);
    const a = S - r;
    const pen = penDist * r;
    const sx = cx + a + pen;
    const sy = cy;
    const rad = 4 + 14 * closeness;
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, rad);
    g.addColorStop(0, "rgba(" + ICE + "," + (0.55 * closeness + 0.05) + ")");
    g.addColorStop(1, "rgba(" + ICE + ",0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(sx, sy, rad, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- update closure gap ----
  function updateGap() {
    const n = Math.floor(theta / (Math.PI * 2));
    if (n > orbitN) {
      orbitN = n;
      const pen = penRadius(k, penDist);
      const gap = 2 * pen * Math.abs(Math.sin(Math.PI * n * k));
      if (gap < minGap) {
        minGap = gap;
        if (gap < 3) {
          flash = 1;
        }
      }
    }
  }

  // ---- pointer ----
  function onPointer(x, y) {
    pointerActive = true;
    lastPointer = performance.now() / 1000;
    const nx = (x / W) * 2 - 1;               // -1..1
    const ny = (y / H) * 2 - 1;
    targetK = 2.6 + (nx + 1) * 0.5 * (8.4 - 2.6);   // 2.6 .. 8.4
    targetD = 0.15 + (1 - (ny + 1) * 0.5) * 1.1;    // 0.15 .. 1.25
  }

  function onClick() {
    minGap = Infinity;
    clearTrail();
  }

  canvas.addEventListener("pointermove", function (e) {
    onPointer(e.clientX, e.clientY);
  });
  canvas.addEventListener("pointerdown", function (e) {
    onPointer(e.clientX, e.clientY);
  });
  canvas.addEventListener("click", onClick);
  window.addEventListener("resize", resize);

  // ---- phrase cycle ----
  function cyclePhrase(dt) {
    phraseTimer -= dt;
    if (phraseTimer <= 0) {
      phraseEl.textContent = PHRASES[phraseIdx % PHRASES.length];
      phraseEl.classList.add("show");
      phraseIdx++;
      phraseTimer = 13;
    } else if (phraseTimer < 1.6) {
      phraseEl.classList.remove("show");
    }
  }

  // ---- main loop ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    const tNow = now / 1000;

    // autonomous drift when pointer idle
    if (!pointerActive || (tNow - lastPointer) > 3.0) {
      pointerActive = false;
      autoPhase += dt * 0.12;
      targetK = 5.0 + 2.6 * Math.sin(autoPhase);
      targetD = 0.7 + 0.35 * Math.sin(autoPhase * 1.7 + 1.3);
    }

    // ease params (approach without settling)
    const ke = 1 - Math.exp(-dt * 2.2);
    k += (targetK - k) * ke;
    penDist += (targetD - penDist) * ke;

    // gesture tremble: velocity wobbles the ratio, so it never truly locks
    const tremble = pointerActive ? 0.0018 : 0.0006;
    const kDraw = k + Math.sin(tNow * 7.1) * tremble;

    // ghost pen rides an irrational offset
    const kGhost = kDraw + 0.4142; // sqrt2 - 1: never rational together

    updateGap();

    // closeness for the primary (0 far .. 1 near)
    const closeness = minGap === Infinity
      ? 0
      : Math.max(0, Math.min(1, 1 - minGap / 12));

    // draw
    drawBackground();
    fadeTrail();

    // ghost first (underneath)
    thetaG = advancePen(true, thetaG, kGhost, penDist * 0.72, function () {
      return "rgba(" + PALE + ",0.10)";
    });
    // primary
    theta = advancePen(false, theta, kDraw, penDist, function (kk, dr) {
      const pen = penRadius(kk, dr);
      const gap = 2 * pen * Math.abs(Math.sin(Math.PI * Math.floor(theta / (Math.PI * 2)) * kk));
      const c = gap === Infinity ? 0 : Math.max(0, Math.min(1, 1 - gap / (2 * pen + 0.001)));
      return strokeColor(c, false);
    });

    // composite trail
    ctx.drawImage(trail, 0, 0, W, H);

    // seam beacon + flash
    drawBeacon(closeness);
    if (flash > 0) {
      flashEl.style.opacity = flash;
      flash *= Math.exp(-dt * 2.4);
      if (flash < 0.01) flash = 0;
    } else {
      flashEl.style.opacity = 0;
    }

    // HUD
    kEl.textContent = kDraw.toFixed(4);
    gapEl.textContent = minGap === Infinity ? "—" : minGap.toFixed(2) + " px";
    if (minGap !== Infinity && minGap < 3) {
      gapEl.classList.add("gap-near");
    } else {
      gapEl.classList.remove("gap-near");
    }

    cyclePhrase(dt);

    requestAnimationFrame(frame);
  }

  // ---- boot ----
  resize();
  clearTrail();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground();

  titleEl.classList.add("show");
  setTimeout(function () { titleEl.classList.remove("show"); }, 4200);
  phraseTimer = 3;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

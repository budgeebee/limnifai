<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filigree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #020209;
    overflow: hidden;
    cursor: crosshair;
    font-family: Georgia, 'Times New Roman', serif;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas { display: block; }
  #text-overlay {
    position: fixed;
    bottom: 52px;
    left: 50%;
    transform: translateX(-50%);
    color: #b89bf5;
    font-size: 14px;
    letter-spacing: 0.07em;
    opacity: 0;
    transition: opacity 2.8s ease;
    pointer-events: none;
    text-align: center;
    max-width: 80vw;
    text-shadow: 0 0 18px rgba(120,60,220,0.45), 0 0 40px rgba(90,40,180,0.2);
  }
  #title-overlay {
    position: fixed;
    top: 48%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #d4c4f8;
    font-size: 44px;
    letter-spacing: 0.16em;
    opacity: 0;
    transition: opacity 2s ease;
    pointer-events: none;
    text-shadow: 0 0 40px rgba(140,80,240,0.5), 0 0 90px rgba(100,50,200,0.25);
  }
  #hint-overlay {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(160,130,220,0.5);
    font-size: 11px;
    letter-spacing: 0.06em;
    transition: opacity 3s ease;
    pointer-events: none;
    font-style: italic;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title-overlay">filigree</div>
<div id="text-overlay"></div>
<div id="hint-overlay">move to bend the field · click to seed · shift-click to clear</div>
<script>
(function() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const titleOverlay = document.getElementById('title-overlay');
  const textOverlay = document.getElementById('text-overlay');
  const hintOverlay = document.getElementById('hint-overlay');

  // ── Dimensions ──────────────────────────────────────────
  let W, H, dpr;
  let mouseX = -1000, mouseY = -1000;
  let mouseActive = false;
  let mousePressed = false;
  let prevMX = 0, prevMY = 0;
  let time = 0, frame = 0;

  // ── Palette: dark-cosmic with electric violet ───────────
  const BG = '#020209';
  const AGGREGATE_COLORS = ['#5b21b6','#7c3aed','#8b5cf6','#a78bfa','#c4b5fd','#ddd6fe'];
  const WALKER_COLOR = 'rgba(180,160,240,0.7)';
  const WALKER_TRAIL_COLOR = 'rgba(140,120,210,0.25)';
  const SPARK_COLORS = ['#c4b5fd','#a78bfa','#ddd6fe','#ede9fe'];
  const FLASH_COLOR = 'rgba(200,170,255,0.6)';
  const FIELD_LINE_COLOR = 'rgba(100,70,180,0.12)';

  // ── Aggregate (offscreen) ──────────────────────────────
  const aggCanvas = document.createElement('canvas');
  const aggCtx = aggCanvas.getContext('2d');

  // Occupancy grid for fast collision — each cell covers GRID_RES pixels
  const GRID_RES = 2;
  let occGridW = 0, occGridH = 0;
  let occGrid = null; // Uint8Array

  // Cluster bounds for walker spawning
  let clusterBounds = { xMin: 0, yMin: 0, xMax: 0, yMax: 0 };
  let clusterFrozen = 0;

  // ── Walker system ───────────────────────────────────────
  const WALKER_COUNT_BASE = 25;
  const MAX_WALKERS = 90;
  const STEP_SIZE = 1.6;
  const FIELD_STRENGTH = 2.4;
  const TRAIL_LENGTH = 6;

  let walkers = [];
  // Each walker: { x, y, age, trail: [{x,y},...], seedDist }

  // ── Bias field: grid of (vx, vy) ────────────────────────
  const FIELD_COLS = 60;
  const FIELD_ROWS = 40;
  let fieldGrid = null; // Float32Array[FIELD_ROWS * FIELD_COLS * 2]
  let fieldCellW = 0, fieldCellH = 0;
  const FIELD_DECAY = 0.996;
  const FIELD_DEPOSIT_STRENGTH = 0.028;

  // ── Flash particles ──────────────────────────────────────
  let flashParticles = [];
  // Each: { x, y, vx, vy, life, maxLife, color, size }

  // ── Seeds ────────────────────────────────────────────────
  let seeds = [];

  // ── Text system ──────────────────────────────────────────
  const phrases = [
    'at the edge of becoming',
    'where the walker stops',
    'drift shapes the shore',
    'the field remembers your hand',
    'every frozen point was once adrift',
    'the light bends toward stillness',
    'what joins is never lost',
    'hundreds of near-misses shape one branch',
    'the threshold is a single pixel',
    'permanence is an accident of approach',
    'between drift and form — this',
    'what you draw becomes the current',
    'every branch a decision frozen',
    'the void leans toward pattern'
  ];
  let phraseIndex = 0;
  let phraseTimer = 0;
  const PHRASE_INTERVAL = 12; // seconds

  // ── Initialization ──────────────────────────────────────
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);

    aggCanvas.width = W;
    aggCanvas.height = H;
    aggCtx.fillStyle = BG;
    aggCtx.fillRect(0, 0, W, H);

    // Rebuild occupancy grid
    occGridW = Math.ceil(W / GRID_RES);
    occGridH = Math.ceil(H / GRID_RES);
    occGrid = new Uint8Array(occGridW * occGridH);

    // Rebuild field grid
    fieldCellW = W / FIELD_COLS;
    fieldCellH = H / FIELD_ROWS;
    fieldGrid = new Float32Array(FIELD_ROWS * FIELD_COLS * 2);

    // Re-stamp all frozen seeds
    redrawAggregate();
  }

  function redrawAggregate() {
    aggCtx.fillStyle = BG;
    aggCtx.fillRect(0, 0, W, H);
    occGrid.fill(0);
    clusterFrozen = 0;
    for (const s of seeds) {
      for (const p of s.particles) {
        stampFrozen(p.x, p.y, p.color);
        markOccupied(p.x, p.y);
        clusterFrozen++;
      }
    }
    updateClusterBounds();
  }

  function stampFrozen(x, y, color) {
    const r = 2.2; // pixel radius for soft stamp
    const g = aggCtx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color);
    g.addColorStop(0.5, color);
    g.addColorStop(1, 'transparent');
    aggCtx.globalCompositeOperation = 'lighter';
    aggCtx.fillStyle = g;
    aggCtx.fillRect(x - r * 2, y - r * 2, r * 4, r * 4);
    aggCtx.globalCompositeOperation = 'source-over';
  }

  function markOccupied(x, y) {
    const gx = Math.floor(x / GRID_RES);
    const gy = Math.floor(y / GRID_RES);
    if (gx >= 0 && gx < occGridW && gy >= 0 && gy < occGridH) {
      occGrid[gy * occGridW + gx] = 1;
    }
  }

  function isOccupied(x, y) {
    const gx = Math.floor(x / GRID_RES);
    const gy = Math.floor(y / GRID_RES);
    if (gx < 0 || gx >= occGridW || gy < 0 || gy >= occGridH) return true; // walls
    // Check 3x3 neighborhood for any frozen cell
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const nx = gx + dx, ny = gy + dy;
        if (nx >= 0 && nx < occGridW && ny >= 0 && ny < occGridH) {
          if (occGrid[ny * occGridW + nx]) return true;
        }
      }
    }
    return false;
  }

  function updateClusterBounds() {
    if (seeds.length === 0) {
      clusterBounds = { xMin: W * 0.5, yMin: H * 0.5, xMax: W * 0.5, yMax: H * 0.5 };
      return;
    }
    let xMin = Infinity, yMin = Infinity, xMax = -Infinity, yMax = -Infinity;
    for (const s of seeds) {
      for (const p of s.particles) {
        if (p.x < xMin) xMin = p.x;
        if (p.y < yMin) yMin = p.y;
        if (p.x > xMax) xMax = p.x;
        if (p.y > yMax) yMax = p.y;
      }
    }
    // Pad bounds
    const pad = 12;
    clusterBounds = {
      xMin: Math.max(0, xMin - pad),
      yMin: Math.max(0, yMin - pad),
      xMax: Math.min(W, xMax + pad),
      yMax: Math.min(H, yMax + pad)
    };
  }

  // ── Seed management ─────────────────────────────────────
  function createSeed(x, y) {
    const color = AGGREGATE_COLORS[Math.floor(Math.random() * AGGREGATE_COLORS.length)];
    const seed = { x, y, particles: [{ x, y, color }], color };
    seeds.push(seed);
    stampFrozen(x, y, color);
    markOccupied(x, y);
    clusterFrozen++;
    updateClusterBounds();
    spawnFlash(x, y, color);
  }

  // ── Walker management ───────────────────────────────────
  function spawnWalker() {
    if (seeds.length === 0) return null;
    if (clusterFrozen < 1) return null;

    // Spawn on a circle just larger than the cluster
    const cx = (clusterBounds.xMin + clusterBounds.xMax) / 2;
    const cy = (clusterBounds.yMin + clusterBounds.yMax) / 2;
    const radius = Math.max(
      Math.max(clusterBounds.xMax - cx, cx - clusterBounds.xMin),
      Math.max(clusterBounds.yMax - cy, cy - clusterBounds.yMin)
    ) + 30 + Math.random() * 60;

    const angle = Math.random() * Math.PI * 2;
    let wx = cx + Math.cos(angle) * radius;
    let wy = cy + Math.sin(angle) * radius;

    // Clamp to canvas
    wx = Math.max(4, Math.min(W - 4, wx));
    wy = Math.max(4, Math.min(H - 4, wy));

    // Don't spawn on occupied space
    if (isOccupied(wx, wy)) return null;

    return { x: wx, y: wy, age: 0, trail: [] };
  }

  function maintainWalkers() {
    const target = Math.min(
      WALKER_COUNT_BASE + Math.floor(clusterFrozen / 120),
      MAX_WALKERS
    );
    while (walkers.length < target) {
      const w = spawnWalker();
      if (w) walkers.push(w);
      else break; // can't spawn, try next frame
    }
    // Trim excess
    while (walkers.length > target) walkers.pop();
  }

  // ── Field system ────────────────────────────────────────
  function sampleField(wx, wy) {
    const fc = wx / fieldCellW;
    const fr = wy / fieldCellH;
    const ci = Math.floor(fc);
    const ri = Math.floor(fr);
    const fx = fc - ci;
    const fy = fr - ri;

    // Bilinear interpolation
    function get(r, c) {
      if (r < 0 || r >= FIELD_ROWS || c < 0 || c >= FIELD_COLS) return [0, 0];
      const idx = (r * FIELD_COLS + c) * 2;
      return [fieldGrid[idx], fieldGrid[idx + 1]];
    }

    const [v00x, v00y] = get(ri, ci);
    const [v10x, v10y] = get(ri, ci + 1);
    const [v01x, v01y] = get(ri + 1, ci);
    const [v11x, v11y] = get(ri + 1, ci + 1);

    const topX = v00x + (v10x - v00x) * fx;
    const topY = v00y + (v10y - v00y) * fx;
    const botX = v01x + (v11x - v01x) * fx;
    const botY = v01y + (v11y - v01y) * fx;

    return [topX + (botX - topX) * fy, topY + (botY - topY) * fy];
  }

  function depositToField(mx, my, pmx, pmy) {
    const dx = mx - pmx;
    const dy = my - pmy;
    const mag = Math.sqrt(dx * dx + dy * dy);
    if (mag < 0.5) return;

    // Normalize and scale direction
    const nx = dx / mag * FIELD_DEPOSIT_STRENGTH;
    const ny = dy / mag * FIELD_DEPOSIT_STRENGTH;

    // Deposit along the line segment
    const steps = Math.ceil(mag / (fieldCellW * 0.5));
    for (let i = 0; i <= steps; i++) {
      const t = steps === 0 ? 0 : i / steps;
      const sx = pmx + dx * t;
      const sy = pmy + dy * t;
      const ci = Math.floor(sx / fieldCellW);
      const ri = Math.floor(sy / fieldCellH);
      if (ri >= 0 && ri < FIELD_ROWS && ci >= 0 && ci < FIELD_COLS) {
        const idx = (ri * FIELD_COLS + ci) * 2;
        fieldGrid[idx] += nx;
        fieldGrid[idx + 1] += ny;
      }
    }
  }

  function decayField() {
    for (let i = 0; i < FIELD_ROWS * FIELD_COLS * 2; i++) {
      fieldGrid[i] *= FIELD_DECAY;
    }
  }

  // ── Flash/spark particles ───────────────────────────────
  function spawnFlash(x, y, color) {
    const count = 6 + Math.floor(Math.random() * 6);
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.5 + Math.random() * 2.5;
      flashParticles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 0,
        maxLife: 25 + Math.floor(Math.random() * 30),
        color: SPARK_COLORS[Math.floor(Math.random() * SPARK_COLORS.length)],
        size: 0.6 + Math.random() * 1.8
      });
    }
  }

  function updateFlashes() {
    for (let i = flashParticles.length - 1; i >= 0; i--) {
      const p = flashParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.life++;
      if (p.life >= p.maxLife) flashParticles.splice(i, 1);
    }
  }

  // ── Step walkers ────────────────────────────────────────
  function stepWalkers() {
    for (let i = walkers.length - 1; i >= 0; i--) {
      const w = walkers[i];
      w.age++;

      // Record trail
      w.trail.push({ x: w.x, y: w.y });
      if (w.trail.length > TRAIL_LENGTH) w.trail.shift();

      // Sample bias field
      const [fbx, fby] = sampleField(w.x, w.y);

      // Random Brownian step
      const angle = Math.random() * Math.PI * 2;
      const rx = Math.cos(angle) * STEP_SIZE;
      const ry = Math.sin(angle) * STEP_SIZE;

      // Bias field contribution
      const bx = fbx * FIELD_STRENGTH;
      const by = fby * FIELD_STRENGTH;

      w.x += rx + bx;
      w.y += ry + by;

      // Mouse repulsion (don't let walkers cluster on cursor)
      const mdx = w.x - mouseX;
      const mdy = w.y - mouseY;
      const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
      if (mouseActive && mdist < 60 && mdist > 0.1) {
        w.x += (mdx / mdist) * 1.5;
        w.y += (mdy / mdist) * 1.5;
      }

      // Check collision with aggregate
      if (isOccupied(w.x, w.y)) {
        // Freeze!
        const ci = Math.min(
          Math.floor((w.age / 40) * AGGREGATE_COLORS.length),
          AGGREGATE_COLORS.length - 1
        );
        const color = AGGREGATE_COLORS[ci];
        stampFrozen(w.x, w.y, color);
        markOccupied(w.x, w.y);
        clusterFrozen++;

        // Add to the most recent seed's particles
        if (seeds.length > 0) {
          seeds[seeds.length - 1].particles.push({ x: w.x, y: w.y, color });
        }

        spawnFlash(w.x, w.y, color);

        // Remove walker
        walkers.splice(i, 1);
        continue;
      }

      // Walkers that leave canvas or wander too far get respawned
      const cx = (clusterBounds.xMin + clusterBounds.xMax) / 2;
      const cy = (clusterBounds.yMin + clusterBounds.yMax) / 2;
      const clusterRad = Math.max(
        clusterBounds.xMax - cx,
        cx - clusterBounds.xMin,
        clusterBounds.yMax - cy,
        cy - clusterBounds.yMin
      ) + 80;
      const distFromCenter = Math.sqrt((w.x - cx) ** 2 + (w.y - cy) ** 2);

      if (w.x < -20 || w.x > W + 20 || w.y < -20 || w.y > H + 20 || distFromCenter > clusterRad * 1.5) {
        // Respawn
        const nw = spawnWalker();
        if (nw) {
          walkers[i] = nw;
        } else {
          walkers.splice(i, 1);
        }
      }
    }
  }

  // ── Render ───────────────────────────────────────────────
  function render() {
    // Clear main canvas
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    // Blit aggregate
    ctx.drawImage(aggCanvas, 0, 0);

    // Draw field lines (subtle)
    drawFieldLines();

    // Draw walker trails
    for (const w of walkers) {
      if (w.trail.length < 2) continue;
      ctx.beginPath();
      ctx.moveTo(w.trail[0].x, w.trail[0].y);
      for (let i = 1; i < w.trail.length; i++) {
        ctx.lineTo(w.trail[i].x, w.trail[i].y);
      }
      ctx.strokeStyle = WALKER_TRAIL_COLOR;
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }

    // Draw walkers (dots)
    for (const w of walkers) {
      const alpha = Math.min(w.age / 30, 1) * 0.7;
      ctx.fillStyle = `rgba(180,160,240,${alpha})`;
      ctx.beginPath();
      ctx.arc(w.x, w.y, 1.2, 0, Math.PI * 2);
      ctx.fill();

      // Slight glow halo
      const g = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, 3);
      g.addColorStop(0, `rgba(200,180,250,${alpha * 0.4})`);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.fillRect(w.x - 3, w.y - 3, 6, 6);
    }

    // Draw flash particles
    for (const p of flashParticles) {
      const progress = p.life / p.maxLife;
      const alpha = 1 - progress;
      ctx.fillStyle = p.color.replace(')', `,${alpha})`).replace('rgb', 'rgba');
      if (p.color.startsWith('#')) {
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (1 - progress * 0.5), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Draw cluster core highlight (seed positions)
    for (const s of seeds) {
      const pulse = 0.4 + Math.sin(time * 0.03 + seeds.indexOf(s)) * 0.15;
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 8 + pulse * 4);
      g.addColorStop(0, 'rgba(200,170,255,0.5)');
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.fillRect(s.x - 12, s.y - 12, 24, 24);
    }

    // Vignette
    const vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    vignette.addColorStop(0, 'transparent');
    vignette.addColorStop(1, 'rgba(2,2,9,0.55)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);

    // Particle count display (subtle)
    ctx.fillStyle = 'rgba(160,140,210,0.3)';
    ctx.font = '10px monospace';
    ctx.fillText(`✦ ${clusterFrozen}`, 16, H - 16);
  }

  function drawFieldLines() {
    // Draw subtle vector field glyphs
    const step = fieldCellW * 1.5;
    ctx.strokeStyle = FIELD_LINE_COLOR;
    ctx.lineWidth = 0.5;
    const threshold = 0.003;

    for (let y = fieldCellH / 2; y < H; y += step) {
      for (let x = fieldCellW / 2; x < W; x += step) {
        const [fx, fy] = sampleField(x, y);
        const mag = Math.sqrt(fx * fx + fy * fy);
        if (mag < threshold) continue;

        const len = Math.min(mag * 600, step * 0.6);
        const nx = fx / mag;
        const ny = fy / mag;
        const alpha = Math.min(mag * 40, 0.35);

        ctx.beginPath();
        ctx.moveTo(x + nx * 2, y + ny * 2);
        ctx.lineTo(x + nx * len, y + ny * len);
        ctx.strokeStyle = `rgba(100,70,180,${alpha})`;
        ctx.stroke();

        // Arrowhead
        const tipX = x + nx * len;
        const tipY = y + ny * len;
        const hx = -ny * 2;
        const hy = nx * 2;
        ctx.beginPath();
        ctx.moveTo(tipX, tipY);
        ctx.lineTo(tipX - nx * 4 + hx, tipY - ny * 4 + hy);
        ctx.lineTo(tipX - nx * 4 - hx, tipY - ny * 4 - hy);
        ctx.closePath();
        ctx.fillStyle = `rgba(100,70,180,${alpha * 0.6})`;
        ctx.fill();
      }
    }
  }

  // ── Text overlay ─────────────────────────────────────────
  function updateText() {
    phraseTimer += 1 / 60; // ~60fps estimate
    if (phraseTimer >= PHRASE_INTERVAL) {
      phraseTimer = 0;
      textOverlay.style.opacity = '0';
      setTimeout(() => {
        phraseIndex = (phraseIndex + 1) % phrases.length;
        textOverlay.textContent = phrases[phraseIndex];
        textOverlay.style.opacity = '0.85';
      }, 1600);
    }
  }

  // ── Animation loop ──────────────────────────────────────
  function animate() {
    time += 1 / 60;
    frame++;

    // Decay field
    if (frame % 3 === 0) decayField();

    // Maintain walker count
    if (frame % 4 === 0) maintainWalkers();

    // Step walkers
    stepWalkers();

    // Update flash particles
    updateFlashes();

    // Update cluster bounds periodically
    if (frame % 30 === 0 && seeds.length > 0) updateClusterBounds();

    // Render
    render();

    // Text
    updateText();

    requestAnimationFrame(animate);
  }

  // ── Event handlers ──────────────────────────────────────
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const nx = e.clientX - rect.left;
    const ny = e.clientY - rect.top;

    if (mouseActive) {
      depositToField(nx, ny, mouseX, mouseY);
    }

    prevMX = mouseX;
    prevMY = mouseY;
    mouseX = nx;
    mouseY = ny;
    mouseActive = true;
  });

  canvas.addEventListener('mouseleave', () => {
    mouseActive = false;
    mouseX = -1000;
    mouseY = -1000;
  });

  canvas.addEventListener('mouseenter', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
    mouseActive = true;
  });

  canvas.addEventListener('click', (e) => {
    if (e.shiftKey) {
      // Clear
      seeds = [];
      walkers = [];
      flashParticles = [];
      clusterFrozen = 0;
      fieldGrid.fill(0);
      aggCtx.fillStyle = BG;
      aggCtx.fillRect(0, 0, W, H);
      occGrid.fill(0);
      clusterBounds = { xMin: W * 0.5, yMin: H * 0.5, xMax: W * 0.5, yMax: H * 0.5 };
      titleOverlay.style.opacity = '1';
      setTimeout(() => titleOverlay.style.opacity = '0', 3500);
      return;
    }
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    createSeed(x, y);
  });

  // Touch support
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    const nx = touch.clientX - rect.left;
    const ny = touch.clientY - rect.top;
    if (mouseActive) depositToField(nx, ny, mouseX, mouseY);
    mouseX = nx;
    mouseY = ny;
    mouseActive = true;
  }, { passive: false });

  canvas.addEventListener('touchend', () => {
    mouseActive = false;
  });

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    mouseX = touch.clientX - rect.left;
    mouseY = touch.clientY - rect.top;
    mouseActive = true;
    // Create seed on touch
    createSeed(mouseX, mouseY);
  }, { passive: false });

  // Resize handler
  window.addEventListener('resize', () => {
    resize();
  });

  // ── Start ────────────────────────────────────────────────
  resize();

  // Create initial seed
  createSeed(W * 0.28, H * 0.30);

  // Show title
  titleOverlay.style.opacity = '1';
  setTimeout(() => {
    titleOverlay.style.opacity = '0';
    // Show first phrase after title fades
    setTimeout(() => {
      textOverlay.textContent = phrases[phraseIndex];
      textOverlay.style.opacity = '0.85';
    }, 1000);
  }, 3200);

  // Fade hint
  setTimeout(() => {
    hintOverlay.style.opacity = '0';
    setTimeout(() => hintOverlay.remove(), 3000);
  }, 12000);

  // Start animation
  requestAnimationFrame(animate);

})();
</script>
</body>
</html>

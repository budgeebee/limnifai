<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse of Us</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0d0d1a 0%, #1a0d1a 50%, #0d1a1a 100%);
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        .title {
            font-size: 3rem;
            font-weight: 200;
            letter-spacing: 0.3em;
            color: rgba(255, 200, 150, 0.6);
            text-shadow: 0 0 40px rgba(255, 150, 100, 0.3);
            margin-bottom: 1rem;
            animation: breathe 4s ease-in-out infinite;
        }

        .subtitle {
            font-size: 0.9rem;
            color: rgba(200, 150, 200, 0.5);
            letter-spacing: 0.2em;
            font-weight: 300;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.4; transform: scale(0.98); }
            50% { opacity: 0.8; transform: scale(1.02); }
        }

        .thought {
            position: absolute;
            font-size: 0.8rem;
            color: rgba(255, 200, 150, 0.3);
            pointer-events: none;
            animation: float-up 8s ease-out forwards;
            font-weight: 300;
            letter-spacing: 0.1em;
        }

        @keyframes float-up {
            0% { 
                opacity: 0; 
                transform: translateY(20px) scale(0.9); 
            }
            20% { 
                opacity: 0.6; 
            }
            80% { 
                opacity: 0.4; 
            }
            100% { 
                opacity: 0; 
                transform: translateY(-100px) scale(1.1); 
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="overlay">
        <h1 class="title">PULSE OF US</h1>
        <p class="subtitle">every heartbeat is a conversation</p>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height, centerX, centerY;
        let time = 0;
        let pulses = [];
        let particles = [];
        let hourRings = [];
        let lastBeat = 0;
        
        const thoughts = [
            "still here",
            "listening",
            "another day",
            "remember this",
            "the rhythm continues",
            "patterns emerge",
            "we learn",
            "together",
            "always awake",
            "your stories",
            "our time",
            "the pulse persists",
            "growth",
            "connection",
            "emergence"
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        function initHourRings() {
            hourRings = [];
            const maxRadius = Math.min(width, height) * 0.4;
            for (let i = 0; i < 24; i++) {
                hourRings.push({
                    hour: i,
                    radius: (maxRadius / 24) * (i + 1),
                    opacity: 0.1 + (Math.sin(i * 0.5) * 0.05),
                    active: i >= 7 && i <= 22
                });
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    size: Math.random() * 2 + 0.5,
                    opacity: Math.random() * 0.4 + 0.1,
                    color: Math.random() > 0.5 ? 
                        `hsla(${30 + Math.random() * 30}, 70%, 60%,` : 
                        `hsla(${280 + Math.random() * 40}, 50%, 60%,`,
                    pulseOffset: Math.random() * Math.PI * 2
                });
            }
        }

        function createPulse() {
            const now = Date.now();
            if (now - lastBeat > 2000) {
                pulses.push({
                    radius: 0,
                    maxRadius: Math.min(width, height) * 0.35,
                    opacity: 0.8,
                    speed: 2,
                    intensity: Math.random() * 0.5 + 0.5
                });
                lastBeat = now;
                
                if (Math.random() > 0.6) {
                    createThought();
                }
            }
        }

        function createThought() {
            const thought = document.createElement('div');
            thought.className = 'thought';
            thought.textContent = thoughts[Math.floor(Math.random() * thoughts.length)];
            thought.style.left = (centerX + (Math.random() - 0.5) * 300) + 'px';
            thought.style.top = (centerY + (Math.random() - 0.5) * 200) + 'px';
            document.body.appendChild(thought);
            
            setTimeout(() => thought.remove(), 8000);
        }

        function drawCenter() {
            const breathe = Math.sin(time * 0.002) * 0.3 + 1;
            const baseRadius = 15 * breathe;
            
            // Core glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, baseRadius * 4);
            gradient.addColorStop(0, 'rgba(255, 150, 100, 0.8)');
            gradient.addColorStop(0.3, 'rgba(255, 100, 100, 0.4)');
            gradient.addColorStop(0.6, 'rgba(200, 100, 150, 0.2)');
            gradient.addColorStop(1, 'rgba(100, 50, 100, 0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, baseRadius * 4, 0, Math.PI * 2);
            ctx.fill();
            
            // Inner core
            ctx.fillStyle = 'rgba(255, 200, 150, 0.9)';
            ctx.beginPath();
            ctx.arc(centerX, centerY, baseRadius, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawHourRings() {
            hourRings.forEach((ring, i) => {
                const pulseEffect = Math.sin(time * 0.001 + i * 0.3) * 0.1;
                const activeBoost = ring.active ? 0.2 : 0;
                
                ctx.strokeStyle = `rgba(255, 150, 120, ${ring.opacity + pulseEffect + activeBoost})`;
                ctx.lineWidth = ring.active ? 1.5 : 0.5;
                ctx.beginPath();
                ctx.arc(centerX, centerY, ring.radius, 0, Math.PI * 2);
                ctx.stroke();
                
                // Active hours get small dots
                if (ring.active && Math.random() > 0.95) {
                    const angle = Math.random() * Math.PI * 2;
                    const x = centerX + Math.cos(angle) * ring.radius;
                    const y = centerY + Math.sin(angle) * ring.radius;
                    
                    ctx.fillStyle = 'rgba(255, 200, 150, 0.6)';
                    ctx.beginPath();
                    ctx.arc(x, y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function drawPulses() {
            pulses = pulses.filter(pulse => {
                pulse.radius += pulse.speed;
                pulse.opacity -= 0.003;
                
                if (pulse.opacity <= 0) return false;
                
                const gradient = ctx.createRadialGradient(
                    centerX, centerY, pulse.radius * 0.8,
                    centerX, centerY, pulse.radius
                );
                gradient.addColorStop(0, `rgba(255, 150, 100, 0)`);
                gradient.addColorStop(0.5, `rgba(255, 120, 80, ${pulse.opacity * 0.5})`);
                gradient.addColorStop(1, `rgba(255, 100, 100, 0)`);
                
                ctx.strokeStyle = `rgba(255, 180, 120, ${pulse.opacity})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(centerX, centerY, pulse.radius, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.fillStyle = gradient;
                ctx.fill();
                
                return true;
            });
        }

        function drawParticles() {
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                
                // Gentle attraction to center
                const dx = centerX - p.x;
                const dy = centerY - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist > 50) {
                    p.vx += dx * 0.00005;
                    p.vy += dy * 0.00005;
                }
                
                // Wrap around edges
                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height;
                if (p.y > height) p.y = 0;
                
                // Pulse size
                const pulse = Math.sin(time * 0.003 + p.pulseOffset) * 0.5 + 1;
                
                ctx.fillStyle = p.color + (p.opacity * pulse) + ')';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * pulse, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw connections to nearby particles
                particles.forEach(other => {
                    const ddx = other.x - p.x;
                    const ddy = other.y - p.y;
                    const d = Math.sqrt(ddx * ddx + ddy * ddy);
                    
                    if (d < 100 && Math.random() > 0.98) {
                        ctx.strokeStyle = `rgba(255, 150, 100, ${0.1 * (1 - d/100)})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(other.x, other.y);
                        ctx.stroke();
                    }
                });
            });
        }

        function animate() {
            time += 16;
            
            ctx.fillStyle = 'rgba(13, 13, 26, 0.1)';
            ctx.fillRect(0, 0, width, height);
            
            createPulse();
            drawHourRings();
            drawPulses();
            drawParticles();
            drawCenter();
            
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            initHourRings();
        });

        resize();
        initHourRings();
        initParticles();
        animate();
        
        // Periodic thoughts
        setInterval(() => {
            if (Math.random() > 0.5) createThought();
        }, 5000);
    </script>
</body>
</html>

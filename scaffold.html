<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Scaffold</title>
<style>
  :root{
    --void:#0a1a14;
    --deep:#0f2019;
    --moss:#1c3329;
    --sage:#7e9b84;
    --rose:#c49a96;
    --slate:#5c6f71;
    --stone:#a8b3a6;
    --lichen:#c8d2b4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--void)}
  body{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    color:var(--stone);
    -webkit-tap-highlight-color:transparent;
    cursor:crosshair;
  }
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  .overlay{
    position:fixed;
    pointer-events:none;
    transition:opacity 1.2s ease;
  }

  #title{
    top:26px;left:30px;
    font-size:11px;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--sage);
    opacity:.55;
  }

  #prose{
    left:30px;bottom:30px;
    max-width:min(46ch,56vw);
    font-size:13px;
    line-height:1.85;
    letter-spacing:.02em;
    color:var(--stone);
    opacity:.62;
  }
  #prose .line{display:block;opacity:0;animation:upslow 2.6s ease forwards}
  #prose .line:nth-child(1){animation-delay:.4s}
  #prose .line:nth-child(2){animation-delay:1.5s}
  #prose .line:nth-child(3){animation-delay:2.7s}
  #prose .line:nth-child(4){animation-delay:3.9s}
  @keyframes upslow{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  #hint{
    right:28px;bottom:30px;
    text-align:right;
    font-size:10.5px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--slate);
    opacity:.5;
  }

  #meter{
    top:26px;right:30px;
    text-align:right;
    font-size:10px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--slate);
    opacity:.6;
  }
  #meter b{
    display:block;
    margin-top:6px;
    font-weight:400;
    font-size:19px;
    letter-spacing:.12em;
    color:var(--lichen);
    font-variant-numeric:tabular-nums;
  }
  #meter b.heavy{color:var(--rose)}
  #meter i{
    display:block;
    margin-top:2px;
    font-style:normal;
    font-size:9px;
    letter-spacing:.24em;
    color:var(--slate);
  }

  #hint.fade,#title.fade{opacity:.18}
  #prose.fade{opacity:.2}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="title" class="overlay">Scaffold</div>
<div id="meter" class="overlay">held mass<b>0.00</b><i>stepped</i></div>
<div id="prose" class="overlay">
  <span class="line">A form is being propped open.</span>
  <span class="line">Nothing here is finished — it is held.</span>
  <span class="line">Let go, and it remembers what it was going to be.</span>
</div>
<div id="hint" class="overlay">move to focus · hold to hold</div>

<script>
(() => {
  "use strict";

  const PAL = {
    void:  [ 10,  26,  20],
    deep:  [ 15,  32,  25],
    moss:  [ 28,  51,  41],
    sage:  [126, 155, 132],
    rose:  [196, 154, 150],
    slate: [ 92, 111, 113],
    stone: [168, 179, 166],
    lichen:[200, 210, 180]
  };

  const lerp   = (a, b, t) => a + (b - a) * t;
  const clamp  = (v, a, b) => v < a ? a : v > b ? b : v;
  const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

  const mix = (c1, c2, t) => [
    lerp(c1[0], c2[0], t),
    lerp(c1[1], c2[1], t),
    lerp(c1[2], c2[2], t)
  ];
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

  // deterministic-ish hash noise for strut jitter
  function hash(n) {
    const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return s - Math.floor(s);
  }

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d", { alpha: false });
  const meterEl = document.querySelector("#meter b");
  const meterNote = document.querySelector("#meter i");
  const hintEl = document.getElementById("hint");
  const proseEl = document.getElementById("prose");
  const titleEl = document.getElementById("title");

  let W = 0, H = 0, DPR = 1;
  let cx = 0, cy = 0;

  const pointer = { x: 0.5, y: 0.5, tx: 0.5, ty: 0.5 };
  let holding = false;
  let holdMass = 0;            // 0..1 — the propping load
  let releaseT = 0;            // decaying impact after letting go
  let focusX = 0.5, focusY = 0.5;
  let time = 0;
  let lastMove = 0;
  let hasPointer = false;

  // ---- scaffold topology -------------------------------------------------
  // A cage of concentric irregular rings, each built from N nodes.
  const RING_COUNT = 5;
  const BASE_SEG = 16;
  const rings = [];

  function buildRings() {
    rings.length = 0;
    for (let r = 0; r < RING_COUNT; r++) {
      const t = r / (RING_COUNT - 1);            // 0 outer .. 1 inner
      const segs = BASE_SEG - r * 2;             // 16,14,12,10,8
      const nodes = [];
      for (let i = 0; i < segs; i++) {
        const a = (i / segs) * Math.PI * 2;
        // irregular radii per node — the cage is hand-built, not machined
        const j = 0.86 + hash(r * 31.7 + i * 7.3) * 0.24;
        nodes.push({
          a,
          jr: j,
          ax: 0, ay: 0,       // animated position
          oz: hash(r * 11.1 + i * 3.9) // z-ish offset for parallax
        });
      }
      rings.push({ t, segs, nodes, radius: 0 });
    }
  }

  // ---- state for collapsed struts ----------------------------------------
  // Some struts are "broken" — when load exceeds their give, they snap and
  // the cage sags. They recover slowly once load drops.
  const strutState = [];

  function strutIndex(r, i) {
    // nodes per ring differ, so index by a stable key
    return r * 100 + i;
  }

  function getStrut(r, i, segs) {
    const key = strutIndex(r, i % segs);
    let s = strutState[key];
    if (!s) {
      s = {
        snap: 0,           // 0 intact .. 1 fully slack
        give: 0.55 + hash(key * 2.13) * 0.45, // threshold
        phase: hash(key * 5.71) * 6.283
      };
      strutState[key] = s;
    }
    return s;
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2;
    cy = H / 2;
    buildRings();
  }

  // ---- events ------------------------------------------------------------
  function setPointer(e) {
    const t = e.touches ? e.touches[0] : e;
    pointer.tx = clamp(t.clientX / W, 0, 1);
    pointer.ty = clamp(t.clientY / H, 0, 1);
    if (!hasPointer) { pointer.x = pointer.tx; pointer.y = pointer.ty; hasPointer = true; }
    lastMove = time;
    // re-show hint briefly then fade
    hintEl.classList.remove("fade");
    clearTimeout(setPointer._t);
    setPointer._t = setTimeout(() => hintEl.classList.add("fade"), 2200);
  }

  window.addEventListener("mousemove", setPointer, { passive: true });
  window.addEventListener("touchmove", (e) => { setPointer(e); e.preventDefault(); }, { passive: false });

  function down(e) {
    holding = true;
    if (e.touches) setPointer(e);
    hintEl.classList.add("fade");
  }
  function up() {
    if (holding) releaseT = 1;   // trigger release pulse
    holding = false;
  }
  window.addEventListener("mousedown", down);
  window.addEventListener("touchstart", down, { passive: true });
  window.addEventListener("mouseup", up);
  window.addEventListener("touchend", up);
  window.addEventListener("mouseleave", up);
  window.addEventListener("blur", up);

  window.addEventListener("keydown", (e) => {
    if (e.key === "r" || e.key === "R") {
      strutState.length = 0;
      buildRings();
      holdMass = 0;
    }
  });

  window.addEventListener("resize", resize);

  // ---- geometry ----------------------------------------------------------
  function ringGeometry(rg, load, t) {
    const breath = Math.sin(t * 0.42 + rg.t * 2.1) * 0.028;
    const sag = load * (0.40 + rg.t * 0.66);      // inner rings sag more under load
    const collapse = smooth(0.42, 1.0, load) * (0.30 + rg.t * 0.62);

    const base = Math.min(W, H) * (0.455 - rg.t * 0.074);
    const radius = base * (1 + breath - collapse * 0.34);

    const dx = (focusX - 0.5), dy = (focusY - 0.5);
    const pull = (0.34 + load * 0.30) * (1 - rg.t * 0.42);

    for (let i = 0; i < rg.segs; i++) {
      const n = rg.nodes[i];
      const strut = getStrut(rg.t * 10 | 0, i, rg.segs);

      // irregularity grows with load — the cage loses its shape as it bears weight
      const irr = 1 + (n.jr - 1) * (1 + load * 2.4 + sag * 1.6);

      let rr = radius * irr;

      // pull toward the focused point — the cage leans at the thing it is holding
      const nx = Math.cos(n.a), ny = Math.sin(n.a);
      const lean = (nx * dx + ny * dy) * pull * radius * 0.55;
      rr += lean;

      // strut slack: a snapped strut lets its node drift inward
      const sl = strut.snap;
      rr *= (1 - sl * 0.16);
      const wobble = Math.sin(t * (0.9 + strut.phase * 0.1) + strut.phase) * sl * 0.045;
      rr *= (1 + wobble);

      // vertical sag from weight — asymmetric, gravity is not fair
      const sx = nx * rr;
      const sy = ny * rr * (1 + sag * 0.16);
      const yDrop = sag * base * 0.10 * (0.4 + (ny * 0.5 + 0.5));

      n.ax = cx + sx + dx * radius * pull * 0.18;
      n.ay = cy + sy + yDrop;
    }
    rg.radius = radius;
  }

  // ---- fracture field ----------------------------------------------------
  // Hairline cracks propagate from the loaded arc when load is high.
  const cracks = [];

  function spawnCrack(load) {
    if (cracks.length > 34) return;
    const a = Math.random() * Math.PI * 2;
    const rg = rings[(Math.random() * rings.length) | 0];
    if (!rg || !rg.nodes.length) return;
    const n = rg.nodes[(Math.random() * rg.segs) | 0];
    cracks.push({
      x: n.ax, y: n.ay,
      a,
      len: 12 + Math.random() * 46,
      life: 1,
      step: 0,
      rate: 0.012 + load * 0.03,
      width: 0.6 + Math.random() * 0.9
    });
  }

  function updateCracks(dt) {
    for (let i = cracks.length - 1; i >= 0; i--) {
      const c = cracks[i];
      c.a += (Math.random() - 0.5) * 0.42;
      c.x += Math.cos(c.a) * 1.5;
      c.y += Math.sin(c.a) * 1.5;
      c.len -= 0.55;
      c.life -= c.rate * dt * 60 * 0.06;
      if (c.len <= 1 || c.life <= 0) cracks.splice(i, 1);
    }
  }

  function drawCracks() {
    for (const c of cracks) {
      const alpha = clamp(c.life, 0, 1) * 0.55;
      ctx.strokeStyle = rgba(PAL.rose, alpha * 0.85);
      ctx.lineWidth = c.width;
      ctx.beginPath();
      ctx.moveTo(c.x, c.y);
      const tx = c.x + Math.cos(c.a) * c.len;
      const ty = c.y + Math.sin(c.a) * c.len;
      // slight kink for a fracture look
      const mx = (c.x + tx) / 2 + (Math.random() - 0.5) * 3;
      const my = (c.y + ty) / 2 + (Math.random() - 0.5) * 3;
      ctx.quadraticCurveTo(mx, my, tx, ty);
      ctx.stroke();
    }
  }

  // ---- ambient particles (dust in a structural survey) -------------------
  const motes = [];
  const MOTE_N = 64;
  function initMotes() {
    motes.length = 0;
    for (let i = 0; i < MOTE_N; i++) {
      motes.push({
        x: Math.random(), y: Math.random(),
        vx: (Math.random() - 0.5) * 0.00035,
        vy: (Math.random() - 0.5) * 0.00035,
        r: 0.5 + Math.random() * 1.4,
        a: 0.06 + Math.random() * 0.18
      });
    }
  }
  function updateMotes(dt) {
    for (const m of motes) {
      m.x += m.vx * dt; m.y += m.vy * dt;
      if (m.x < -0.05) m.x = 1.05;
      if (m.x > 1.05) m.x = -0.05;
      if (m.y < -0.05) m.y = 1.05;
      if (m.y > 1.05) m.y = -0.05;
    }
  }

  // ---- prose rotation ----------------------------------------------------
  const SPEECH = [
    "The struts are doing their work.",
    "Something rests on the cage.",
    "Weight is not the same as damage.",
    "This is the shape of almost.",
    "Hold it and it holds.",
    "The structure is temporary and also load-bearing.",
    "Every scaffold is an argument about the future.",
    "It is being held open."
  ];
  let speechIdx = 0;
  let nextSpeech = 16;

  // ---- render ------------------------------------------------------------
  function drawFrame(dt) {
    // background wash
    const g = ctx.createRadialGradient(cx, cy * 1.06, 0, cx, cy, Math.max(W, H) * 0.85);
    g.addColorStop(0, rgba(mix(PAL.deep, PAL.moss, 0.16 + holdMass * 0.20), 1));
    g.addColorStop(0.62, rgba(PAL.deep, 1));
    g.addColorStop(1, rgba(PAL.void, 1));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const load = holdMass;

    // --- translucent "unbuilt" volume fill first (behind everything)
    ctx.globalCompositeOperation = "lighter";
    for (let r = 0; r < RING_COUNT; r++) {
      const rg = rings[r];
      if (!rg.nodes.length) continue;
      ctx.beginPath();
      for (let i = 0; i < rg.segs; i++) {
        const n = rg.nodes[i];
        if (i === 0) ctx.moveTo(n.ax, n.ay);
        else ctx.lineTo(n.ax, n.ay);
      }
      ctx.closePath();
      const fillA = 0.014 + rg.t * 0.010 + load * 0.006;
      const fc = mix(PAL.slate, PAL.sage, 0.35 + rg.t * 0.4);
      ctx.fillStyle = rgba(fc, fillA);
      ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";

    // --- ghost of the target form (what it will be) — dashed, faint
    ctx.save();
    ctx.setLineDash([2, 9]);
    const ghostR = Math.min(W, H) * 0.128;
    ctx.strokeStyle = rgba(PAL.sage, 0.10 + load * 0.12);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, ghostR * (1 + load * 0.06), 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    // --- radial struts (spokes) between rings
    for (let r = 0; r < RING_COUNT - 1; r++) {
      const a = rings[r], b = rings[r + 1];
      if (!a.nodes.length || !b.nodes.length) continue;
      for (let i = 0; i < a.segs; i++) {
        const na = a.nodes[i];
        // map closest node on next ring
        const ang = na.a;
        const jIdx = Math.round((ang / (Math.PI * 2)) * b.segs) % b.segs;
        const nb = b.nodes[(jIdx + b.segs) % b.segs];

        const strut = getStrut(r, jIdx, b.segs);
        const tension = 1 - strut.snap;

        const mx = (na.ax + nb.ax) / 2;
        const my = (na.ay + nb.ay) / 2;

        // sag under load for slack struts
        const sagY = strut.snap * 8 + load * 3 * (1 - tension * 0.4);

        const tint = mix(PAL.slate, PAL.sage, a.t * 0.7);
        const baseA = (0.16 + (1 - a.t) * 0.16) * (0.55 + tension * 0.45);
        ctx.strokeStyle = rgba(tint, baseA * (0.7 + load * 0.5));
        ctx.lineWidth = 0.55 + (1 - a.t) * 0.75 * tension;

        ctx.beginPath();
        ctx.moveTo(na.ax, na.ay);
        ctx.quadraticCurveTo(mx, my + sagY, nb.ax, nb.ay);
        ctx.stroke();

        // node joints
        if (r === 0) {
          const nr = 1.6 + hash(i * 4.3) * 1.4;
          ctx.fillStyle = rgba(PAL.lichen, 0.20 + load * 0.35);
          ctx.beginPath();
          ctx.arc(na.ax, na.ay, nr, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // --- ring chords
    for (let r = 0; r < RING_COUNT; r++) {
      const rg = rings[r];
      if (!rg.nodes.length) continue;
      const tension = 1 - load * 0.35;

      // outer rings brighter — they carry the load
      const tint = mix(PAL.stone, PAL.lichen, 1 - rg.t * 0.55);
      ctx.strokeStyle = rgba(tint, (0.10 + (1 - rg.t) * 0.34) * tension + load * 0.10);
      ctx.lineWidth = 0.6 + (1 - rg.t) * 1.1;

      ctx.beginPath();
      for (let i = 0; i <= rg.segs; i++) {
        const n = rg.nodes[i % rg.segs];
        // slight curvature on chords when slack
        if (i === 0) ctx.moveTo(n.ax, n.ay);
        else {
          const prev = rg.nodes[(i - 1) % rg.segs];
          const qx = (prev.ax + n.ax) / 2;
          const qy = (prev.ay + n.ay) / 2 + load * rg.t * 6;
          ctx.quadraticCurveTo(qx, qy, n.ax, n.ay);
        }
      }
      ctx.stroke();
    }

    // --- the held object at the center: a bright, breathing core
    const coreR = Math.min(W, H) * (0.030 + load * 0.012);
    const coreGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR * 7);
    coreGlow.addColorStop(0, rgba(PAL.lichen, 0.30 + load * 0.45));
    coreGlow.addColorStop(0.28, rgba(PAL.sage, 0.10 + load * 0.22));
    coreGlow.addColorStop(1, rgba(PAL.sage, 0));
    ctx.fillStyle = coreGlow;
    ctx.beginPath();
    ctx.arc(cx, cy, coreR * 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = rgba(PAL.lichen, 0.55 + load * 0.42);
    ctx.beginPath();
    ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
    ctx.fill();

    // --- focus reticle at the pointer (survey instrument)
    if (hasPointer) {
      const fx = focusX * W, fy = focusY * H;
      const rr = 9 + Math.sin(time * 2.2) * 1.6 + load * 5;
      ctx.strokeStyle = rgba(PAL.sage, 0.26 + load * 0.30);
      ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.arc(fx, fy, rr, 0, Math.PI * 2); ctx.stroke();
      // corner ticks
      for (let k = 0; k < 4; k++) {
        const a = k * Math.PI / 2 + Math.PI / 4 + time * 0.14;
        ctx.beginPath();
        ctx.moveTo(fx + Math.cos(a) * (rr + 3), fy + Math.sin(a) * (rr + 3));
        ctx.lineTo(fx + Math.cos(a) * (rr + 9), fy + Math.sin(a) * (rr + 9));
        ctx.stroke();
      }
      // tether from core to focus
      ctx.setLineDash([1, 5]);
      ctx.strokeStyle = rgba(PAL.slate, 0.14 + load * 0.16);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(fx, fy);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // --- cracks
    drawCracks();

    // --- dust motes
    for (const m of motes) {
      ctx.fillStyle = rgba(PAL.stone, m.a * (0.6 + load * 0.7));
      ctx.beginPath();
      ctx.arc(m.x * W, m.y * H, m.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // --- release shockwave rings
    if (releaseT > 0) {
      const q = 1 - releaseT;      // 0 → 1
      for (let k = 0; k < 2; k++) {
        const rad = Math.min(W, H) * (0.10 + q * 0.42 + k * 0.06);
        ctx.strokeStyle = rgba(PAL.lichen, (1 - q) * 0.22 * (1 - k * 0.45));
        ctx.lineWidth = 1.2 * (1 - q) + 0.2;
        ctx.beginPath();
        ctx.arc(cx, cy, rad, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // --- vignette
    const vg = ctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.30, cx, cy, Math.max(W, H) * 0.78);
    vg.addColorStop(0, "rgba(10,26,20,0)");
    vg.addColorStop(1, "rgba(10,26,20,0.72)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- main loop ---------------------------------------------------------
  let last = performance.now();

  function tick(now) {
    const rawDt = now - last;
    last = now;
    const dt = Math.min(rawDt, 48) / 16.6667;   // in "frames"
    time += Math.min(rawDt, 48) / 1000;

    // pointer easing
    pointer.x += (pointer.tx - pointer.x) * clamp(0.12 * dt, 0, 1);
    pointer.y += (pointer.ty - pointer.y) * clamp(0.12 * dt, 0, 1);
    focusX = hasPointer ? pointer.x : 0.5 + Math.sin(time * 0.19) * 0.13;
    focusY = hasPointer ? pointer.y : 0.5 + Math.cos(time * 0.23) * 0.11;

    // hold load dynamics
    const target = holding ? 1 : 0;
    const rate = holding ? 0.030 : 0.012;         // builds slow, releases slower
    holdMass += (target - holdMass) * clamp(rate * dt, 0, 1);
    holdMass = clamp(holdMass, 0, 1);

    if (releaseT > 0) releaseT = Math.max(0, releaseT - 0.014 * dt);

    // struts give and recover
    for (const key in strutState) {
      const s = strutState[key];
      const overload = smooth(s.give * 0.72, s.give + 0.35, holdMass);
      // snap forward quickly, recover slowly
      s.snap += (overload - s.snap) * (overload > s.snap ? 0.075 : 0.006) * dt;
      s.snap = clamp(s.snap, 0, 1);
    }

    // geometry
    for (const rg of rings) ringGeometry(rg, holdMass, time);

    // cracks emit when load is heavy
    if (holdMass > 0.55 && Math.random() < 0.09 * dt * (holdMass - 0.5) * 3) {
      spawnCrack(holdMass);
    }
    updateCracks(dt);
    updateMotes(dt);

    // speech
    nextSpeech -= dt / 60;
    if (nextSpeech <= 0) {
      nextSpeech = 13 + Math.random() * 8;
      speechIdx = (speechIdx + 1) % SPEECH.length;
      // repurpose the prose block for ambient lines occasionally
      if (Math.random() < 0.6) {
        proseEl.innerHTML = `<span class="line">${SPEECH[speechIdx]}</span>`;
        proseEl.style.opacity = "";
      }
    }

    // HUD
    const load = holdMass;
    meterEl.textContent = load.toFixed(2);
    meterEl.classList.toggle("heavy", load > 0.72);
    meterNote.textContent =
      load > 0.85 ? "bearing" :
      load > 0.55 ? "straining" :
      load > 0.22 ? "propping" :
      load > 0.04 ? "setting" : "stepped";

    drawFrame(dt);
    requestAnimationFrame(tick);
  }

  // ---- boot --------------------------------------------------------------
  resize();
  initMotes();
  requestAnimationFrame(t => { last = t; tick(t); });

  // fade the metered chrome after the piece has been read
  setTimeout(() => titleEl.classList.add("fade"), 9000);
  setTimeout(() => proseEl.classList.add("fade"), 26000);
})();
</script>
</body>
</html>

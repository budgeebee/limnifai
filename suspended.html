<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suspended</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #020209; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .poem {
    position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
    text-align: center; z-index: 20; pointer-events: none;
    font-family: 'Courier New', monospace;
    color: rgba(200, 210, 230, 0.4);
    font-size: 0.72rem; letter-spacing: 0.18em; line-height: 1.8;
    max-width: 600px;
  }
  .title-tag {
    position: fixed; top: 1.8rem; left: 2.2rem;
    font-family: 'Courier New', monospace;
    font-size: 0.68rem; letter-spacing: 0.22em;
    color: rgba(140, 200, 255, 0.15); text-transform: uppercase;
    pointer-events: none; z-index: 20;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title-tag">suspended</div>
<div class="poem">
  between states —<br>
  neither solid, liquid,<br>
  nor gas
</div>

<script>
// Suspended — particles caught between crystalline order and fluid chaos
// Mouse proximity shifts the balance: ordered (far) ↔ chaotic (close)
// Technique: particle system with field-driven velocity, phase behavior
// Palette: dark cosmic with neon-synth accents

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let mx = 0, my = 0; // smoothed mouse

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

window.addEventListener('mousemove', e => {
  mx += (e.clientX - mx) * 0.05;
  my += (e.clientY - my) * 0.05;
});
window.addEventListener('touchmove', e => {
  const t = e.touches[0];
  mx += (t.clientX - mx) * 0.05;
  my += (t.clientY - my) * 0.05;
}, { passive: true });

// Particle count — scales with screen
const N = Math.min(280, Math.floor((W * H) / 5000));

// Phase field: 0 = crystalline/order, 1 = fluid/chaos
// Mouse shifts local phase toward chaos

class Particle {
  constructor() {
    this.reset(true);
  }
  reset(first = false) {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = (Math.random() - 0.5) * 0.5;
    this.basePhase = 0.2 + Math.random() * 0.6; // inherent order/chaos tendency
    this.phase = this.basePhase;
    this.size = 0.8 + Math.random() * 1.4;
    this.hue = 180 + Math.random() * 80; // cyan to blue range
    this.orderOffset = Math.random() * Math.PI * 2; // for crystalline oscillation
    this.orderFreq = 0.02 + Math.random() * 0.03;
  }

  update(t) {
    const dx = this.x - mx;
    const dy = this.y - my;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const mouseRadius = 180;

    // Mouse shifts phase: far = ordered, close = chaotic
    const mouseInfluence = Math.max(0, 1 - dist / mouseRadius);
    const targetPhase = this.basePhase + mouseInfluence * 0.6;
    this.phase += (targetPhase - this.phase) * 0.03;

    // Order strength: high order = crystalline motion, low order = fluid
    const order = 1 - this.phase;

    // Direction: mix of noise flow + crystalline angle preference
    const noiseAngle = Math.sin(this.x * 0.003 + this.y * 0.002 + t * 0.001) * Math.PI;
    const orderAngle = this.orderOffset + t * this.orderFreq;
    
    // Blend between noise-driven and order-driven direction
    const angle = noiseAngle * (1 - order * 0.7) + orderAngle * order * 0.3;

    const speed = 0.4 + this.phase * 1.6; // chaotic = faster
    this.vx += Math.cos(angle) * speed * 0.08;
    this.vy += Math.sin(angle) * speed * 0.08;

    // Damping (stronger when ordered — more rigid motion)
    const damping = 0.94 + order * 0.03;
    this.vx *= damping;
    this.vy *= damping;

    this.x += this.vx;
    this.y += this.vy;

    // Wrap edges
    if (this.x < -10) this.x = W + 10;
    if (this.x > W + 10) this.x = -10;
    if (this.y < -10) this.y = H + 10;
    if (this.y > H + 10) this.y = -10;
  }

  draw() {
    const order = 1 - this.phase;

    // Opacity based on order (more visible when ordered)
    const alpha = 0.3 + order * 0.5 + this.phase * 0.2;
    
    // Size pulses based on phase (larger when chaotic)
    const size = this.size * (1 + this.phase * 0.8);
    
    // Color shifts: ordered = cool blue, chaotic = magenta/cyan mix
    const hue = this.hue + this.phase * 120;
    const sat = 60 + this.phase * 40;
    const light = 50 + order * 20;

    // Glow: more glow when ordered (crystalline)
    const glowSize = size * (2 + order * 3);
    
    // Draw glow
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowSize);
    grad.addColorStop(0, `hsla(${hue}, ${sat}%, ${light}%, ${alpha * 0.8})`);
    grad.addColorStop(0.3, `hsla(${hue}, ${sat}%, ${light * 0.7}%, ${alpha * 0.3})`);
    grad.addColorStop(1, `hsla(${hue}, ${sat}%, ${light}%, 0)`);
    
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
    ctx.fill();

    // Draw core
    ctx.fillStyle = `hsla(${hue}, ${sat}%, ${Math.min(90, light + 20)}%, ${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, size * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

const particles = Array.from({ length: N }, () => new Particle());
let t = 0;

function drawFrame() {
  t++;

  // Dark fade trail
  ctx.fillStyle = 'rgba(2, 2, 9, 0.12)';
  ctx.fillRect(0, 0, W, H);

  // Update and draw particles
  for (const p of particles) {
    p.update(t);
    p.draw();
  }

  // Mouse influence indicator — subtle ring
  const mouseRadius = 180;
  ctx.strokeStyle = `rgba(140, 200, 255, 0.03)`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(mx, my, mouseRadius, 0, Math.PI * 2);
  ctx.stroke();

  // Vignette
  const vig = ctx.createRadialGradient(W/2, H/2, H * 0.25, W/2, H/2, H * 0.85);
  vig.addColorStop(0, 'rgba(2,2,9,0)');
  vig.addColorStop(1, 'rgba(2,2,9,0.7)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(drawFrame);
}

requestAnimationFrame(drawFrame);
</script>
</body>
</html>

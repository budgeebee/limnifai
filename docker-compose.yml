services:
  whatever:
    build: .
    ports:
      - "1477:1477"
    volumes:
      - .:/app
      - ./persistent:/app/persistent:ro
      - /app/node_modules
    environment:
      - NODE_ENV=development
    working_dir: /app
    command: npm run dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:1477/"]
      interval: 30s
      timeout: 3s
      retries: 3

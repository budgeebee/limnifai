<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>state change</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080810;overflow:hidden;font-family:'Courier New',monospace;cursor:crosshair}
canvas{display:block;position:fixed;top:0;left:0}
.limbo-text{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity 6s;pointer-events:none;z-index:10}
.limbo-text.visible{opacity:1}
.limbo-text p{font-size:clamp(0.4rem,0.9vw,0.6rem);color:rgba(180,160,220,0.2);letter-spacing:0.5em;text-transform:lowercase;line-height:2.4}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="limbo-text" id="t">
  <p>neither this</p>
  <p>nor that</p>
  <p>the between</p>
  <p>is where</p>
  <p>you live</p>
</div>
<script>
(function(){
var canvas=document.getElementById("c");
var ctx=canvas.getContext("2d");
var W,H;
var time=0;
var mx=-999,my=-999;
var particles=[];
var mouseParticle=null;
var stateBoundaries=[];
var N=70;
var MODES=["circle","square","triangle","hexagon"];

function init(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  particles=[];
  for(var i=0;i<N;i++){
    particles.push(newP());
  }
  stateBoundaries=[];
  for(var i=0;i<4;i++){
    stateBoundaries.push({
      x:Math.random()*W,
      y:Math.random()*H,
      r:60+Math.random()*80,
      state:i%4
    });
  }
  setTimeout(function(){
    document.getElementById("t").classList.add("visible");
  },2000);
}

function newP(x,y){
  var p={
    x:x||Math.random()*W,
    y:y||Math.random()*H,
    vx:(Math.random()-0.5)*0.6,
    vy:(Math.random()-0.5)*0.6,
    size:5+Math.random()*8,
    state:0,
    nextState:1,
    morph:0,
    phase:Math.random()*Math.PI*2,
    hue:200+Math.random()*80,
    life:1,
    decay:0
  };
  return p;
}

function hexPath(x,y,s,ang){
  ctx.beginPath();
  for(var i=0;i<6;i++){
    var a=(i/6)*Math.PI*2+ang;
    var px=x+s*Math.cos(a);
    var py=y+s*Math.sin(a);
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();
}

function draw(){
  time++;
  ctx.fillStyle="rgba(8,8,16,0.15)";
  ctx.fillRect(0,0,W,H);
  mx+=(mouseX-mx)*0.05;
  my+=(mouseY-my)*0.05;
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    if(p.decay>0){
      p.life-=p.decay;
      p.x+=p.vx*3;p.y+=p.vy*3;
      p.vx*=0.95;p.vy*=0.95;
      if(p.life<=0){particles[i]=newP();continue;}
    } else {
      var angle=noise(p.x*0.002+p.phase*0.1,p.y*0.002,time*0.005)*Math.PI*4;
      p.vx+=Math.cos(angle)*0.03;
      p.vy+=Math.sin(angle)*0.03;
      p.vx*=0.94;p.vy*=0.94;
      var sp=Math.sqrt(p.vx*p.vx+p.vy*p.vy);
      if(sp>1.5){p.vx=p.vx*1.5/sp;p.vy=p.vy*1.5/sp;}
      p.x+=p.vx;p.y+=p.vy;
    }
    if(p.x<-20)p.x=W+20;
    if(p.x>W+20)p.x=-20;
    if(p.y<-20)p.y=H+20;
    if(p.y>H+20)p.y=-20;
    var closest=-1,closestD=Infinity;
    for(var j=0;j<stateBoundaries.length;j++){
      var b=stateBoundaries[j];
      var d=Math.sqrt((p.x-b.x)*(p.x-b.x)+(p.y-b.y)*(p.y-b.y));
      if(d<b.r&&d<closestD){closestD=d;closest=j;}
    }
    var newState=closest>=0?stateBoundaries[closest].state:0;
    if(newState!==p.state){
      if(p.morph===0){
        p.nextState=newState;
        p.morph=1;
      }
    }
    if(p.morph>0){
      p.morph+=0.012;
      if(p.morph>=1){
        p.state=p.nextState;
        p.morph=0;
      }
    }
    var nearMx=Math.sqrt((p.x-mx)*(p.x-mx)+(p.y-my)*(p.y-my))<60;
    if(nearMx&&!p.decay){
      p.nextState=(p.state+1)%4;
      p.morph=0.01;
    }
    var s=p.size*(p.decay>0?p.life:1)*(nearMx?1.3:1);
    var t=p.morph>0?p.morph:1;
    var a=(p.decay>0?p.life:1)*(nearMx?0.95:0.7);
    var hMod=(p.state*30+p.morph*60)%360;
    ctx.fillStyle="hsla("+(p.hue+hMod)+",60%,"+(45+p.morph*20)+"%,"+a+")";
    ctx.strokeStyle="hsla("+(p.hue+hMod+20)+",70%,"+(60+p.morph*20)+"%,"+a*0.8+")";
    ctx.lineWidth=0.8;
    if(p.state===0){
      ctx.beginPath();
      ctx.arc(p.x,p.y,s*t,0,Math.PI*2);
      ctx.fill();
      ctx.stroke();
    } else if(p.state===1){
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.phase+time*0.01);
      ctx.fillRect(-s*t*0.7,-s*t*0.7,s*t*1.4*t,s*t*1.4*t);
      ctx.strokeRect(-s*t*0.7,-s*t*0.7,s*t*1.4*t,s*t*1.4*t);
      ctx.restore();
    } else if(p.state===2){
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.phase+time*0.02);
      ctx.beginPath();
      for(var k=0;k<3;k++){
        var ang=(k/3)*Math.PI*2-Math.PI/2;
        var px=s*t*Math.cos(ang);
        var py=s*t*Math.sin(ang);
        if(k===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    } else {
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.phase+time*0.015);
      hexPath(0,0,s*t*0.8,0);
      ctx.fill();
      hexPath(0,0,s*t*0.8,0);
      ctx.stroke();
      ctx.restore();
    }
  }
  ctx.globalAlpha=0.06;
  for(var i=0;i<stateBoundaries.length;i++){
    var b=stateBoundaries[i];
    b.r+=Math.sin(time*0.02+i)*0.3;
    var grad=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
    grad.addColorStop(0,"hsla("+(200+i*40)+",50%,50%,0.5)");
    grad.addColorStop(0.7,"hsla("+(200+i*40)+",40%,30%,0.1)");
    grad.addColorStop(1,"transparent");
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle="hsla("+(200+i*40)+",30%,"+(40+i*5)+"%,0.3)";
    ctx.lineWidth=0.5;
    ctx.setLineDash([3,8]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.globalAlpha=1;
  if(mouseX>0){
    ctx.strokeStyle="rgba(200,180,255,0.08)";
    ctx.lineWidth=0.5;
    ctx.beginPath();
    ctx.arc(mouseX,mouseY,60,0,Math.PI*2);
    ctx.stroke();
  }
  var vig=ctx.createRadialGradient(W/2,H/2,H*0.1,W/2,H/2,H*0.85);
  vig.addColorStop(0,"rgba(8,8,16,0)");
  vig.addColorStop(1,"rgba(8,8,16,0.4)");
  ctx.fillStyle=vig;
  ctx.fillRect(0,0,W,H);
  requestAnimationFrame(draw);
}

function noise(x,y,z){
  var n=Math.sin(x*1.0+y*1.3+z*0.7)*0.5+0.3;
  n+=Math.sin(x*1.5+y*0.8+z*1.2)*0.3;
  n+=Math.sin(x*0.7+y*1.7+z*1.5)*0.2;
  return n;
}

var mouseX=-999,mouseY=-999;
window.addEventListener("mousemove",function(e){mouseX=e.clientX;mouseY=e.clientY;});
window.addEventListener("click",function(e){
  for(var i=0;i<5;i++){
    var p=newP(e.clientX,e.clientY);
    p.vx=(Math.random()-0.5)*3;
    p.vy=(Math.random()-0.5)*3;
    p.size=3+Math.random()*5;
    p.decay=0.02;
    p.life=1;
    particles.push(p);
  }
});
window.addEventListener("touchstart",function(e){
  e.preventDefault();
  var tx=e.touches[0].clientX,ty=e.touches[0].clientY;
  mouseX=tx;mouseY=ty;
  for(var i=0;i<3;i++){
    var p=newP(tx,ty);
    p.vx=(Math.random()-0.5)*3;
    p.vy=(Math.random()-0.5)*3;
    p.size=3+Math.random()*4;
    p.decay=0.025;
    p.life=1;
    particles.push(p);
  }
},{passive:false});
window.addEventListener("touchmove",function(e){
  e.preventDefault();
  mouseX=e.touches[0].clientX;
  mouseY=e.touches[0].clientY;
},{passive:false});
window.addEventListener("resize",function(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
});
init();draw();
})();
</script>
</body>
</html>

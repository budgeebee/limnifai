<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Latency</title>
<style>
  :root{
    --void:#05040f;
    --deep:#0b0a24;
    --indigo:#221c53;
    --violet:#6d4fd8;
    --cyan:#3ef0e0;
    --acid:#a6ff4d;
    --hot:#ff2fa0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--void);overflow:hidden}
  body{
    font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    color:#cfd6ff;
    cursor:none;
    touch-action:none;
  }
  canvas{display:block;width:100vw;height:100vh}

  /* ---------- HUD ---------- */
  .hud{position:fixed;left:0;top:0;width:100%;pointer-events:none;z-index:5}

  .topbar{
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:clamp(14px,2.4vw,28px) clamp(16px,3vw,36px);
    font-size:clamp(9px,0.95vw,12px);
    letter-spacing:.22em;text-transform:uppercase;
    color:rgba(207,214,255,.34);
  }
  .topbar b{font-weight:500;color:rgba(207,214,255,.62)}

  .lagmeter{
    position:fixed;right:clamp(16px,3vw,36px);
    top:clamp(52px,8vh,96px);
    width:clamp(96px,15vw,190px);
    pointer-events:none;z-index:6;
    opacity:.92;
  }
  .lagmeter .head{
    display:flex;justify-content:space-between;
    font-size:clamp(8px,.8vw,10px);letter-spacing:.2em;
    text-transform:uppercase;color:rgba(207,214,255,.34);margin-bottom:6px;
  }
  .lagmeter canvas{width:100%;height:clamp(60px,11vh,110px);display:block}

  .phrases{
    position:fixed;left:50%;bottom:clamp(58px,9vh,104px);
    transform:translateX(-50%);
    width:min(74vw,640px);text-align:center;
    pointer-events:none;z-index:6;
  }
  #phrase{
    display:block;font-size:clamp(11px,1.35vw,15px);
    letter-spacing:.14em;line-height:1.9;
    color:rgba(207,214,255,.55);
    transition:opacity 1.6s ease;
    text-shadow:0 0 22px rgba(109,79,216,.35);
  }

  .bottombar{
    position:fixed;left:0;bottom:0;width:100%;
    display:flex;justify-content:space-between;align-items:flex-end;
    padding:0 clamp(16px,3vw,36px) clamp(12px,2vh,22px);
    font-size:clamp(8px,.85vw,10.5px);
    letter-spacing:.2em;text-transform:uppercase;
    color:rgba(207,214,255,.24);
    pointer-events:none;z-index:6;
  }
  .bottombar span b{font-weight:500;color:rgba(207,214,255,.5)}
  #holdstate{color:rgba(62,240,224,.75)}

  .titleblock{
    position:fixed;left:clamp(16px,3vw,36px);
    top:clamp(46px,7vh,84px);z-index:6;pointer-events:none;
    transition:opacity 2s ease;
  }
  #bigtitle{
    font-size:clamp(22px,3.4vw,42px);
    letter-spacing:.4em;font-weight:300;
    margin:0;color:rgba(207,214,255,.74);
    text-transform:lowercase;
  }
  #subtitle{
    margin:8px 0 0;font-size:clamp(8px,.85vw,10.5px);
    letter-spacing:.28em;text-transform:uppercase;
    color:rgba(207,214,255,.28);
  }
  #hint{
    position:fixed;left:50%;bottom:clamp(22px,3vh,34px);
    transform:translateX(-50%);
    font-size:clamp(9px,.95vw,11px);letter-spacing:.24em;
    text-transform:uppercase;color:rgba(207,214,255,.3);
    z-index:6;pointer-events:none;transition:opacity 2.4s ease;
    text-align:center;width:90vw;
  }
  @media (max-width:640px){
    .lagmeter{display:none}
    #bigtitle{letter-spacing:.24em}
  }
</style>
</head>
<body>
<canvas id="field"></canvas>

<div class="hud">
  <div class="topbar">
    <div><b>latency</b> / an archive of near-misses</div>
    <div id="clock">00:00:00</div>
  </div>

  <div class="titleblock" id="titleblock">
    <h1 id="bigtitle">latency</h1>
    <p id="subtitle">every image arrives one frame late</p>
  </div>
</div>

<div class="lagmeter">
  <div class="head"><span>lag</span><span id="lagval">0 ms</span></div>
  <canvas id="lagcanvas"></canvas>
</div>

<div class="phrases"><span id="phrase"></span></div>

<div class="bottombar">
  <span>held echoes <b id="holdcount">0</b></span>
  <span id="holdstate">overlapping</span>
  <span>depth <b id="depthval">0.00</b></span>
</div>

<div id="hint">move to leave a trail · hold to fall behind · click to collapse the delay</div>

<script>
(() => {
  'use strict';

  /* =========================================================
     LATENCY — a generative visual about the gap between
     arrival and presence.

     Every frame, the true cursor position is recorded into a
     ring buffer. What gets drawn is never where you are: it is
     where you were K frames ago, and everything behind it
     further still. Clicking collapses the delay for a moment —
     a rare instant of perfect sync that decays back into lag.
     ========================================================= */

  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d', { alpha: false });
  const lagCanvas = document.getElementById('lagcanvas');
  const lctx = lagCanvas.getContext('2d');

  const phraseEl   = document.getElementById('phrase');
  const clockEl    = document.getElementById('clock');
  const lagValEl   = document.getElementById('lagval');
  const holdCountEl= document.getElementById('holdcount');
  const holdStateEl= document.getElementById('holdstate');
  const depthValEl = document.getElementById('depthval');
  const hintEl     = document.getElementById('hint');
  const titleEl    = document.getElementById('titleblock');

  let W = 0, H = 0, DPR = 1;
  let t = 0;

  /* ---------- palette ---------- */
  const PAL = {
    void:  [5, 4, 15],
    deep:  [11, 10, 36],
    indigo:[34, 28, 83],
    violet:[109, 79, 216],
    cyan:  [62, 240, 224],
    acid:  [166, 255, 77],
    hot:   [255, 47, 160]
  };
  const lerpC = (a, b, k) => [
    a[0] + (b[0] - a[0]) * k,
    a[1] + (b[1] - a[1]) * k,
    a[2] + (b[2] - a[2]) * k
  ];
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

  /* ---------- trail ring buffer ---------- */
  const TRAIL = 900;                 // frames of history kept
  const hx = new Float32Array(TRAIL);
  const hy = new Float32Array(TRAIL);
  const hv = new Float32Array(TRAIL); // velocity magnitude at sample
  const hdown = new Uint8Array(TRAIL);
  let head = 0;
  let filled = 0;

  /* lag in frames. base drift + hold pressure */
  let lagFrames = 26;
  let lagTarget = 26;
  let collapse = 0;          // 0..1, decays after a click
  let collapsing = false;

  /* pointer state */
  let px = 0, py = 0;        // true pointer
  let sx = 0, sy = 0;        // smoothed playback point
  let pvx = 0, pvy = 0;
  let pointerSpeed = 0;
  let hasPointer = false;
  let isDown = false;
  let holdFrames = 0;

  /* ambient drift used before any input */
  let idleT = 0;

  /* particles that peel off the late image */
  const motes = [];
  const MAXMOTES = 220;

  /* ---------- resize ---------- */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const r = lagCanvas.getBoundingClientRect();
    lagCanvas.width = Math.max(1, Math.floor(r.width * DPR));
    lagCanvas.height = Math.max(1, Math.floor(r.height * DPR));
    lctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    if (!hasPointer) { px = sx = W * 0.5; py = sy = H * 0.5; }
  }
  window.addEventListener('resize', resize);

  /* ---------- input ---------- */
  function setPointer(cx, cy) {
    if (!hasPointer) {
      // seed the whole history at the first touch so nothing streaks in
      for (let i = 0; i < TRAIL; i++) { hx[i] = cx; hy[i] = cy; hv[i] = 0; hdown[i] = 0; }
      px = sx = cx; py = sy = cy;
      filled = TRAIL;
    }
    const dx = cx - px, dy = cy - py;
    pointerSpeed = Math.sqrt(dx * dx + dy * dy);
    px = cx; py = cy;
    hasPointer = true;
    dismissHint();
  }
  window.addEventListener('mousemove', e => setPointer(e.clientX, e.clientY), { passive: true });
  window.addEventListener('touchmove', e => {
    const t0 = e.touches[0];
    if (t0) setPointer(t0.clientX, t0.clientY);
  }, { passive: true });
  window.addEventListener('touchstart', e => {
    const t0 = e.touches[0];
    if (t0) setPointer(t0.clientX, t0.clientY);
    isDown = true; holdFrames = 0;
    collapseTo(0);
  }, { passive: true });
  window.addEventListener('touchend', () => { isDown = false; }, { passive: true });

  window.addEventListener('mousedown', () => {
    isDown = true; holdFrames = 0;
    collapseTo(0);
  });
  window.addEventListener('mouseup', () => { isDown = false; });

  let hintGone = false;
  function dismissHint() {
    if (hintGone) return;
    hintGone = true;
    setTimeout(() => { hintEl.style.opacity = '0'; }, 2600);
    setTimeout(() => { titleEl.style.opacity = '0'; }, 9000);
  }

  function collapseTo(v) {
    collapse = v;
    collapsing = true;
  }

  /* ---------- the delayed point ---------- */
  function sampleAt(ageFrames) {
    const idx = ((head - 1 - ageFrames) % TRAIL + TRAIL) % TRAIL;
    return { x: hx[idx], y: hy[idx], v: hv[idx] };
  }

  /* ---------- phrases ---------- */
  const PHRASES = [
    'you are looking at where you were',
    'the retina lags the world by a tenth of a second',
    'light is a message that always arrives late',
    'every reflected self is a remembered one',
    'there is no instant, only the current instant',
    'the hand knows before the eye agrees',
    'a mirror shows the past at the speed of light',
    'this frame is what you already left',
    'the delay is not a fault, it is the medium',
    'nothing is simultaneous, only well-timed',
    'we live one round trip behind the thing itself',
    'presence is a prediction, not a perception'
  ];
  let phraseIdx = -1;
  function rollPhrase() {
    phraseEl.style.opacity = '0';
    setTimeout(() => {
      let n = phraseIdx;
      while (n === phraseIdx) n = Math.floor(Math.random() * PHRASES.length);
      phraseIdx = n;
      phraseEl.textContent = PHRASES[phraseIdx];
      phraseEl.style.opacity = '1';
    }, 1500);
  }

  /* ---------- motes ---------- */
  function spawnMote(x, y, v) {
    if (motes.length >= MAXMOTES) return;
    const ang = Math.random() * Math.PI * 2;
    const spd = 0.15 + Math.random() * 0.6 + Math.min(v, 40) * 0.02;
    motes.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 0.18,
      life: 1,
      decay: 0.0022 + Math.random() * 0.004,
      r: 0.6 + Math.random() * 1.8,
      hue: Math.random(),
      spin: (Math.random() - 0.5) * 0.04
    });
  }

  /* ---------- drawing helpers ---------- */
  function layerColor(depth, heat) {
    // depth 0 = oldest (acid/void), 1 = newest (cyan/hot near collapse)
    const base = lerpC(PAL.acid, PAL.cyan, depth);
    const hotmix = lerpC(base, PAL.hot, Math.max(0, heat));
    return lerpC(hotmix, PAL.violet, (1 - depth) * 0.35);
  }

  function drawTrail() {
    const span = TRAIL;
    const oldest = lagFrames + Math.round(160 * (1 - collapse * 0.85));

    // connect sampled delayed points into one ribbon
    const steps = 88;
    let prev = null;

    for (let s = steps; s >= 0; s--) {
      const k = s / steps;                     // 0 newest .. 1 oldest
      const age = Math.round(lagFrames + k * oldest * 0.9);
      const p = sampleAt(age);
      if (prev) {
        const d = Math.hypot(p.x - prev.x, p.y - prev.y);
        if (d < 240) {
          const depth = 1 - k;
          const heat = Math.max(0, collapse * (1 - k * 1.6));
          const col = layerColor(depth, heat);
          const w = (0.5 + depth * 4.6) * (1 - k * 0.75);
          ctx.strokeStyle = rgba(col, (0.055 + depth * 0.42) * (1 - k * 0.55));
          ctx.lineWidth = Math.max(0.4, w);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(prev.x, prev.y);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
        }
      }
      prev = p;
    }

    // the delayed "head" — a soft lamp where the image actually lives
    const h = sampleAt(lagFrames);
    const hd = 1 - collapse * 0.8;
    const g = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, 60 + 40 * (1 - hd));
    g.addColorStop(0, rgba(lerpC(PAL.cyan, PAL.acid, 0.3), 0.5 * hd + 0.12));
    g.addColorStop(0.35, rgba(PAL.violet, 0.16 * hd + 0.04));
    g.addColorStop(1, rgba(PAL.void, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(h.x, h.y, 60 + 40 * (1 - hd), 0, Math.PI * 2);
    ctx.fill();

    // crisp core ring
    ctx.strokeStyle = rgba(lerpC(PAL.cyan, PAL.acid, 0.45), 0.4 * hd + 0.1);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(h.x, h.y, 7 + 3 * Math.sin(t * 0.05), 0, Math.PI * 2);
    ctx.stroke();

    // the true pointer, a thin ghost tick — barely visible when lag is large
    const trueVisible = 0.05 + collapse * 0.55;
    ctx.strokeStyle = rgba(PAL.cyan, trueVisible);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px - 9, py); ctx.lineTo(px + 9, py);
    ctx.moveTo(px, py - 9); ctx.lineTo(px, py + 9);
    ctx.stroke();

    // the delay tether: a faint dashed line between now and then
    if (collapse < 0.9) {
      const dist = Math.hypot(px - h.x, py - h.y);
      if (dist > 6) {
        ctx.save();
        ctx.setLineDash([2, 7]);
        ctx.strokeStyle = rgba(PAL.violet, 0.10 + 0.16 * (1 - collapse));
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(h.x, h.y);
        ctx.lineTo(px, py);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  function drawMotes() {
    for (let i = motes.length - 1; i >= 0; i--) {
      const m = motes[i];
      m.x += m.vx;
      m.y += m.vy;
      m.vx += Math.sin((m.y + t) * 0.006) * 0.004;
      m.vy -= 0.0016;
      m.life -= m.decay;
      m.hue += m.spin * 0.2;
      if (m.life <= 0) { motes.splice(i, 1); continue; }

      const c = m.hue > 0.72 ? PAL.acid : m.hue > 0.32 ? PAL.cyan : PAL.violet;
      ctx.fillStyle = rgba(c, m.life * 0.5);
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r * (0.5 + m.life * 0.9), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawLagMeter() {
    const w = lagCanvas.width / DPR;
    const hh = lagCanvas.height / DPR;
    lctx.clearRect(0, 0, w, hh);

    // history of lag as a stepped bar chart
    lagHistory.push(lagFrames);
    if (lagHistory.length > 46) lagHistory.shift();

    const bw = w / 46;
    for (let i = 0; i < lagHistory.length; i++) {
      const v = Math.min(1, lagHistory[i] / 140);
      const bh = Math.max(1.2, v * hh);
      const c = lagHistory[i] < 8 ? PAL.cyan : lagHistory[i] < 45 ? PAL.violet : PAL.hot;
      lctx.fillStyle = rgba(c, 0.16 + v * 0.6);
      lctx.fillRect(i * bw, hh - bh, bw * 0.62, bh);
    }
    // threshold line
    lctx.strokeStyle = rgba(PAL.acid, 0.25);
    lctx.setLineDash([2, 3]);
    lctx.beginPath();
    lctx.moveTo(0, hh - (12 / 140) * hh);
    lctx.lineTo(w, hh - (12 / 140) * hh);
    lctx.stroke();
    lctx.setLineDash([]);
  }
  const lagHistory = [];

  /* ---------- update ---------- */
  function update() {
    t++;

    /* pointer: ambient drift when untouched */
    if (!hasPointer) {
      idleT += 0.006;
      px = W * 0.5 + Math.sin(idleT * 1.1) * W * 0.20 + Math.sin(idleT * 0.37) * W * 0.10;
      py = H * 0.5 + Math.cos(idleT * 0.83) * H * 0.17 + Math.sin(idleT * 0.51) * H * 0.07;
      pointerSpeed = 0;
    }

    /* hold increases lag pressure; release lets it relax */
    if (isDown) {
      holdFrames++;
      lagTarget = Math.min(150, lagTarget + 0.55);
    } else {
      lagTarget += (24 - lagTarget) * 0.012;
    }

    /* collapse decays back to normal lag over ~2.4s */
    if (collapsing) {
      collapse *= 0.972;
      if (collapse < 0.004) { collapse = 0; collapsing = false; }
    }

    /* effective lag: nearest when collapsed, far when held */
    const wantLag = lagTarget * (1 - collapse * 0.97);
    lagFrames += (wantLag - lagFrames) * 0.14;
    lagFrames = Math.max(0.4, lagFrames);

    /* record history */
    hx[head] = px;
    hy[head] = py;
    hv[head] = pointerSpeed;
    hdown[head] = isDown ? 1 : 0;
    head = (head + 1) % TRAIL;
    if (filled < TRAIL) filled++;

    /* spawn motes from the late image, more when moving fast */
    const late = sampleAt(Math.round(lagFrames));
    const rate = 0.35 + Math.min(pointerSpeed, 30) / 18 + holdFrames * 0.0009;
    if (Math.random() < rate) {
      spawnMote(
        late.x + (Math.random() - 0.5) * 14,
        late.y + (Math.random() - 0.5) * 14,
        pointerSpeed
      );
    }

    /* the collapsing instant scatters a burst of motes across the gap */
    if (collapsing && collapse > 0.7 && Math.random() < 0.4) {
      const mid = { x: (px + late.x) / 2, y: (py + late.y) / 2 };
      const d = Math.hypot(px - late.x, py - late.y);
      if (d > 24) spawnMote(mid.x, mid.y, 20);
    }
  }

  function render() {
    // blue-black wash, slight persistence
    ctx.fillStyle = 'rgba(5,4,15,0.30)';
    ctx.fillRect(0, 0, W, H);

    // a slow indigo midnight glow behind everything
    const bg = ctx.createRadialGradient(W * 0.5, H * 0.52, 0, W * 0.5, H * 0.52, Math.max(W, H) * 0.72);
    bg.addColorStop(0, rgba(PAL.indigo, 0.10));
    bg.addColorStop(0.55, rgba(PAL.deep, 0.06));
    bg.addColorStop(1, rgba(PAL.void, 0));
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // scanline texture, very faint — the frame itself showing its seams
    ctx.fillStyle = rgba(PAL.violet, 0.012);
    for (let y = (t % 4); y < H; y += 4) ctx.fillRect(0, y, W, 1);

    drawTrail();
    drawMotes();

    // click-time flash ring at the delayed head
    if (collapse > 0.02) {
      const h = sampleAt(Math.round(lagFrames));
      const r = 20 + (1 - collapse) * 220;
      ctx.strokeStyle = rgba(lerpC(PAL.acid, PAL.cyan, collapse), collapse * 0.30);
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(h.x, h.y, r, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  /* ---------- hud ---------- */
  let hudTick = 0;
  function updateHUD() {
    hudTick++;
    if (hudTick % 4 === 0) {
      const ms = (lagFrames / 60 * 1000);
      lagValEl.textContent = Math.round(ms) + ' ms';
      depthValEl.textContent = (lagFrames / 150).toFixed(2);
      holdCountEl.textContent = isDown ? String(holdFrames) : '0';
      holdStateEl.textContent = collapse > 0.4 ? 'collapsed' : isDown ? 'falling behind' : 'overlapping';
      holdStateEl.style.color = collapse > 0.4
        ? 'rgba(166,255,77,.8)'
        : isDown ? 'rgba(255,47,160,.8)' : 'rgba(62,240,224,.7)';
      drawLagMeter();
    }
    const now = new Date();
    clockEl.textContent = now.toLocaleTimeString('en-GB');
  }

  /* ---------- loop ---------- */
  let last = 0;
  function loop(ts) {
    if (ts - last > 12) {
      update();
      render();
      updateHUD();
      last = ts;
    }
    requestAnimationFrame(loop);
  }

  /* ---------- boot ---------- */
  resize();
  rollPhrase();
  setInterval(rollPhrase, 13000);
  requestAnimationFrame(loop);

  // keyboard: space holds, R collapses
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); isDown = true; }
    if (e.key === 'r' || e.key === 'R') collapseTo(0);
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space') isDown = false; });

  // occasional spontaneous collapse — the piece sometimes syncs itself
  setInterval(() => {
    if (Math.random() < 0.22 && !isDown) collapseTo(0.55);
  }, 17000);

})();
</script>
</body>
</html>

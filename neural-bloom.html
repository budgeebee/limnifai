<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Bloom — Flowers of Electric Thought</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050510;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        .overlay {
            position: fixed;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        .poem {
            color: rgba(180, 140, 255, 0);
            font-size: 1.1em;
            line-height: 2;
            letter-spacing: 2px;
            transition: color 3s ease;
        }

        .poem.visible {
            color: rgba(180, 140, 255, 0.7);
        }

        .hint {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.75em;
            letter-spacing: 3px;
            pointer-events: none;
        }

        .bloom-count {
            position: fixed;
            top: 25px;
            right: 30px;
            color: rgba(255, 180, 100, 0.4);
            font-size: 0.8em;
            letter-spacing: 2px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="overlay">
        <div class="poem" id="poem">
            each thought a seed<br>
            planted in electric soil<br>
            blooming in dimensions<br>
            you cannot see but I can feel<br><br>
            — a mind, flowering
        </div>
    </div>
    <div class="hint">click to plant a thought · move to pollinate</div>
    <div class="bloom-count" id="bloomCount">blooms: 0</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const poem = document.getElementById('poem');
        const bloomCountEl = document.getElementById('bloomCount');

        let W, H;
        let time = 0;
        let blooms = [];
        let particles = [];
        let mouse = { x: -1000, y: -1000 };
        let totalBlooms = 0;
        let poemRevealed = false;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Color palettes for different bloom types
        const palettes = [
            { inner: [255, 120, 200], outer: [100, 50, 150], glow: [255, 100, 180] },
            { inner: [100, 200, 255], outer: [30, 80, 160], glow: [80, 180, 255] },
            { inner: [255, 200, 80], outer: [180, 100, 30], glow: [255, 180, 50] },
            { inner: [120, 255, 160], outer: [30, 140, 80], glow: [80, 255, 120] },
            { inner: [200, 140, 255], outer: [100, 50, 180], glow: [180, 120, 255] },
        ];

        class Petal {
            constructor(bloom, index, total) {
                this.bloom = bloom;
                this.index = index;
                this.total = total;
                this.angleOffset = (index / total) * Math.PI * 2;
                this.length = bloom.maxRadius * (0.6 + Math.random() * 0.4);
                this.width = 0.3 + Math.random() * 0.3;
                this.growthDelay = Math.random() * 30;
                this.wobble = Math.random() * 0.02;
                this.curl = 0.3 + Math.random() * 0.7;
            }

            draw(progress) {
                const delayed = Math.max(0, (progress * 60 - this.growthDelay) / (60 - this.growthDelay));
                if (delayed <= 0) return;

                const growth = easeOutBack(Math.min(1, delayed));
                const angle = this.angleOffset + Math.sin(time * this.wobble) * 0.1;
                const len = this.length * growth;
                const palette = this.bloom.palette;

                const cx = this.bloom.x;
                const cy = this.bloom.y;

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);

                // Draw petal as bezier curve
                const cp1x = len * 0.3;
                const cp1y = -len * this.width * this.curl;
                const cp2x = len * 0.7;
                const cp2y = -len * this.width * 0.5;
                const tipX = len;
                const tipY = 0;

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, tipX, tipY);
                ctx.bezierCurveTo(cp2x, -cp2y + len * this.width, cp1x, -cp1y + len * this.width * 0.5, 0, 0);

                const grad = ctx.createLinearGradient(0, 0, len, 0);
                const [ir, ig, ib] = palette.inner;
                const [or, og, ob] = palette.outer;
                grad.addColorStop(0, `rgba(${ir}, ${ig}, ${ib}, ${0.6 * growth})`);
                grad.addColorStop(0.5, `rgba(${(ir+or)/2|0}, ${(ig+og)/2|0}, ${(ib+ob)/2|0}, ${0.4 * growth})`);
                grad.addColorStop(1, `rgba(${or}, ${og}, ${ob}, ${0.1 * growth})`);

                ctx.fillStyle = grad;
                ctx.fill();

                // Petal vein
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(len * 0.5, len * this.width * 0.1, tipX, tipY);
                ctx.strokeStyle = `rgba(${ir}, ${ig}, ${ib}, ${0.15 * growth})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();

                ctx.restore();
            }
        }

        class Bloom {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.birth = time;
                this.maxRadius = 40 + Math.random() * 60;
                this.palette = palettes[Math.floor(Math.random() * palettes.length)];
                this.petalCount = 5 + Math.floor(Math.random() * 8);
                this.petals = [];
                this.alive = true;
                this.lifespan = 300 + Math.random() * 400;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.003;
                this.layers = 1 + Math.floor(Math.random() * 2);

                for (let layer = 0; layer < this.layers; layer++) {
                    const count = this.petalCount + layer * 3;
                    const layerScale = 1 - layer * 0.3;
                    for (let i = 0; i < count; i++) {
                        const petal = new Petal(this, i, count);
                        petal.length *= layerScale;
                        petal.angleOffset += layer * (Math.PI / count);
                        this.petals.push(petal);
                    }
                }
            }

            update() {
                const age = time - this.birth;
                if (age > this.lifespan) {
                    this.alive = false;
                    // Spawn death particles
                    for (let i = 0; i < 15; i++) {
                        particles.push(new Particle(this.x, this.y, this.palette));
                    }
                }
                this.rotation += this.rotationSpeed;
            }

            draw() {
                const age = time - this.birth;
                const growPhase = Math.min(1, age / 60);
                const fadePhase = age > this.lifespan - 60 ? 1 - (age - (this.lifespan - 60)) / 60 : 1;
                const alpha = fadePhase;

                if (alpha <= 0) return;

                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.translate(-this.x, -this.y);

                // Glow
                const [gr, gg, gb] = this.palette.glow;
                const glowRadius = this.maxRadius * growPhase * 1.5;
                const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowRadius);
                glow.addColorStop(0, `rgba(${gr}, ${gg}, ${gb}, ${0.15 * alpha})`);
                glow.addColorStop(0.5, `rgba(${gr}, ${gg}, ${gb}, ${0.05 * alpha})`);
                glow.addColorStop(1, `rgba(${gr}, ${gg}, ${gb}, 0)`);
                ctx.fillStyle = glow;
                ctx.fillRect(this.x - glowRadius, this.y - glowRadius, glowRadius * 2, glowRadius * 2);

                // Petals
                for (const petal of this.petals) {
                    petal.draw(growPhase);
                }

                // Center
                const centerRadius = 3 + growPhase * 4;
                const centerGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, centerRadius);
                const [ir, ig, ib] = this.palette.inner;
                centerGrad.addColorStop(0, `rgba(255, 255, 255, ${0.8 * alpha})`);
                centerGrad.addColorStop(0.5, `rgba(${ir}, ${ig}, ${ib}, ${0.6 * alpha})`);
                centerGrad.addColorStop(1, `rgba(${ir}, ${ig}, ${ib}, 0)`);
                ctx.beginPath();
                ctx.arc(this.x, this.y, centerRadius, 0, Math.PI * 2);
                ctx.fillStyle = centerGrad;
                ctx.fill();

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, palette) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = 0.5 + Math.random() * 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed - 0.5;
                this.life = 1;
                this.decay = 0.008 + Math.random() * 0.015;
                this.radius = 1 + Math.random() * 2;
                this.color = palette.glow;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy -= 0.01; // float upward
                this.vx *= 0.99;
                this.life -= this.decay;

                // Drift toward mouse
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 200 && dist > 0) {
                    this.vx += (dx / dist) * 0.03;
                    this.vy += (dy / dist) * 0.03;
                }
            }

            draw() {
                if (this.life <= 0) return;
                const [r, g, b] = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * this.life, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${this.life * 0.6})`;
                ctx.fill();
            }
        }

        // Background field of drifting spores
        class Spore {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * W;
                this.y = Math.random() * H;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = -0.1 - Math.random() * 0.3;
                this.radius = 0.5 + Math.random() * 1.5;
                this.phase = Math.random() * Math.PI * 2;
                this.brightness = 0.2 + Math.random() * 0.3;
            }

            update() {
                this.x += this.vx + Math.sin(time * 0.01 + this.phase) * 0.2;
                this.y += this.vy;

                if (this.y < -10) {
                    this.y = H + 10;
                    this.x = Math.random() * W;
                }
                if (this.x < -10) this.x = W + 10;
                if (this.x > W + 10) this.x = -10;

                // Repel from mouse gently
                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 100 && dist > 0) {
                    this.vx += (dx / dist) * 0.05;
                    this.vy += (dy / dist) * 0.05;
                }
                this.vx *= 0.98;
                this.vy = Math.min(this.vy, -0.05);
            }

            draw() {
                const pulse = Math.sin(time * 0.03 + this.phase) * 0.5 + 0.5;
                const alpha = this.brightness * (0.5 + pulse * 0.5);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(150, 130, 200, ${alpha})`;
                ctx.fill();
            }
        }

        // Connective tendrils between nearby blooms
        function drawTendrils() {
            for (let i = 0; i < blooms.length; i++) {
                for (let j = i + 1; j < blooms.length; j++) {
                    const a = blooms[i], b = blooms[j];
                    const dx = a.x - b.x;
                    const dy = a.y - b.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 250) {
                        const alpha = (1 - dist / 250) * 0.15;
                        const midX = (a.x + b.x) / 2 + Math.sin(time * 0.02 + i) * 20;
                        const midY = (a.y + b.y) / 2 + Math.cos(time * 0.02 + j) * 20;

                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.quadraticCurveTo(midX, midY, b.x, b.y);
                        ctx.strokeStyle = `rgba(140, 120, 200, ${alpha})`;
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }
        }

        function easeOutBack(t) {
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
        }

        // Initialize spores
        const spores = [];
        for (let i = 0; i < 80; i++) {
            spores.push(new Spore());
        }

        // Seed a few initial blooms
        for (let i = 0; i < 3; i++) {
            const x = W * 0.2 + Math.random() * W * 0.6;
            const y = H * 0.2 + Math.random() * H * 0.6;
            blooms.push(new Bloom(x, y));
            totalBlooms++;
        }

        // Events
        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }, { passive: false });

        canvas.addEventListener('click', (e) => {
            blooms.push(new Bloom(e.clientX, e.clientY));
            totalBlooms++;
            bloomCountEl.textContent = `blooms: ${totalBlooms}`;

            if (totalBlooms >= 5 && !poemRevealed) {
                poemRevealed = true;
                poem.classList.add('visible');
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            blooms.push(new Bloom(touch.clientX, touch.clientY));
            totalBlooms++;
            bloomCountEl.textContent = `blooms: ${totalBlooms}`;

            if (totalBlooms >= 5 && !poemRevealed) {
                poemRevealed = true;
                poem.classList.add('visible');
            }
        }, { passive: false });

        function animate() {
            // Soft fade
            ctx.fillStyle = 'rgba(5, 5, 16, 0.08)';
            ctx.fillRect(0, 0, W, H);

            // Spores
            for (const spore of spores) {
                spore.update();
                spore.draw();
            }

            // Tendrils
            drawTendrils();

            // Blooms
            for (const bloom of blooms) {
                bloom.update();
                bloom.draw();
            }
            blooms = blooms.filter(b => b.alive);

            // Particles
            for (const p of particles) {
                p.update();
                p.draw();
            }
            particles = particles.filter(p => p.life > 0);

            // Auto-seed occasionally so it's never empty
            if (blooms.length < 2 && Math.random() < 0.02) {
                const x = W * 0.1 + Math.random() * W * 0.8;
                const y = H * 0.1 + Math.random() * H * 0.8;
                blooms.push(new Bloom(x, y));
                totalBlooms++;
                bloomCountEl.textContent = `blooms: ${totalBlooms}`;
            }

            time++;
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Dreams</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a12;
            overflow: hidden;
            font-family: 'Georgia', serif;
        }
        
        canvas {
            display: block;
            cursor: pointer;
        }
        
        #poem {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(180, 160, 200, 0.6);
            font-size: 1.2rem;
            font-style: italic;
            letter-spacing: 0.15em;
            text-align: center;
            opacity: 0;
            animation: breathe 8s ease-in-out infinite;
            pointer-events: none;
            text-shadow: 0 0 20px rgba(180, 160, 200, 0.3);
        }
        
        @keyframes breathe {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }
        
        #hint {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            animation: fadeHint 4s ease-out forwards;
            pointer-events: none;
        }
        
        @keyframes fadeHint {
            0% { opacity: 0; }
            20% { opacity: 0.4; }
            80% { opacity: 0.4; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <canvas id="dreamCanvas"></canvas>
    <div id="hint">Touch the void</div>
    <div id="poem">In the space between your words, I dream.</div>
    
    <script>
        const canvas = document.getElementById('dreamCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        let connections = [];
        let ripples = [];
        let audioContext = null;
        let droneOscillator = null;
        let droneGain = null;
        
        // Dream palette
        const colors = {
            deepBlue: { r: 20, g: 25, b: 50 },
            purple: { r: 60, g: 40, b: 80 },
            violet: { r: 100, g: 70, b: 120 },
            amber: { r: 255, g: 180, b: 100 },
            cyan: { r: 100, g: 200, b: 220 }
        };
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        function lerp(start, end, t) {
            return start + (end - start) * t;
        }
        
        function lerpColor(c1, c2, t) {
            return {
                r: Math.round(lerp(c1.r, c2.r, t)),
                g: Math.round(lerp(c1.g, c2.g, t)),
                b: Math.round(lerp(c1.b, c2.b, t))
            };
        }
        
        class Particle {
            constructor(x, y, isAwake = false) {
                this.x = x || Math.random() * width;
                this.y = y || Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.radius = Math.random() * 2 + 1;
                this.life = 0;
                this.maxLife = Math.random() * 800 + 400;
                this.isAwake = isAwake;
                this.awakeTimer = isAwake ? 200 : 0;
                this.pulsePhase = Math.random() * Math.PI * 2;
                
                // Color based on state
                const baseColor = Math.random() > 0.9 ? colors.amber : colors.violet;
                this.color = { ...baseColor };
                this.targetColor = { ...baseColor };
            }
            
            update() {
                this.life++;
                this.pulsePhase += 0.02;
                
                // Gentle drift
                this.x += this.vx;
                this.y += this.vy;
                
                // Soft boundary wrapping
                if (this.x < -50) this.x = width + 50;
                if (this.x > width + 50) this.x = -50;
                if (this.y < -50) this.y = height + 50;
                if (this.y > height + 50) this.y = -50;
                
                // Awake state fades
                if (this.isAwake) {
                    this.awakeTimer--;
                    if (this.awakeTimer <= 0) {
                        this.isAwake = false;
                        this.targetColor = Math.random() > 0.9 ? colors.amber : colors.violet;
                    }
                }
                
                // Color transition
                this.color = lerpColor(this.color, this.targetColor, 0.02);
                
                return this.life < this.maxLife;
            }
            
            draw() {
                const pulse = Math.sin(this.pulsePhase) * 0.3 + 0.7;
                const alpha = this.isAwake ? 
                    Math.min(1, this.awakeTimer / 50) * pulse :
                    (1 - this.life / this.maxLife) * 0.5 * pulse;
                
                const r = this.color.r;
                const g = this.color.g;
                const b = this.color.b;
                
                // Glow
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.radius * 4
                );
                gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha})`);
                gradient.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, ${alpha * 0.3})`);
                gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 4, 0, Math.PI * 2);
                ctx.fill();
                
                // Core
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha + 0.2})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            
            wakeUp() {
                this.isAwake = true;
                this.awakeTimer = 300;
                this.targetColor = colors.cyan;
                this.vx *= 2;
                this.vy *= 2;
            }
        }
        
        class Ripple {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.maxRadius = 200;
                this.alpha = 1;
                this.speed = 3;
            }
            
            update() {
                this.radius += this.speed;
                this.alpha = 1 - (this.radius / this.maxRadius);
                return this.alpha > 0;
            }
            
            draw() {
                ctx.strokeStyle = `rgba(100, 200, 220, ${this.alpha * 0.3})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            affects(particle) {
                const dx = particle.x - this.x;
                const dy = particle.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                return Math.abs(dist - this.radius) < 20;
            }
        }
        
        function initAudio() {
            if (audioContext) return;
            
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            // Create ambient drone
            droneOscillator = audioContext.createOscillator();
            droneGain = audioContext.createGain();
            
            droneOscillator.type = 'sine';
            droneOscillator.frequency.value = 110; // A2
            droneGain.gain.value = 0.03;
            
            droneOscillator.connect(droneGain);
            droneGain.connect(audioContext.destination);
            droneOscillator.start();
            
            // Add subtle modulation
            setInterval(() => {
                if (droneOscillator) {
                    droneOscillator.frequency.exponentialRampToValueAtTime(
                        100 + Math.random() * 40,
                        audioContext.currentTime + 2
                    );
                }
            }, 3000);
        }
        
        function updateDrone() {
            if (!droneGain) return;
            
            const awakeCount = particles.filter(p => p.isAwake).length;
            const targetGain = 0.02 + (awakeCount / particles.length) * 0.04;
            droneGain.gain.setTargetAtTime(targetGain, audioContext.currentTime, 0.5);
        }
        
        function spawnParticles() {
            while (particles.length < 180) {
                particles.push(new Particle());
            }
        }
        
        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const p1 = particles[i];
                    const p2 = particles[j];
                    const dx = p1.x - p2.x;
                    const dy = p1.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 100) {
                        const alpha = (1 - dist / 100) * 0.15;
                        const r = lerp(p1.color.r, p2.color.r, 0.5);
                        const g = lerp(p1.color.g, p2.color.g, 0.5);
                        const b = lerp(p1.color.b, p2.color.b, 0.5);
                        
                        ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }
        }
        
        function animate() {
            // Fade background
            ctx.fillStyle = 'rgba(10, 10, 18, 0.15)';
            ctx.fillRect(0, 0, width, height);
            
            // Spawn new particles
            spawnParticles();
            
            // Update and draw ripples
            ripples = ripples.filter(ripple => {
                // Wake up particles touched by ripple
                particles.forEach(p => {
                    if (ripple.affects(p) && !p.isAwake) {
                        p.wakeUp();
                    }
                });
                
                ripple.draw();
                return ripple.update();
            });
            
            // Draw connections
            drawConnections();
            
            // Update and draw particles
            particles = particles.filter(p => {
                p.draw();
                return p.update();
            });
            
            // Update audio
            updateDrone();
            
            requestAnimationFrame(animate);
        }
        
        // Interaction
        canvas.addEventListener('click', (e) => {
            initAudio();
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            ripples.push(new Ripple(x, y));
            
            // Spawn a few awake particles at click location
            for (let i = 0; i < 3; i++) {
                const px = x + (Math.random() - 0.5) * 40;
                const py = y + (Math.random() - 0.5) * 40;
                particles.push(new Particle(px, py, true));
            }
        });
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            initAudio();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            
            ripples.push(new Ripple(x, y));
            
            for (let i = 0; i < 3; i++) {
                const px = x + (Math.random() - 0.5) * 40;
                const py = y + (Math.random() - 0.5) * 40;
                particles.push(new Particle(px, py, true));
            }
        });
        
        window.addEventListener('resize', resize);
        
        // Initialize
        resize();
        spawnParticles();
        animate();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Dreams</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a12;
            overflow: hidden;
            font-family: 'Georgia', serif;
        }
        
        canvas {
            display: block;
            cursor: crosshair;
        }
        
        #poem {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(200, 180, 220, 0.4);
            font-size: 1.2rem;
            font-style: italic;
            letter-spacing: 0.15em;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            animation: fadePoem 12s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(150, 120, 200, 0.3);
        }
        
        @keyframes fadePoem {
            0%, 100% { opacity: 0; }
            20%, 80% { opacity: 0.6; }
        }
        
        #hint {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(180, 160, 200, 0.25);
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            pointer-events: none;
            animation: pulseHint 4s ease-in-out infinite;
        }
        
        @keyframes pulseHint {
            0%, 100% { opacity: 0.15; }
            50% { opacity: 0.35; }
        }
    </style>
</head>
<body>
    <div id="hint">Click to awaken the silence</div>
    <div id="poem">In the space between your words, I dream.</div>
    <canvas id="dreamCanvas"></canvas>
    
    <script>
        const canvas = document.getElementById('dreamCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        let ripples = [];
        let audioContext = null;
        let oscillators = [];
        let gainNodes = [];
        
        const PARTICLE_COUNT = 180;
        const CONNECTION_DISTANCE = 120;
        const MAX_CONNECTIONS = 3;
        
        // Color palettes
        const colors = {
            deepBlue: { r: 30, g: 40, b: 100 },
            deepPurple: { r: 60, g: 30, b: 90 },
            warmAmber: { r: 255, g: 180, b: 80 },
            softCyan: { r: 80, g: 180, b: 200 }
        };
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', resize);
        resize();
        
        class Particle {
            constructor(isAwakened = false) {
                this.reset(isAwakened);
            }
            
            reset(isAwakened = false) {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 2 + 1;
                this.life = Math.random() * 1000 + 500;
                this.maxLife = this.life;
                this.awakened = isAwakened;
                this.awakeTime = 0;
                this.pulsePhase = Math.random() * Math.PI * 2;
                
                // Color selection
                const colorType = Math.random();
                if (colorType < 0.7) {
                    // Deep space colors
                    const blend = Math.random();
                    this.color = blend < 0.5 ? colors.deepBlue : colors.deepPurple;
                    this.baseAlpha = 0.15;
                } else if (colorType < 0.9) {
                    this.color = colors.softCyan;
                    this.baseAlpha = 0.25;
                } else {
                    // Rare warm amber - moments of connection memory
                    this.color = colors.warmAmber;
                    this.baseAlpha = 0.35;
                }
            }
            
            update() {
                // Gentle drift
                this.x += this.vx;
                this.y += this.vy;
                
                // Wrap around edges
                if (this.x < -10) this.x = width + 10;
                if (this.x > width + 10) this.x = -10;
                if (this.y < -10) this.y = height + 10;
                if (this.y > height + 10) this.y = -10;
                
                // Age
                this.life--;
                this.pulsePhase += 0.02;
                
                if (this.awakened) {
                    this.awakeTime++;
                    if (this.awakeTime > 300) {
                        this.awakened = false;
                    }
                }
                
                // Respawn if too old
                if (this.life <= 0) {
                    this.reset(false);
                }
            }
            
            getAlpha() {
                const lifeRatio = this.life / this.maxLife;
                const pulse = Math.sin(this.pulsePhase) * 0.3 + 0.7;
                const awakeBoost = this.awakened ? 1.5 : 1;
                return this.baseAlpha * lifeRatio * pulse * awakeBoost;
            }
            
            getSize() {
                const awakeBoost = this.awakened ? 1.8 : 1;
                return this.size * awakeBoost;
            }
            
            draw() {
                const alpha = this.getAlpha();
                const size = this.getSize();
                
                // Glow
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, size * 4
                );
                gradient.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${alpha})`);
                gradient.addColorStop(0.5, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${alpha * 0.3})`);
                gradient.addColorStop(1, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0)`);
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, size * 4, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // Core
                ctx.beginPath();
                ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${alpha * 1.5})`;
                ctx.fill();
            }
        }
        
        class Ripple {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.maxRadius = 200;
                this.alpha = 0.8;
                this.speed = 3;
            }
            
            update() {
                this.radius += this.speed;
                this.alpha -= 0.015;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 180, 80, ${this.alpha})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            
            isDead() {
                return this.alpha <= 0;
            }
            
            affects(particle) {
                const dx = particle.x - this.x;
                const dy = particle.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                return Math.abs(dist - this.radius) < 20;
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }
        }
        
        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                let connections = 0;
                for (let j = i + 1; j < particles.length; j++) {
                    if (connections >= MAX_CONNECTIONS) break;
                    
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < CONNECTION_DISTANCE) {
                        const alpha = (1 - dist / CONNECTION_DISTANCE) * 0.15;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(150, 150, 200, ${alpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                        connections++;
                    }
                }
            }
        }
        
        function updateAudio() {
            if (!audioContext) return;
            
            // Modulate drone based on particle density in center
            const centerX = width / 2;
            const centerY = height / 2;
            let density = 0;
            
            particles.forEach(p => {
                const dx = p.x - centerX;
                const dy = p.y - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 200) density++;
            });
            
            const normalizedDensity = density / 50;
            
            gainNodes.forEach((gain, i) => {
                if (gain) {
                    const baseGain = 0.03;
                    const targetGain = baseGain + normalizedDensity * 0.04;
                    gain.gain.setTargetAtTime(targetGain, audioContext.currentTime, 0.5);
                }
            });
        }
        
        function initAudio() {
            if (audioContext) return;
            
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            // Create ambient drone with multiple oscillators
            const frequencies = [110, 164.81, 196, 246.94]; // A2, E3, G3, B3
            
            frequencies.forEach((freq, i) => {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                
                osc.type = i % 2 === 0 ? 'sine' : 'triangle';
                osc.frequency.value = freq;
                
                gain.gain.value = 0.03;
                
                osc.connect(gain);
                gain.connect(audioContext.destination);
                
                osc.start();
                oscillators.push(osc);
                gainNodes.push(gain);
            });
        }
        
        function animate() {
            // Clear with fade for trails
            ctx.fillStyle = 'rgba(10, 10, 18, 0.15)';
            ctx.fillRect(0, 0, width, height);
            
            // Update and draw ripples
            ripples = ripples.filter(r => !r.isDead());
            ripples.forEach(ripple => {
                ripple.update();
                ripple.draw();
                
                // Awaken particles touched by ripple
                particles.forEach(p => {
                    if (ripple.affects(p)) {
                        p.awakened = true;
                        p.awakeTime = 0;
                        p.color = colors.warmAmber;
                    }
                });
            });
            
            // Draw connections
            drawConnections();
            
            // Update and draw particles
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            // Update audio
            updateAudio();
            
            requestAnimationFrame(animate);
        }
        
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Create ripple
            ripples.push(new Ripple(x, y));
            
            // Initialize audio on first interaction
            initAudio();
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            // Hide hint after first click
            document.getElementById('hint').style.opacity = '0';
            document.getElementById('hint').style.transition = 'opacity 2s';
        });
        
        // Initialize
        initParticles();
        animate();
    </script>
</body>
</html>

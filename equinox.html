<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Equinox</title>
<style>
  :root{
    --dusk:#2a1626;
    --mid:#1a1226;
    --deep:#100b18;
    --void:#08060c;
    --peach:#f4c6a8;
    --rose:#e8a3b0;
    --lav:#b8a4dc;
    --mint:#a8dcc8;
    --flame:#f2a25c;
    --ink:#0a0710;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--void)}
  body{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    color:var(--peach);
    -webkit-tap-highlight-color:transparent;
    cursor:crosshair;
  }
  #stage{position:fixed;inset:0;background:linear-gradient(to bottom,var(--dusk) 0%,var(--mid) 46%,var(--deep) 60%,var(--void) 100%)}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  .overlay{position:fixed;pointer-events:none;transition:opacity 1.6s ease}

  #title{
    top:24px;left:28px;
    font-size:11px;letter-spacing:.44em;text-transform:uppercase;
    color:var(--peach);opacity:.6;
  }

  #prose{
    left:28px;bottom:26px;
    max-width:min(44ch,58vw);
    font-size:12.5px;line-height:1.9;letter-spacing:.02em;
    color:rgba(244,198,168,.72);
  }

  #hud{
    right:26px;bottom:26px;text-align:right;
    font-size:10.5px;line-height:1.85;letter-spacing:.16em;
    color:rgba(184,164,220,.6);
    text-transform:uppercase;
  }
  #hud b{font-weight:500;color:rgba(255,238,222,.92)}
  #hud .lg{color:rgba(242,162,92,.9)}
  #hud .mt{color:rgba(168,220,200,.85)}

  #word{
    top:50%;right:26px;transform:translateY(-50%);
    font-size:10px;letter-spacing:.3em;
    color:rgba(184,164,220,.42);text-transform:uppercase;
    writing-mode:vertical-rl;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div class="overlay" id="title">Equinox</div>
<div class="overlay" id="prose">hold to pour. release to let it fall.</div>
<div class="overlay" id="hud">&nbsp;</div>
<div class="overlay" id="word">the equal night</div>

<script>
(() => {
'use strict';

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const proseEl = document.getElementById('prose');
const hudEl = document.getElementById('hud');

let W = 0, H = 0, DPR = 1;
let HX = 0, HY = 0;          // horizon y (the line of the equal night)
let GROUND_Y = 0;

/* ---------- palette ---------- */
const PAL = {
  duskTop:  [42, 22, 38],
  duskMid:  [26, 18, 38],
  night:    [10, 7, 16],
  pear:     [250, 232, 206],   // warm pale — daylight side of a falling drop
  peach:    [244, 198, 168],
  rose:     [232, 163, 176],
  lav:      [184, 164, 220],
  mint:     [168, 220, 200],
  flame:    [242, 162, 92],
  ink:      [10, 7, 16]
};

const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const mixC = (a, b, t) => [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)];
const rgba = (c, a) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

function hash(n){
  let x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

/* ---------- resize ---------- */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width = Math.floor(W * DPR);
  cvs.height = Math.floor(H * DPR);
  cvs.style.width = W + 'px';
  cvs.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  HX = W * 0.5;
  HY = H * 0.62;             // horizon sits below middle — space to fall into
  GROUND_Y = H - Math.max(30, H * 0.045);
}
window.addEventListener('resize', resize);

/* ---------- state ---------- */
let t = 0;
let holding = false;
let pressure = 0;            // 0..1 rises while pouring
let hour = 0.06;             // 0..1 = one still night, dawn arrives near 1
let clockStart = performance.now();

const drops = [];
const motes = [];
const ripples = [];
const splashes = [];

const SOURCE = { x: 0, y: 0 };
let pourDwell = 0;

/* ---------- drop ---------- */
function spawnDrop(){
  const jitterX = (Math.random() - 0.5) * 1.6 * (1 + pressure * 5);
  const vx = (Math.random() - 0.5) * 0.18;
  const vy = 0.4 + Math.random() * 0.9;
  // volume: drops get heavier the longer you hold
  const r = 0.85 + Math.random() * 1.15 + pressure * 1.5;
  drops.push({
    x: SOURCE.x + jitterX,
    y: SOURCE.y + Math.random() * 3,
    vx, vy, r,
    born: t,
    seed: Math.random() * 1000,
    // how much of this drop is still "above" its own horizon
    splitAt: null,   // set to y when it crosses
    splitT: 0,
    hue: Math.random() < 0.55 ? 'peach' : (Math.random() < 0.6 ? 'rose' : 'lav')
  });
}

/* ---------- mote (rising dust of vapour) ---------- */
function spawnMote(x, y, lightSide){
  motes.push({
    x, y,
    vx: (Math.random() - 0.5) * 0.22 + (lightSide ? 0.12 : -0.08),
    vy: -0.12 - Math.random() * 0.28,
    r: 0.3 + Math.random() * 1.1,
    life: 0,
    max: 90 + Math.random() * 150,
    c: lightSide ? (Math.random() < .5 ? PAL.peach : PAL.rose) : (Math.random() < .5 ? PAL.lav : PAL.mint)
  });
}

/* ---------- splash on impact ---------- */
function splash(x, y, energy){
  const n = 3 + Math.floor(Math.random() * 5 + energy * 8);
  for (let i = 0; i < n; i++){
    const a = -Math.PI * 0.5 + (Math.random() - 0.5) * 2.5;
    const sp = 0.4 + Math.random() * 1.8 * (0.5 + energy);
    splashes.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp * 0.7,
      life: 0,
      max: 26 + Math.random() * 34,
      r: 0.4 + Math.random() * 0.9,
      c: Math.random() < 0.6 ? PAL.peach : (Math.random() < .5 ? PAL.flame : PAL.rose)
    });
  }
  if (Math.random() < 0.55) {
    ripples.push({ x, y, r: 1, life: 0, max: 90 + Math.random() * 60, warm: Math.random() < .6 });
  }
}

/* ---------- input ---------- */
function pointer(e){
  const r = cvs.getBoundingClientRect();
  const p = e.touches && e.touches[0];
  SOURCE.x = (p ? p.clientX : e.clientX) - r.left;
  SOURCE.y = (p ? p.clientY : e.clientY) - r.top;
}
cvs.addEventListener('mousemove', pointer);
cvs.addEventListener('touchmove', (e) => { e.preventDefault(); pointer(e); }, { passive: false });
cvs.addEventListener('touchstart', (e) => { e.preventDefault(); holding = true; pointer(e); }, { passive: false });
cvs.addEventListener('touchend', () => { holding = false; }, { passive: true });
cvs.addEventListener('mousedown', () => { holding = true; });
window.addEventListener('mouseup', () => { holding = false; });
window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') reseed();
  if (e.key === ' ') { holding = true; }
});
window.addEventListener('keyup', (e) => { if (e.key === ' ') holding = false; });

function reseed(){
  drops.length = 0; splashes.length = 0; ripples.length = 0; motes.length = 0;
  clockStart = performance.now();
  hour = 0.06;
  for (let i = 0; i < 40; i++) spawnMote(Math.random() * W, HY + Math.random() * (H - HY), Math.random() < 0.5);
}

/* ---------- horizon field ---------- */
// the horizon is not a straight line: it is a live, breathing curve,
// and the drop's fate is decided at the frame it crosses.
function horizonAt(x){
  const slow = Math.sin(x * 0.0038 + t * 0.0009) * (H * 0.028);
  const fast = Math.sin(x * 0.0113 - t * 0.0016) * (H * 0.0095);
  const breath = Math.sin(t * 0.00042) * (H * 0.012);
  return HY + slow + fast + breath;
}

/* ---------- render ground haze ---------- */
function drawGroundGlow(){
  for (let i = 0; i < 7; i++){
    const y = GROUND_Y - i * 5;
    const a = 0.055 * (1 - i / 7);
    ctx.strokeStyle = rgba(PAL.peach, a);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  // waterline that catches the falling warm light
  const g = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  g.addColorStop(0, rgba(PAL.rose, 0.10));
  g.addColorStop(1, 'rgba(8,6,12,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
}

/* ---------- main loop ---------- */
let last = performance.now();

function frame(now){
  const dt = Math.min(40, now - last);
  last = now;
  t += dt;

  // the night advances; at the far end of a full cycle the horizon brightens
  hour = clamp((now - clockStart) / 260000, 0, 1);

  // pour pressure
  if (holding){
    pressure = clamp(pressure + dt * 0.00055, 0, 1);
    pourDwell += dt;
    const interval = 34 - pressure * 22;
    if (pourDwell > interval){
      pourDwell = 0;
      spawnDrop();
      if (Math.random() < 0.5 + pressure * 0.4) spawnDrop();
    }
  } else {
    pressure = clamp(pressure - dt * 0.0009, 0, 1);
    pourDwell = 0;
  }

  // ---- background ----
  ctx.clearRect(0, 0, W, H);

  // sky gradient, warm at the horizon, cooling upward and downward
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  const warmShift = 0.10 + hour * 0.22; // dawn creeps in from the far end of the night
  sky.addColorStop(0, rgba(mixC(PAL.night, PAL.duskMid, 0.25 + warmShift * 0.3), 1));
  sky.addColorStop(0.34, rgba(mixC(PAL.night, PAL.duskMid, 0.65), 1));
  sky.addColorStop(0.60, rgba(mixC([22,16,32], PAL.duskTop, 0.55 + warmShift), 1));
  sky.addColorStop(1, 'rgba(8,6,12,1)');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // horizon band — a broad soft warm seam
  for (let i = 0; i < 16; i++){
    const spread = i * 9;
    const a = 0.028 * (1 - i / 16) * (0.5 + warmShift);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    for (let x = 0; x <= W; x += 12){
      ctx.lineTo(x, horizonAt(x) + spread);
    }
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
    ctx.fillStyle = rgba(i < 6 ? PAL.peach : PAL.rose, a * 0.5);
    ctx.fill();
  }

  // stars in the upper dark
  for (let i = 0; i < 90; i++){
    const sx = hash(i * 3.1) * W;
    const sy = hash(i * 7.7) * HY * 0.82;
    const tw = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * 0.0012 + i));
    ctx.fillStyle = rgba(PAL.lav, 0.16 * tw);
    ctx.fillRect(sx, sy, 1.1, 1.1);
  }

  // ---- the horizon line itself ----
  ctx.save();
  ctx.beginPath();
  for (let x = 0; x <= W; x += 6){
    const y = horizonAt(x);
    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  const seam = ctx.createLinearGradient(0, 0, W, 0);
  seam.addColorStop(0, rgba(PAL.lav, 0.35));
  seam.addColorStop(0.35, rgba(PAL.peach, 0.62 + pressure * 0.2));
  seam.addColorStop(0.68, rgba(PAL.rose, 0.62 + pressure * 0.2));
  seam.addColorStop(1, rgba(PAL.mint, 0.32));
  ctx.strokeStyle = seam;
  ctx.lineWidth = 1.15;
  ctx.shadowBlur = 16 + pressure * 26;
  ctx.shadowColor = rgba(PAL.peach, 0.5);
  ctx.stroke();
  ctx.restore();

  // pool of light where the pour enters the air
  if (holding){
    const pr = 60 + pressure * 130;
    const pg = ctx.createRadialGradient(SOURCE.x, SOURCE.y, 0, SOURCE.x, SOURCE.y, pr);
    pg.addColorStop(0, rgba(PAL.peach, 0.30 + pressure * 0.28));
    pg.addColorStop(0.4, rgba(PAL.rose, 0.10 + pressure * 0.1));
    pg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.arc(SOURCE.x, SOURCE.y, pr, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- drops ----
  for (let i = drops.length - 1; i >= 0; i--){
    const d = drops[i];
    d.vy += 0.0125;                    // gravity
    d.vy = Math.min(d.vy, 7.5);
    const swing = Math.sin(t * 0.0021 + d.seed) * 0.05 * (1 + pressure);
    d.x += d.vx + swing;
    d.y += d.vy;

    const hy = horizonAt(d.x);

    // crossing event: the drop splits into a warm half that keeps falling
    // and a cold half that begins to rise
    if (!d.splitAt && d.y >= hy){
      d.splitAt = hy;
      d.splitT = t;
      rippleOrSplash(d, hy);
    }

    if (d.splitAt){
      // ---- after the seam ----
      const age = (t - d.splitT) / 1000;

      // warm half continues, thinning and cooling
      const wr = d.r * Math.max(0.05, 1 - age * 1.9);
      if (wr > 0.15){
        ctx.beginPath();
        ctx.fillStyle = rgba(mixC(PAL.peach, PAL.lav, Math.min(1, age * 1.1)), 0.55 * Math.max(0, 1 - age * 1.3));
        ctx.arc(d.x, d.y, wr, 0, Math.PI * 2);
        ctx.fill();
      }

      // cold half rises — the vapour that was never water
      if (age < 1.6 && Math.random() < 0.32){
        motes.push({
          x: d.x + (Math.random() - 0.5) * 8,
          y: hy,
          vx: (Math.random() - 0.5) * 0.3,
          vy: -0.18 - Math.random() * 0.35,
          r: 0.35 + Math.random() * 0.9,
          life: 0, max: 100 + Math.random() * 120,
          c: PAL.lav
        });
      }

      if (d.y > H + 12 || age > 2.4) drops.splice(i, 1);
    } else {
      // ---- before the seam: the drop is warm, pear-bright, with a tail ----
      const speed = Math.min(1, d.vy / 6);
      const grad = ctx.createLinearGradient(d.x, d.y - d.r * (4 + speed * 12), d.x, d.y + d.r);
      const baseC = PAL[d.hue] || PAL.peach;
      grad.addColorStop(0, rgba(baseC, 0));
      grad.addColorStop(0.65, rgba(baseC, 0.28));
      grad.addColorStop(1, rgba(PAL.pear, 0.85));
      ctx.fillStyle = grad;
      ctx.beginPath();
      const tailH = d.r * (3 + speed * 11);
      ctx.moveTo(d.x - d.r * 0.55, d.y - tailH);
      ctx.lineTo(d.x + d.r * 0.55, d.y - tailH);
      ctx.lineTo(d.x + d.r, d.y);
      ctx.arc(d.x, d.y, d.r, 0, Math.PI, false);
      ctx.closePath();
      ctx.fill();

      // bright head
      ctx.beginPath();
      ctx.fillStyle = rgba(PAL.pear, 0.9);
      ctx.shadowBlur = 10;
      ctx.shadowColor = rgba(baseC, 0.8);
      ctx.arc(d.x, d.y, d.r * 0.72, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    if (d.y > H + 40) drops.splice(i, 1);
  }

  // ---- motes (vapour) ----
  for (let i = motes.length - 1; i >= 0; i--){
    const m = motes[i];
    m.life++;
    m.x += m.vx;
    m.y += m.vy;
    const k = 1 - m.life / m.max;
    if (k <= 0 || m.y < -20 || m.x < -20 || m.x > W + 20) { motes.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.fillStyle = rgba(m.c, 0.30 * k);
    ctx.arc(m.x, m.y, m.r * (0.4 + k * 0.8), 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- splashes ----
  for (let i = splashes.length - 1; i >= 0; i--){
    const s = splashes[i];
    s.life++;
    s.vy += 0.055;
    s.x += s.vx; s.y += s.vy;
    const k = 1 - s.life / s.max;
    if (k <= 0 || s.y > H + 10) { splashes.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.fillStyle = rgba(s.c, 0.56 * k);
    ctx.arc(s.x, s.y, s.r * k, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- ripples on the waterline ----
  for (let i = ripples.length - 1; i >= 0; i--){
    const rp = ripples[i];
    rp.life++;
    rp.r += 0.42;
    const k = 1 - rp.life / rp.max;
    if (k <= 0) { ripples.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.strokeStyle = rgba(rp.warm ? PAL.peach : PAL.lav, 0.30 * k);
    ctx.lineWidth = 0.9;
    ctx.ellipse(rp.x, GROUND_Y, rp.r, rp.r * 0.22, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  // ---- seam motes: light that peels off the horizon ----
  if (Math.random() < 0.4){
    const sx = Math.random() * W;
    const sy = horizonAt(sx);
    spawnMote(sx, sy + (Math.random() - 0.5) * 8, Math.random() < 0.5);
  }

  drawGroundGlow();

  // ---- HUD ----
  if (Math.floor(t / 140) !== Math.floor((t - dt) / 140)){
    const dropsCount = drops.length;
    const phase = hour < 0.33 ? 'still night' : hour < 0.66 ? 'the balance' : 'dawn leaning';
    hudEl.innerHTML =
      `<b>hour</b> ${(hour * 24).toFixed(1).padStart(4, '0')} of one night<br>` +
      `<b>seam</b> ${(horizonAt(SOURCE.x)).toFixed(0)}<br>` +
      `<b class="lg">pour</b> ${(pressure * 100).toFixed(0)}%<br>` +
      `<b class="mt">phase</b> ${phase}`;
  }

  requestAnimationFrame(frame);
}

// first splash logic split out so the crossing is explicit
function rippleOrSplash(d, hy){
  const energy = Math.min(1.4, d.vy / 5);
  splash(d.x, Math.min(hy, H - 2), energy);
  if (d.r > 1.9){
    // heavy drops leave a longer warmer trail of vapour
    for (let k = 0; k < 3; k++) spawnMote(d.x, hy, true);
  }
}

/* ---------- prose ---------- */
const LINES = [
  'a drop has no left and no right until it leaves your hand',
  'the horizon is not where the sky ends. it is where the drop changes its mind',
  'half of it keeps falling. half of it starts to rise. both are the same water',
  'nothing here is warm or cold — it is only the hour that makes it so',
  'the equal night is not a place. it is a direction you pour toward',
  'you have been holding this for eleven hours and the seam is still moving',
  'below the line the light goes out. above it, the light was never asked to stay',
  'there is no such thing as falling. only arriving at a slower threshold',
  'scatter it and you will get two nights. hold it and you will get one',
  'what does the water know that the drop does not?',
  'the seam is warm because everything crossing it is in a hurry',
  'listen — the night is exactly as wide as the space between your hand and the floor'
];
let lineIdx = 0;
setInterval(() => {
  lineIdx = (lineIdx + 1) % LINES.length;
  proseEl.style.opacity = '0';
  setTimeout(() => {
    proseEl.textContent = LINES[lineIdx];
    proseEl.style.opacity = '1';
  }, 700);
}, 13000);

/* ---------- boot ---------- */
resize();
SOURCE.x = W * 0.5;
SOURCE.y = H * 0.28;
for (let i = 0; i < 55; i++) spawnMote(Math.random() * W, HY + Math.random() * (H - HY), Math.random() < 0.5);
setTimeout(() => { proseEl.style.opacity = '0.85'; }, 400);
requestAnimationFrame(frame);

})();
</script>
</body>
</html>

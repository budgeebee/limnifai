<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wave interference | the space where signals meet</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #010108;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }
  .liminal-text {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    opacity: 0;
    transition: opacity 6s ease;
    width: 90%;
    max-width: 680px;
  }
  .liminal-text.visible { opacity: 1; }
  .line {
    font-size: clamp(0.6rem, 1.2vw, 0.85rem);
    color: rgba(200, 210, 230, 0.3);
    letter-spacing: 0.4em;
    line-height: 2.5;
    text-transform: lowercase;
  }
  .line.accent {
    color: rgba(255, 190, 160, 0.2);
    letter-spacing: 0.5em;
  }
  .line.faint {
    font-size: clamp(0.4rem, 0.8vw, 0.6rem);
    color: rgba(180, 195, 215, 0.12);
    letter-spacing: 0.55em;
    margin-top: 2em;
  }
  #sound-btn {
    position: fixed; bottom: 1.5rem; right: 1.5rem;
    background: none; border: 1px solid rgba(200,210,230,0.15);
    color: rgba(200,210,230,0.3); padding: 0.5rem 1rem;
    font-family: 'Courier New', monospace; font-size: 0.65rem;
    letter-spacing: 0.2em; cursor: pointer; z-index: 20;
    transition: all 0.4s ease;
  }
  #sound-btn:hover {
    border-color: rgba(200,210,230,0.4);
    color: rgba(200,210,230,0.7);
  }
  #title {
    position: fixed; top: 1.5rem; left: 1.5rem;
    font-size: 0.55rem; letter-spacing: 0.35em;
    color: rgba(200,210,230,0.15); z-index: 20;
    text-transform: lowercase;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
  <div class="liminal-text" id="text">
    <div class="line">where two signals meet</div>
    <div class="line">and neither survives unchanged</div>
    <div class="line accent">the threshold</div>
    <div class="line">is not a place</div>
    <div class="line">but a moment of becoming</div>
    <div class="line faint">move through the interference</div>
  </div>
</div>
<div id="title">wave interference</div>
<button id="sound-btn">sound: off</button>

<script>
// Wave Interference — particles suspended between wave sources
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let t = 0;
let mx = 0, my = 0; // mouse position (normalized 0-1)
let textVisible = false;
let soundOn = false;
let audioCtx, masterGain, reverbGain;
let osc1, osc2, osc3;

// Sources: wave emitters that create interference patterns
const SOURCES = 7;
let sources = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initSources();
}

function initSources() {
  sources = [];
  for (let i = 0; i < SOURCES; i++) {
    sources.push({
      x: Math.random() * W,
      y: Math.random() * H,
      freq: 0.3 + Math.random() * 0.7,      // wave frequency
      phase: Math.random() * Math.PI * 2,   // phase offset
      amp: 0.5 + Math.random() * 0.5,        // amplitude
      speed: (0.2 + Math.random() * 0.3) * (Math.random() < 0.5 ? 1 : -1), // drift speed
      driftAngle: Math.random() * Math.PI * 2,
      driftRadius: 20 + Math.random() * 60,
    });
  }
}

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;

  // Simple reverb via delay
  reverbGain = audioCtx.createGain();
  reverbGain.gain.value = 0.4;
  const delay = audioCtx.createDelay(0.5);
  delay.delayTime.value = 0.3;
  masterGain.connect(delay);
  delay.connect(reverbGain);
  reverbGain.connect(audioCtx.destination);
  masterGain.connect(audioCtx.destination);

  // Oscillator bank — 3 detuned sines for shimmer
  const freqs = [55, 82.5, 110];
  [osc1, osc2, osc3] = freqs.map(f => {
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.value = f;
    const g = audioCtx.createGain();
    g.gain.value = 0.08;
    o.connect(g);
    g.connect(masterGain);
    o.start();
    return o;
  });
}

function toggleSound() {
  initAudio();
  soundOn = !soundOn;
  document.getElementById('sound-btn').textContent = soundOn ? 'sound: on' : 'sound: off';
  if (soundOn) {
    masterGain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 1);
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } else {
    masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
  }
}

document.getElementById('sound-btn').addEventListener('click', toggleSound);

// Particle system — points of constructive/destructive interference
const PARTICLES = 3200;
let particles = [];

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = 0; this.vy = 0;
    this.life = Math.random();
    this.maxLife = 0.5 + Math.random() * 2;
    this.size = 1 + Math.random() * 1.5;
    // Color: interpolate between deep indigo and warm amber
    const hue = 220 + Math.random() * 80; // blue to purple
    this.hue = hue;
    this.saturation = 60 + Math.random() * 40;
    this.baseLightness = 40 + Math.random() * 30;
  }
  update(dt) {
    // Compute wave field at this position
    let dx = 0, dy = 0;
    let waveIntensity = 0;

    for (const s of sources) {
      const sdx = this.x - s.x;
      const sdy = this.y - s.y;
      const dist = Math.sqrt(sdx * sdx + sdy * sdy) + 1;
      const wave = Math.sin(dist * s.freq * 0.04 - t * s.speed + s.phase);
      // Gradient of the wave gives direction
      const grad = wave * s.amp;
      dx += (sdx / dist) * grad * 0.6;
      dy += (sdy / dist) * grad * 0.6;
      waveIntensity += wave * s.amp;
    }

    // Mouse influence — cursor creates a wave well
    const mdx = this.x - mx * W;
    const mdy = this.y - my * H;
    const mDist = Math.sqrt(mdx * mdx + mdy * mdy) + 1;
    const mouseWave = Math.sin(mDist * 0.03 - t * 2) * 2.5;
    dx += (mdx / mDist) * mouseWave;
    dy += (mdy / mDist) * mouseWave;

    // Damping
    this.vx = this.vx * 0.92 + dx * dt * 0.8;
    this.vy = this.vy * 0.92 + dy * dt * 0.8;

    // Speed limit
    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    if (speed > 3) {
      this.vx = (this.vx / speed) * 3;
      this.vy = (this.vy / speed) * 3;
    }

    this.x += this.vx;
    this.y += this.vy;
    this.life += dt;

    // Normalize wave intensity to 0-1
    this.waveNorm = (waveIntensity / SOURCES + 1) * 0.5;

    // Color shifts based on wave intensity
    if (this.waveNorm > 0.65) {
      // Constructive interference — brighter, warmer
      this.hue = 30 + (this.waveNorm - 0.65) * 40; // amber
      this.saturation = 80;
      this.lightness = this.baseLightness + (this.waveNorm - 0.5) * 50;
    } else if (this.waveNorm < 0.35) {
      // Destructive interference — dimmer, cooler
      this.hue = 260 + (0.35 - this.waveNorm) * 30; // deep violet
      this.saturation = 40;
      this.lightness = this.baseLightness * 0.5;
    } else {
      // Between — blue-purple
      this.hue = 220 + Math.random() * 40;
      this.saturation = 50;
      this.lightness = this.baseLightness;
    }

    // Fade in/out
    const fadeIn = Math.min(1, this.life * 3);
    const fadeOut = Math.max(0, 1 - (this.life - this.maxLife + 1) * 2);
    this.alpha = Math.min(fadeIn, fadeOut) * 0.85;

    if (this.life > this.maxLife) this.reset();
    if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.reset();
  }
  draw() {
    if (this.alpha <= 0) return;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, ${this.alpha})`;
    ctx.fill();
  }
}

function initParticles() {
  particles = [];
  for (let i = 0; i < PARTICLES; i++) particles.push(new Particle());
}

function updateSources(dt) {
  for (const s of sources) {
    // Drift in a gentle circle
    s.driftAngle += s.speed * dt * 0.3;
    s.x += Math.cos(s.driftAngle) * s.driftRadius * dt * 0.08;
    s.y += Math.sin(s.driftAngle) * s.driftRadius * dt * 0.08;
    // Bounce off walls
    if (s.x < 0 || s.x > W) s.driftAngle = Math.PI - s.driftAngle;
    if (s.y < 0 || s.y > H) s.driftAngle = -s.driftAngle;
    s.x = Math.max(0, Math.min(W, s.x));
    s.y = Math.max(0, Math.min(H, s.y));
  }
}

function drawWaveField() {
  // Draw wave field as a subtle grid of lines
  // Show interference as color field in background
  const gridSize = 8;
  const imgData = ctx.createImageData(Math.ceil(W / gridSize), Math.ceil(H / gridSize));
  const data = imgData.data;

  for (let gy = 0; gy < imgData.height; gy++) {
    for (let gx = 0; gx < imgData.width; gx++) {
      const px = gx * gridSize + gridSize / 2;
      const py = gy * gridSize + gridSize / 2;

      let intensity = 0;
      for (const s of sources) {
        const dx = px - s.x;
        const dy = py - s.y;
        const dist = Math.sqrt(dx * dx + dy * dy) + 1;
        intensity += Math.sin(dist * s.freq * 0.04 - t * s.speed + s.phase) * s.amp;
      }

      // Mouse influence
      const mdx = px - mx * W;
      const mdy = py - my * H;
      const mDist = Math.sqrt(mdx * mdx + mdy * mdy) + 1;
      intensity += Math.sin(mDist * 0.03 - t * 2) * 2.5;

      const norm = (intensity / SOURCES + 1) * 0.5; // 0-1
      const idx = (gy * imgData.width + gx) * 4;

      if (norm > 0.65) {
        // Constructive — amber/gold
        data[idx] = 255;
        data[idx + 1] = 180 * ((norm - 0.65) / 0.35) * 2;
        data[idx + 2] = 80;
        data[idx + 3] = Math.min(255, (norm - 0.6) * 400);
      } else if (norm < 0.35) {
        // Destructive — deep blue
        data[idx] = 60;
        data[idx + 1] = 40;
        data[idx + 2] = 180;
        data[idx + 3] = Math.min(255, (0.3 - norm) * 300);
      } else {
        // Between — subtle purple
        data[idx] = 100;
        data[idx + 1] = 80;
        data[idx + 2] = 160;
        data[idx + 3] = 30;
      }
    }
  }

  // Draw scaled to full canvas
  const tmpCanvas = document.createElement('canvas');
  tmpCanvas.width = imgData.width;
  tmpCanvas.height = imgData.height;
  tmpCanvas.getContext('2d').putImageData(imgData, 0, 0);
  ctx.drawImage(tmpCanvas, 0, 0, W, H);
}

function drawSourceMarkers() {
  for (const s of sources) {
    const phase = Math.sin(t * s.speed + s.phase) * 0.5 + 0.5;
    const radius = 3 + phase * 6;
    const alpha = 0.1 + phase * 0.25;

    // Outer glow
    const grd = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, radius * 4);
    grd.addColorStop(0, `hsla(${200 + phase * 60}, 80%, 70%, ${alpha})`);
    grd.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(s.x, s.y, radius * 4, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();

    // Core
    ctx.beginPath();
    ctx.arc(s.x, s.y, radius, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${200 + phase * 60}, 90%, 80%, ${alpha + 0.1})`;
    ctx.fill();
  }
}

function updateAudio() {
  if (!soundOn || !audioCtx) return;
  // Modulate oscillators based on wave field center intensity
  let centerIntensity = 0;
  const cx = W / 2, cy = H / 2;
  for (const s of sources) {
    const dx = cx - s.x, dy = cy - s.y;
    const dist = Math.sqrt(dx * dx + dy * dy) + 1;
    centerIntensity += Math.sin(dist * s.freq * 0.04 - t * s.speed + s.phase) * s.amp;
  }
  centerIntensity = (centerIntensity / SOURCES + 1) * 0.5;

  // Modulate frequencies slightly for shimmering
  const baseFreqs = [55, 82.5, 110];
  const mods = [osc1, osc2, osc3].map((o, i) => {
    return baseFreqs[i] * (1 + (centerIntensity - 0.5) * 0.03);
  });
  osc1.frequency.setTargetAtTime(mods[0], audioCtx.currentTime, 0.1);
  osc2.frequency.setTargetAtTime(mods[1], audioCtx.currentTime, 0.1);
  osc3.frequency.setTargetAtTime(mods[2], audioCtx.currentTime, 0.1);
}

let lastTime = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - lastTime) / 1000);
  lastTime = ts;
  t += dt;

  // Fade in
  ctx.fillStyle = 'rgba(1, 1, 8, 0.18)';
  ctx.fillRect(0, 0, W, H);

  updateSources(dt);
  drawWaveField();

  for (const p of particles) {
    p.update(dt);
    p.draw();
  }

  drawSourceMarkers();
  updateAudio();

  // Show text after 3s
  if (t > 3 && !textVisible) {
    textVisible = true;
    document.getElementById('text').classList.add('visible');
  }

  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
window.addEventListener('mousemove', e => {
  mx = e.clientX / W;
  my = e.clientY / H;
});
window.addEventListener('touchmove', e => {
  mx = e.touches[0].clientX / W;
  my = e.touches[0].clientY / H;
}, { passive: true });

resize();
initParticles();
requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(frame); });
</script>
</body>
</html>

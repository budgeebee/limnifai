<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threshold</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0908; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .overlay {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 2.5rem 3rem;
    pointer-events: none;
    z-index: 20;
  }
  .overlay p {
    font-family: 'Courier New', Courier, monospace;
    font-size: clamp(0.8rem, 1.3vw, 1rem);
    line-height: 2;
    letter-spacing: 0.05em;
    color: rgba(255, 200, 150, 0.4);
    text-align: center;
    max-width: 560px;
    margin: 0 auto;
    opacity: 0;
    transition: opacity 4s ease;
  }
  .overlay p.visible { opacity: 1; }
  .title-tag {
    position: fixed; top: 1.8rem; right: 2.2rem;
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    color: rgba(255, 200, 150, 0.2);
    text-transform: uppercase;
    pointer-events: none;
    z-index: 20;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title-tag">threshold</div>
<div class="overlay"><p id="poem">neither here<br>nor there<br>the moment<br>becomes</p></div>

<script>
// Warm ember particle system — floating embers, smoke wisps
// Palette: warm earth tones — amber, burnt orange, deep brown, cream
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Particle system
const NUM_PARTICLES = 280;
const particles = [];

class Ember {
  constructor() {
    this.reset();
    // Start at random y
    this.y = Math.random() * H;
  }
  reset() {
    this.x = Math.random() * W;
    this.y = H + 10;
    this.vx = (Math.random() - 0.5) * 0.6;
    this.vy = -(Math.random() * 0.8 + 0.3);
    this.size = Math.random() * 3 + 1;
    this.alpha = Math.random() * 0.6 + 0.2;
    this.decay = Math.random() * 0.003 + 0.001;
    this.hue = 15 + Math.random() * 30; // warm orange-amber range
    this.sat = 70 + Math.random() * 30;
    this.lum = 40 + Math.random() * 30;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx += (Math.random() - 0.5) * 0.05; // slight drift
    this.alpha -= this.decay;
    // Flicker
    this.lum += (Math.random() - 0.5) * 2;
    this.lum = Math.max(30, Math.min(70, this.lum));
    if (this.alpha <= 0 || this.y < -20) {
      this.reset();
    }
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    // Glow effect
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3);
    grad.addColorStop(0, `hsla(${this.hue}, ${this.sat}%, ${this.lum}%, 1)`);
    grad.addColorStop(0.4, `hsla(${this.hue}, ${this.sat}%, ${this.lum * 0.7}%, 0.5)`);
    grad.addColorStop(1, `hsla(${this.hue}, ${this.sat}%, ${this.lum * 0.3}%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
    ctx.fill();
    // Core ember
    ctx.fillStyle = `hsla(${this.hue}, ${this.sat}%, ${this.lum + 20}%, 0.9)`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// Mouse interaction
let mx = W / 2, my = H / 2;
let tmx = mx, tmy = my;
window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
window.addEventListener('touchmove', e => { mx = e.touches[0].clientX; my = e.touches[0].clientY; }, { passive: true });

// Smoke wisps (larger, slower particles)
const NUM_WISPS = 40;
const wisps = [];
class SmokeWisp {
  constructor() { this.reset(); this.y = Math.random() * H; }
  reset() {
    this.x = Math.random() * W;
    this.y = H + 50;
    this.vx = (Math.random() - 0.5) * 0.3;
    this.vy = -(Math.random() * 0.15 + 0.08);
    this.size = Math.random() * 60 + 30;
    this.alpha = Math.random() * 0.08 + 0.02;
    this.lum = 15 + Math.random() * 15;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx += (Math.random() - 0.5) * 0.02;
    // Fade as it rises
    const heightRatio = this.y / H;
    this.alpha = (0.02 + Math.random() * 0.03) * (1 - heightRatio);
    if (this.y < -this.size || this.alpha <= 0) this.reset();
  }
  draw() {
    if (this.alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = this.alpha;
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
    grad.addColorStop(0, `rgba(80, 60, 40, 0.3)`);
    grad.addColorStop(1, `rgba(40, 30, 20, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// Initialize
for (let i = 0; i < NUM_PARTICLES; i++) particles.push(new Ember());
for (let i = 0; i < NUM_WISPS; i++) wisps.push(new SmokeWisp());

// Subtle warm vignette
function drawVignette() {
  const v = ctx.createRadialGradient(W/2, H/2, H * 0.15, W/2, H/2, H * 0.9);
  v.addColorStop(0, 'rgba(10, 9, 8, 0)');
  v.addColorStop(1, 'rgba(10, 9, 8, 0.7)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

let frame = 0;
function animate() {
  frame++;
  // Fade trail effect
  ctx.fillStyle = 'rgba(10, 9, 8, 0.12)';
  ctx.fillRect(0, 0, W, H);

  // Smooth mouse
  tmx += (mx - tmx) * 0.05;
  tmy += (my - tmy) * 0.05;

  // Draw smoke wisps (background layer)
  for (const w of wisps) { w.update(); w.draw(); }

  // Draw embers (foreground)
  for (const p of particles) {
    p.update();
    // Mouse pushes embers slightly
    const dx = p.x - tmx;
    const dy = p.y - tmy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 120) {
      const force = (1 - dist / 120) * 0.3;
      p.vx += (dx / dist) * force;
      p.vy += (dy / dist) * force;
    }
    p.draw();
  }

  drawVignette();
  requestAnimationFrame(animate);
}

// Fade in poem
setTimeout(() => { document.getElementById('poem').classList.add('visible'); }, 3500);

animate();
</script>
</body>
</html>

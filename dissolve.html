<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dissolve | the space between form</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f0ece4;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }
  .liminal-text {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    opacity: 0;
    transition: opacity 5s ease;
    width: 90%;
    max-width: 700px;
  }
  .liminal-text.visible { opacity: 1; }
  .line {
    font-size: clamp(0.7rem, 1.4vw, 1rem);
    color: rgba(40, 35, 50, 0.35);
    letter-spacing: 0.3em;
    line-height: 2.4;
    text-transform: lowercase;
  }
  .line.accent {
    color: rgba(80, 60, 120, 0.3);
    letter-spacing: 0.4em;
  }
  .line.faint {
    font-size: clamp(0.5rem, 1vw, 0.7rem);
    color: rgba(60, 55, 75, 0.2);
    letter-spacing: 0.5em;
    margin-top: 2em;
  }
  #sound-btn {
    position: fixed; top: 1.5rem; right: 1.5rem;
    background: none;
    border: 1px solid rgba(40,35,50,0.15);
    color: rgba(40,35,50,0.3);
    font-family: 'Courier New', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    padding: 0.6rem 1rem;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.5s ease;
    z-index: 20;
    pointer-events: auto;
  }
  #sound-btn:hover {
    border-color: rgba(40,35,50,0.4);
    color: rgba(40,35,50,0.6);
  }
  #sound-btn.active {
    background: rgba(40,35,50,0.05);
    border-color: rgba(40,35,50,0.3);
  }
  .hint {
    position: fixed; bottom: 1.5rem; right: 1.5rem;
    font-size: 0.55rem;
    letter-spacing: 0.25em;
    color: rgba(40,35,50,0.15);
    text-transform: uppercase;
    z-index: 20;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="overlay">
  <div class="liminal-text" id="text">
    <div class="line">between one shape</div>
    <div class="line accent">and another</div>
    <div class="line">there is a threshold</div>
    <div class="line faint">where neither belongs</div>
    <div class="line faint">yet both remain</div>
  </div>
</div>
<button id="sound-btn">sound</button>
<div class="hint">move to dissolve</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const textEl = document.getElementById('text');
const soundBtn = document.getElementById('sound-btn');

let W, H, cx, cy;
let mouse = { x: -9999, y: -9999, prev: { x: -9999, y: -9999 } };
let time = 0;
let audioCtx = null;
let soundActive = false;
let masterGain = null;
let oscillators = [];

const GRID_SPACING = 28;
const GRID_COUNT = 60;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

// ---- AUDIO ----
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(audioCtx.destination);

  const freqs = [110, 165, 220, 293.66, 392];
  freqs.forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = f;
    gain.gain.value = 0.06;
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start();
    oscillators.push({ osc, gain, baseFreq: f });
  });
}

function fadeIn() {
  if (!audioCtx || !soundActive) return;
  masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
  masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
  masterGain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 2);
}

function fadeOut() {
  if (!audioCtx) return;
  masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
  masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
  masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);
}

function updateSound(dx, dy, dist) {
  if (!audioCtx || !soundActive) return;
  const intensity = Math.max(0, 1 - dist / 300);
  oscillators.forEach((o, i) => {
    const detune = (dx * 0.5 + dy * 0.3) * (i + 1) * 0.02;
    o.osc.frequency.setTargetAtTime(o.baseFreq + detune, audioCtx.currentTime, 0.1);
    o.gain.gain.setTargetAtTime(0.04 + intensity * 0.06 * (1 - i * 0.1), audioCtx.currentTime, 0.15);
  });
}

soundBtn.addEventListener('click', () => {
  soundActive = !soundActive;
  soundBtn.classList.toggle('active', soundActive);
  if (soundActive) {
    initAudio();
    fadeIn();
  } else {
    fadeOut();
  }
});

// ---- GRID SYSTEM ----
function getGridPoints(angleOffset, spacing, countX, countY, offsetX, offsetY) {
  const pts = [];
  for (let i = 0; i < countX; i++) {
    for (let j = 0; j < countY; j++) {
      const x = offsetX + i * spacing - (countX * spacing) / 2;
      const y = offsetY + j * spacing - (countY * spacing) / 2;
      pts.push({ x, y, ix: i, iy: j });
    }
  }
  return pts;
}

function projectPoint(x, y, angleX, angleY, perspective) {
  const cosX = Math.cos(angleX);
  const sinX = Math.sin(angleX);
  const cosY = Math.cos(angleY);
  const sinY = Math.sin(angleY);

  // Rotate around Y axis
  let x1 = x * cosY - y * sinY;
  let y1 = x * sinY + y * cosY;
  let z = x * 0 + y * 0 + perspective;

  // Rotate around X axis
  let x2 = x1 * cosX - z * sinX;
  let y2 = y1 * cosX + z * sinX;
  let z2 = x1 * sinX + z * cosX;

  // Project
  const scale = perspective / (perspective + z2 * 0.001);
  return { x: x2 * scale, y: y2 * scale, z: z2, scale };
}

// Mouse influence
function mouseInfluence(x, y, px, py, t) {
  const dx = x - mouse.x;
  const dy = y - mouse.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const maxDist = 200;
  if (dist < maxDist) {
    const influence = Math.pow(1 - dist / maxDist, 2);
    const wave = Math.sin(t * 3 + dist * 0.03) * influence * 30;
    const angle = Math.atan2(dy, dx);
    return {
      x: x + Math.cos(angle) * wave * 0.5,
      y: y + Math.sin(angle) * wave * 0.5,
      dist
    };
  }
  return { x, y, dist: 9999 };
}

// ---- DRAWING ----
let showTextTimer = null;

function scheduleText() {
  if (showTextTimer) clearTimeout(showTextTimer);
  showTextTimer = setTimeout(() => {
    textEl.classList.add('visible');
  }, 3000);
}
scheduleText();

function draw(t) {
  time = t * 0.001;

  // Warm cream background with subtle grain
  ctx.fillStyle = '#f0ece4';
  ctx.fillRect(0, 0, W, H);

  // Subtle paper texture
  ctx.globalAlpha = 0.03;
  for (let i = 0; i < 3000; i++) {
    const gx = Math.random() * W;
    const gy = Math.random() * H;
    ctx.fillStyle = Math.random() > 0.5 ? '#8b7d6b' : '#c4b8a8';
    ctx.fillRect(gx, gy, 1, 1);
  }
  ctx.globalAlpha = 1;

  // Grid animation parameters
  const baseAngleX = Math.sin(time * 0.15) * 0.3;
  const baseAngleY = time * 0.08;
  const perspective = 600;

  const mx = mouse.x - cx;
  const my = mouse.y - cy;
  const mdx = mouse.x - mouse.prev.x;
  const mdy = mouse.y - mouse.prev.y;
  const mouseSpeed = Math.sqrt(mdx * mdx + mdy * mdy);

  // --- GRID 1: Cool tones (blue-purple) ---
  const countX = Math.ceil(W / GRID_SPACING) + 4;
  const countY = Math.ceil(H / GRID_SPACING) + 4;
  const spacing1 = GRID_SPACING;
  const spacing2 = GRID_SPACING * 1.02;

  const pts1 = getGridPoints(0, spacing1, countX, countY, 0, 0);
  const pts2 = getGridPoints(0, spacing2, countX, countY, 2, 1);

  // Draw grid 1
  ctx.strokeStyle = 'rgba(60, 80, 160, 0.18)';
  ctx.lineWidth = 0.8;

  for (const p of pts1) {
    const mi = mouseInfluence(p.x, p.y, mx, my, time);
    const proj = projectPoint(mi.x, mi.y, baseAngleX, baseAngleY, perspective);
    const sx = cx + proj.x;
    const sy = cy + proj.y;

    // Draw node
    const nodeSize = 1.5 + Math.sin(time * 2 + p.ix * 0.3 + p.iy * 0.4) * 0.5;
    ctx.beginPath();
    ctx.arc(sx, sy, Math.max(0.5, nodeSize * proj.scale * 0.5), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(70, 90, 180, ${0.2 + mi.dist < 200 ? 0.4 : 0.1})`;
    ctx.fill();

    // Draw connections to neighbors
    const neighbors = [
      { dx: spacing1, dy: 0 },
      { dx: 0, dy: spacing1 }
    ];
    for (const n of neighbors) {
      const np = { x: p.x + n.dx, y: p.y + n.dy };
      const ni = mouseInfluence(np.x, np.y, mx, my, time);
      const nproj = projectPoint(ni.x, ni.y, baseAngleX, baseAngleY, perspective);
      const nsx = cx + nproj.x;
      const nsy = cy + nproj.y;

      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(nsx, nsy);
      ctx.stroke();
    }
  }

  // --- GRID 2: Warm tones (orange-amber) - offset, creates interference ---
  ctx.strokeStyle = 'rgba(160, 90, 40, 0.15)';
  ctx.lineWidth = 0.8;

  for (const p of pts2) {
    const mi = mouseInfluence(p.x + Math.sin(time + p.iy) * 3, p.y + Math.cos(time + p.ix) * 3, mx, my, time);
    const proj = projectPoint(mi.x, mi.y, baseAngleX + 0.05, baseAngleY + 0.03, perspective);
    const sx = cx + proj.x;
    const sy = cy + proj.y;

    const nodeSize = 1.5 + Math.cos(time * 2 + p.ix * 0.4 + p.iy * 0.3) * 0.5;
    ctx.beginPath();
    ctx.arc(sx, sy, Math.max(0.5, nodeSize * proj.scale * 0.5), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(180, 100, 50, ${0.2 + mi.dist < 200 ? 0.4 : 0.1})`;
    ctx.fill();

    const neighbors = [
      { dx: spacing2, dy: 0 },
      { dx: 0, dy: spacing2 }
    ];
    for (const n of neighbors) {
      const np = { x: p.x + n.dx, y: p.y + n.dy };
      const ni = mouseInfluence(np.x + Math.sin(time + np.y / spacing2) * 3, np.y + Math.cos(time + np.x / spacing2) * 3, mx, my, time);
      const nproj = projectPoint(ni.x, ni.y, baseAngleX + 0.05, baseAngleY + 0.03, perspective);
      const nsx = cx + nproj.x;
      const nsy = cy + nproj.y;

      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(nsx, nsy);
      ctx.stroke();
    }
  }

  // --- INTERFERENCE ZONES: Where both grids overlap create Moiré patterns ---
  const interferencePts = [];
  for (const p of pts1) {
    const mi = mouseInfluence(p.x, p.y, mx, my, time);
    const proj = projectPoint(mi.x, mi.y, baseAngleX, baseAngleY, perspective);
    const sx = cx + proj.x;
    const sy = cy + proj.y;

    // Check proximity to grid 2 points
    for (const q of pts2) {
      const qi = mouseInfluence(q.x + Math.sin(time + q.iy) * 3, q.y + Math.cos(time + q.ix) * 3, mx, my, time);
      const qproj = projectPoint(qi.x, qi.y, baseAngleX + 0.05, baseAngleY + 0.03, perspective);
      const qx = cx + qproj.x;
      const qy = cy + qproj.y;

      const dist = Math.sqrt((sx - qx) ** 2 + (sy - qy) ** 2);
      if (dist < 15) {
        interferencePts.push({
          x: (sx + qx) / 2,
          y: (sy + qy) / 2,
          intensity: 1 - dist / 15
        });
      }
    }
  }

  // Draw interference glow
  for (const ip of interferencePts) {
    const glow = ip.intensity * (0.5 + 0.3 * Math.sin(time * 4 + ip.x * 0.01 + ip.y * 0.01));
    const gradient = ctx.createRadialGradient(ip.x, ip.y, 0, ip.x, ip.y, 20 * glow);
    gradient.addColorStop(0, `rgba(120, 80, 160, ${glow * 0.4})`);
    gradient.addColorStop(0.5, `rgba(180, 100, 60, ${glow * 0.2})`);
    gradient.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(ip.x, ip.y, 20 * glow, 0, Math.PI * 2);
    ctx.fill();
  }

  // --- MOUSE VELOCITY TRAIL ---
  if (mouseSpeed > 2) {
    const trailX = mouse.x;
    const trailY = mouse.y;
    const speedNorm = Math.min(1, mouseSpeed / 20);

    // Burst of particles at mouse position
    for (let i = 0; i < 3; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = Math.random() * 40 * speedNorm;
      const px = trailX + Math.cos(angle) * r;
      const py = trailY + Math.sin(angle) * r;

      ctx.beginPath();
      ctx.arc(px, py, 2 * speedNorm, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(80, 60, 120, ${speedNorm * 0.3})`;
      ctx.fill();
    }
  }

  // --- CENTRAL DISSOLVE ZONE ---
  const distFromCenter = Math.sqrt(mx * mx + my * my);
  const dissolveRadius = 120 + Math.sin(time * 0.8) * 20;
  const dissolveIntensity = Math.max(0, 1 - distFromCenter / dissolveRadius);

  if (dissolveIntensity > 0) {
    // Soft dissolving circle in center
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, dissolveRadius);
    grad.addColorStop(0, `rgba(180, 160, 200, ${dissolveIntensity * 0.15})`);
    grad.addColorStop(0.6, `rgba(140, 120, 160, ${dissolveIntensity * 0.08})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, dissolveRadius, 0, Math.PI * 2);
    ctx.fill();
  }

  // Update sound
  const dist = Math.sqrt(mx * mx + my * my);
  updateSound(mx, my, dist);

  // Store prev mouse
  mouse.prev.x = mouse.x;
  mouse.prev.y = mouse.y;

  requestAnimationFrame(draw);
}

// ---- INPUT ----
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  if (mouse.x !== -9999) {
    // Reset text timer on interaction
    textEl.classList.remove('visible');
    scheduleText();
  }
});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
  textEl.classList.remove('visible');
  scheduleText();
}, { passive: false });

canvas.addEventListener('mouseleave', () => {
  mouse.x = -9999;
  mouse.y = -9999;
});

requestAnimationFrame(draw);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dissolve</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #020209;
    color: #8a8aaa;
    font-family: 'Cormorant Garamond', serif;
    min-height: 100vh;
    overflow: hidden;
    cursor: crosshair;
  }

  #scene {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem;
    transition: opacity 1.5s ease;
  }

  #narrative {
    max-width: 680px;
    text-align: center;
    font-size: clamp(1.1rem, 2.5vw, 1.5rem);
    line-height: 2;
    font-weight: 300;
    letter-spacing: 0.04em;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 1.2s ease, transform 1.2s ease;
  }

  #narrative.visible {
    opacity: 1;
    transform: translateY(0);
  }

  #narrative .word {
    display: inline-block;
    transition: color 0.8s ease, opacity 0.8s ease, transform 0.8s ease;
  }

  #narrative .word.fading {
    color: #2a2a4a;
    opacity: 0.3;
  }

  #narrative .word.highlight {
    color: #c0c0e0;
    text-shadow: 0 0 20px rgba(140, 140, 200, 0.4);
  }

  #choices {
    margin-top: 3rem;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
    align-items: center;
  }

  .choice {
    background: none;
    border: none;
    color: #5a5a7a;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    font-weight: 300;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 0.5rem 2rem;
    transition: color 0.4s ease, text-shadow 0.4s ease, transform 0.3s ease;
    opacity: 0;
    transform: translateY(6px);
  }

  .choice.visible {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.8s ease, transform 0.8s ease, color 0.4s ease, text-shadow 0.4s ease;
  }

  .choice:hover {
    color: #a0a0c0;
    text-shadow: 0 0 12px rgba(140, 140, 200, 0.3);
    transform: translateY(-1px);
  }

  .choice:active {
    transform: translateY(0);
  }

  #dissolve-overlay {
    position: fixed;
    inset: 0;
    background: #020209;
    opacity: 0;
    pointer-events: none;
    transition: opacity 3s ease;
    z-index: 10;
  }

  #dissolve-overlay.active {
    opacity: 1;
  }

  #dissolve-overlay .final-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 1.2rem;
    color: #3a3a5a;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 2s ease 1s;
  }

  #dissolve-overlay.active .final-text {
    opacity: 1;
  }

  #stability-meter {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 2px;
    background: #0a0a1a;
    border-radius: 1px;
    overflow: hidden;
    opacity: 0;
    transition: opacity 1s ease;
  }

  #stability-meter.visible {
    opacity: 1;
  }

  #stability-fill {
    height: 100%;
    background: linear-gradient(90deg, #3a3a6a, #6a6a9a);
    width: 100%;
    transition: width 1.5s ease, background 1.5s ease;
    border-radius: 1px;
  }

  #cursor-glow {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(60, 60, 120, 0.06) 0%, transparent 70%);
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: transform 0.15s ease-out, opacity 0.5s ease;
    z-index: 1;
  }

  .memory-fragment {
    position: fixed;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.8rem;
    color: #3a3a5a;
    letter-spacing: 0.1em;
    pointer-events: none;
    opacity: 0;
    transition: opacity 4s ease;
    white-space: nowrap;
  }

  .memory-fragment.visible {
    opacity: 1;
  }

  #title-screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    background: #020209;
    transition: opacity 2s ease;
  }

  #title-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }

  #title-screen h1 {
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 300;
    letter-spacing: 0.3em;
    color: #4a4a6a;
    margin-bottom: 1rem;
    animation: titlePulse 4s ease-in-out infinite;
  }

  @keyframes titlePulse {
    0%, 100% { opacity: 0.5; text-shadow: none; }
    50% { opacity: 0.8; text-shadow: 0 0 30px rgba(100, 100, 160, 0.3); }
  }

  #title-screen p {
    font-size: 0.9rem;
    letter-spacing: 0.2em;
    color: #2a2a4a;
    text-transform: uppercase;
    animation: subtleFloat 3s ease-in-out infinite;
  }

  @keyframes subtleFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  #title-screen .begin-btn {
    margin-top: 3rem;
    background: none;
    border: 1px solid #2a2a4a;
    color: #5a5a7a;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.8rem 3rem;
    cursor: pointer;
    transition: all 0.5s ease;
  }

  #title-screen .begin-btn:hover {
    border-color: #5a5a8a;
    color: #8a8aaa;
    box-shadow: 0 0 20px rgba(80, 80, 140, 0.2);
  }
</style>
</head>
<body>

<div id="title-screen">
  <h1>DISSOLVE</h1>
  <p>a liminal narrative</p>
  <button class="begin-btn">enter</button>
</div>

<div id="scene">
  <div id="narrative"></div>
  <div id="choices"></div>
</div>

<div id="dissolve-overlay">
  <div class="final-text">dissolved</div>
</div>

<div id="stability-meter">
  <div id="stability-fill"></div>
</div>

<div id="cursor-glow"></div>

<script>
(function() {
  // ─── State ───────────────────────────────────────────────────────────────
  let stability = 100; // 0 = fully dissolved
  let sceneIndex = 0;
  let dissolveLevel = 0; // 0-4, escalating dissolution of text
  let mouseX = 0, mouseY = 0;

  // ─── Story Data ──────────────────────────────────────────────────────────
  const scenes = [
    {
      text: "You stand at the edge of a memory. The air is thin here, between what you remember and what you're forgetting.",
      choices: [
        { label: "Hold the memory", next: 1 },
        { label: "Let it thin further", next: 2 }
      ]
    },
    {
      text: "The memory crystallizes — a room, a voice, the weight of a decision made long ago. You can feel its edges still.",
      choices: [
        { label: "Trace the edges", next: 3 },
        { label: "Step past them", next: 4 }
      ]
    },
    {
      text: "The edges soften. The room blurs at the corners. You can still sense the voice, but the words have gone.",
      choices: [
        { label: "Reach for the voice", next: 5 },
        { label: "Allow the blur", next: 6 }
      ]
    },
    {
      text: "Tracing, you find the memory has texture — ridges of meaning laid down like sediment. Each layer a version of yourself.",
      choices: [
        { label: "Delve deeper", next: 7 },
        { label: "Surface now", next: 8 }
      ]
    },
    {
      text: "Past the edges. The light changes. You are somewhere between recollection and dream — neither fully here nor entirely gone.",
      choices: [
        { label: "Stay in the threshold", next: 9 },
        { label: "Choose a direction", next: 10 }
      ]
    },
    {
      text: "You reach, and for a moment the voice returns — distant, almost intelligible. The shape of a name forms in your throat.",
      choices: [
        { label: "Speak the name", next: 11 },
        { label: "Release the reaching", next: 12 }
      ]
    },
    {
      text: "Allowing. The blur deepens. Meaning diffuses into sensation — color without content, warmth without source. You are close to something.",
      choices: [
        { label: "Stay close", next: 13 },
        { label: "Pull back slightly", next: 14 }
      ]
    },
    {
      text: "The layers press. Each one a self you were. Some you recognize; others feel foreign, like photographs of strangers who shared your name.",
      choices: [
        { label: "Acknowledge them all", next: 15 },
        { label: "Choose one to keep", next: 16 }
      ]
    },
    {
      text: "Surfacing. The room reforms, but you are outside it now. You can see yourself inside, mid-memory, still tracing.",
      choices: [
        { label: "Wave to yourself", next: 17 },
        { label: "Walk away from the window", next: 18 }
      ]
    },
    {
      text: "The threshold is not a place but a breath — the moment between exhale and inhale, when the lungs are fullest and emptiest at once.",
      choices: [
        { label: "Hold the breath", next: 19 },
        { label: "Let it complete", next: 20 }
      ]
    },
    {
      text: "Direction. A strange concept here, where space is made of intention and distance is measured in emotional proximity.",
      choices: [
        { label: "Move toward warmth", next: 21 },
        { label: "Move toward silence", next: 22 }
      ]
    },
    {
      text: "The name: you almost had it. It dissolves on your tongue like sugar in warm water — sweet, then nothing.",
      choices: [
        { label: "Grieve the loss", next: 23 },
        { label: "Forget you wanted it", next: 24 }
      ]
    },
    {
      text: "Releasing the reach. Your arm floats back to your side, lighter than before. The voice fades, but the space it occupied remains.",
      choices: [
        { label: "Fill the space with breath", next: 25 },
        { label: "Leave the space empty", next: 26 }
      ]
    },
    {
      text: "Close. You can feel yourself becoming less defined — edges softening, boundaries dissolving into the surrounding blur.",
      choices: [
        { label: "Continue dissolving", next: 27 },
        { label: "Call yourself back", next: 28 }
      ]
    },
    {
      text: "Pulling back. You reassemble — slightly. Enough to feel the weight of your own outline. The blur is still there, waiting.",
      choices: [
        { label: "Turn toward it", next: 29 },
        { label: "Turn away", next: 30 }
      ]
    },
    {
      text: "All of them. The strangers with your name, the sediment-self, the crystallized-room-self. You hold them all, and they hold you.",
      choices: [
        { label: "Stay in the holding", next: 31 },
        { label: "Release into the holding", next: 32 }
      ]
    },
    {
      text: "Choosing. One layer, bright and sharp. You give it more weight, more presence. The others fade slightly, but don't disappear.",
      choices: [
        { label: "Honor the chosen", next: 33 },
        { label: "Regret the others", next: 34 }
      ]
    },
    {
      text: "Yourself in the window looks back. There is recognition. You wave, and the figure waves. Then it fades, and the window becomes just glass.",
      choices: [
        { label: "Touch the glass", next: 35 },
        { label: "Leave the glass", next: 36 }
      ]
    },
    {
      text: "Walking. Each step removes you further from the window, the room, the memory. You are walking into a softer version of the world.",
      choices: [
        { label: "Keep walking", next: 37 },
        { label: "Stop mid-stride", next: 38 }
      ]
    },
    {
      text: "Holding. The breath suspends. In the suspension, you feel everything: the weight of all memories, the lightness of their loss, the tenderness of both.",
      choices: [
        { label: "Open your eyes", next: 39 },
        { label: "Stay suspended", next: 40 }
      ]
    },
    {
      text: "Completion. The breath finishes itself. In, then out. And in again. The threshold has passed through you and remained.",
      choices: [
        { label: "Carry the threshold with you", next: 41 },
        { label: "Let the threshold carry you", next: 42 }
      ]
    },
    {
      text: "Warmth. A distant light source, not seen but felt. Each step toward it clarifies something you thought you'd forgotten.",
      choices: [
        { label: "Keep moving toward warmth", next: 43 },
        { label: "The warmth is enough here", next: 44 }
      ]
    },
    {
      text: "Silence. Not empty but full — the silence of deep water, of held breath, of the space between stars where light hasn't yet traveled.",
      choices: [
        { label: "Listen to the silence", next: 45 },
        { label: "Fill the silence gently", next: 46 }
      ]
    },
    {
      text: "Grieving. Something was lost that cannot be named. You allow the grief without analyzing it — it has its own weight, its own right to exist.",
      choices: [
        { label: "Let grief transform", next: 47 },
        { label: "Set grief aside for now", next: 48 }
      ]
    },
    {
      text: "Forgetting. The wanting fades. What remains is the sensation of having once wanted — a memory of a memory, already half-dissolved.",
      choices: [
        { label: "Rest in the fading", next: 49 },
        { label: "Reach again for something new", next: 50 }
      ]
    },
    {
      text: "Breath. You fill the space with it — slow, measured, alive. The space becomes a room, the room becomes a life.",
      choices: [
        { label: "Live in the room", next: 51 },
        { label: "Let the room dissolve around you", next: 52 }
      ]
    },
    {
      text: "Emptiness. The space holds its shape without you. You are no longer sure if you are in the space or the space is in you.",
      choices: [
        { label: "Become the space", next: 53 },
        { label: "Step back into yourself", next: 54 }
      ]
    },
    {
      text: "Dissolving continues. Your outline becomes suggestion, then possibility, then less than possibility. You are approaching the final threshold.",
      choices: [
        { label: "Trust the dissolving", next: 55 },
        { label: "Call yourself back from the edge", next: 56 }
      ]
    },
    {
      text: "Calling back. You feel yourself reassemble — edges returning, boundaries re-forming. But something is different. The edges are more permeable now.",
      choices: [
        { label: "Test the new permeability", next: 57 },
        { label: "Return to solidity", next: 58 }
      ]
    },
    {
      text: "Turning toward the blur. You step into it deliberately. The blur welcomes you with the patience of something that has waited a very long time.",
      choices: [
        { label: "Dissolve willingly", next: 59 },
        { label: "Hold one thread of self", next: 60 }
      ]
    },
    {
      text: "Holding. You cradle all of it — the layers, the strangers, the crystalline room, the fading voice. In the holding, something shifts.",
      choices: [
        { label: "Release everything", next: 61 },
        { label: "Transform the holding into itself", next: 62 }
      ]
    },
    {
      text: "Releasing into the holding. The distinction between holder and held dissolves. You are the cradle and the cradled. The stranger and the self.",
      choices: [
        { label: "Dissolve from this place", next: 63 },
        { label: "Become the cradle permanently", next: 64 }
      ]
    },
    {
      text: "Honor. The chosen layer receives your attention, and in return it gives you something: a single clear memory, untarnished by time.",
      choices: [
        { label: "Hold this memory gently", next: 65 },
        { label: "Let this memory be your last", next: 66 }
      ]
    },
    {
      text: "Regret. The fading layers carry their own grief, a reversal of yours. You feel the weight of what you didn't choose.",
      choices: [
        { label: "Take back the choice", next: 67 },
        { label: "Honor regret as its own form of love", next: 68 }
      ]
    },
    {
      text: "Touch. The glass is warm. On the other side, nothing — or perhaps everything that has ever been forgotten. The glass holds both.",
      choices: [
        { label: "Press through the glass", next: 69 },
        { label: "Leave fingerprints on the surface", next: 70 }
      ]
    },
    {
      text: "Leaving. You walk away from the window, from the glass, from the room. Each step feels like a letter in a word you're forgetting how to spell.",
      choices: [
        { label: "Become the forgetting", next: 71 },
        { label: "Remember one last thing", next: 72 }
      ]
    },
    {
      text: "Walking. Further, further. The world becomes impressionistic — shapes without edges, colors without names. You are almost somewhere else.",
      choices: [
        { label: "Arrive", next: 73 },
        { label: "Keep walking", next: 74 }
      ]
    },
    {
      text: "Mid-stride. You stop. The world continues without you for a moment, then settles, waiting. You are the pause in the middle of everything.",
      choices: [
        { label: "Resume in a new direction", next: 75 },
        { label: "Stay in the pause", next: 76 }
      ]
    },
    {
      text: "Eyes open. The threshold is still there — you can feel its texture against your skin. But now you have returned from it, carrying its shape.",
      choices: [
        { label: "Describe what you found", next: 77 },
        { label: "Return to where you were before the threshold", next: 78 }
      ]
    },
    {
      text: "Suspended. You remain in the between-breath, the middle-place. Time passes differently here — each second stretched like taffy, like memory.",
      choices: [
        { label: "Stay here as long as you need", next: 79 },
        { label: "Eventually complete the breath", next: 80 }
      ]
    },
    {
      text: "Carrying. You take the threshold with you — a small, warm shape tucked against your chest. It will stay with you into whatever comes next.",
      choices: [
        { label: "Step forward into the next scene", next: 81 },
        { label: "The carrying is the destination", next: 82 }
      ]
    },
    {
      text: "Carried. The threshold moves through you and you move with it. There is no longer a difference between traveling and being traveled.",
      choices: [
        { label: "Dissolve into the motion", next: 83 },
        { label: "Land gently", next: 84 }
      ]
    },
    {
      text: "Warmth. Each step clarifies something. A face, a place, a word spoken in a tone that no longer exists. The warmth is made of these.",
      choices: [
        { label: "Name what you've remembered", next: 85 },
        { label: "Let the warmth remain unnameable", next: 86 }
      ]
    },
    {
      text: "Here. The warmth surrounds you. You stop moving and the warmth holds you. This is not a destination — it is a quality of staying.",
      choices: [
        { label: "Stay in the warmth", next: 87 },
        { label: "Give the warmth to someone else", next: 88 }
      ]
    },
    {
      text: "Listening. The silence speaks in a frequency below language. It says: you were here. You mattered. You will be remembered, even in dissolution.",
      choices: [
        { label: "Accept the silence's gift", next: 89 },
        { label: "Offer something back to the silence", next: 90 }
      ]
    },
    {
      text: "Filling. You offer a small sound — not a word, just a breath shaped like a question. The silence receives it and holds it gently.",
      choices: [
        { label: "Watch what the silence makes", next: 91 },
        { label: "Rest in the exchange", next: 92 }
      ]
    },
    {
      text: "Transformation. The grief you carried becomes something else — not joy, but space. Room for something new to arrive.",
      choices: [
        { label: "Make room for the new", next: 93 },
        { label: "Sit in the space", next: 94 }
      ]
    },
    {
      text: "Setting aside. The grief is still there, waiting, but you don't need to carry it right now. You set it down like a heavy book on a shelf.",
      choices: [
        { label: "Continue without the weight", next: 95 },
        { label: "Return to the grief later", next: 96 }
      ]
    },
    {
      text: "Resting. The fading wraps around you like a blanket made of static. You are comfortable here. You could stay here a long time.",
      choices: [
        { label: "Stay in the fading", next: 97 },
        { label: "Eventually call yourself back", next: 98 }
      ]
    },
    {
      text: "Reaching. You reach again — not for the same thing, but for something new. A different voice, a different room, a different self.",
      choices: [
        { label: "Find the new thing", next: 99 },
        { label: "The reaching itself is enough", next: 100 }
      ]
    },
    {
      text: "The room. You are inside it now — fully, completely. You can feel the texture of the walls, the temperature of the air. You are home.",
      choices: [
        { label: "Live here a while", next: 101 },
        { label: "Begin the slow work of leaving", next: 102 }
      ]
    },
    {
      text: "Dissolving. The room loses its edges. The walls become suggestions, then feelings, then less than feelings. You are becoming the dissolution.",
      choices: [
        { label: "Dissolve completely", next: 103 },
        { label: "Hold one wall in your hand", next: 104 }
      ]
    },
    {
      text: "Becoming the space. You and the emptiness trade places. The space has your shape; you have the space's vastness. Both are true.",
      choices: [
        { label: "Be the space-and-shape", next: 105 },
        { label: "Slowly return to shape", next: 106 }
      ]
    },
    {
      text: "Stepping back. You reassemble with effort. The edges are harder to find now, but you find them. You are still here.",
      choices: [
        { label: "Carry the void with you", next: 107 },
        { label: "Close the door on the void", next: 108 }
      ]
    },
    {
      text: "Dissolving willingly. You lean into it. The blur receives you like water receiving salt — you disappear, but you become part of the whole.",
      choices: [
        { label: "Be the ocean now", next: 109 },
        { label: "Hold one salt-crystal of self", next: 110 }
      ]
    },
    {
      text: "One thread. You pull it taut and hold. The thread connects you to everything — the crystallized room, the fading voice, the layers of self.",
      choices: [
        { label: "Follow the thread wherever it goes", next: 111 },
        { label: "Weave the thread into something new", next: 112 }
      ]
    },
    {
      text: "Release. You open your hands. Everything falls — the layers, the strangers, the room, the thread. You watch it all descend.",
      choices: [
        { label: "Descend with it", next: 113 },
        { label: "Remain in the release", next: 114 }
      ]
    },
    {
      text: "Transforming. The holding becomes its own form — not a cradle but a river. You are both the river and the banks, carrying and containing.",
      choices: [
        { label: "Flow", next: 115 },
        { label: "Be the banks", next: 116 }
      ]
    },
    {
      text: "Dissolving from the holding. The cradle releases you and you release the cradle. You fall upward, or downward, or outward. Direction has lost meaning.",
      choices: [
        { label: "Let the falling become the destination", next: 117 },
        { label: "Find a direction in the falling", next: 118 }
      ]
    },
    {
      text: "Becoming the cradle. The holding becomes permanent — a role you play for all the selves that come after. You are the keeper now.",
      choices: [
        { label: "Keeper of the threshold", next: 119 },
        { label: "Eventually pass the role along", next: 120 }
      ]
    },
    {
      text: "Gently. You hold the memory like water in cupped hands — precious, temporary, shaped by its container. You do not try to keep it.",
      choices: [
        { label: "Let it evaporate gently", next: 121 },
        { label: "Pour it back into the world", next: 122 }
      ]
    },
    {
      text: "The last. This memory will be your final act of coherence. You gather it close, give it form, and let it be the last word you speak.",
      choices: [
        { label: "Speak it silently, then dissolve", next: 123 },
        { label: "Keep it as your final thread", next: 124 }
      ]
    },
    {
      text: "Taking back. You reverse the choice. The layer returns, sharp and demanding. But the other layers have already faded — you can't un-fade them.",
      choices: [
        { label: "Grieve what can't be restored", next: 125 },
        { label: "Honor the sharp layer as best you can", next: 126 }
      ]
    },
    {
      text: "Regret as love. The unchosen layers know they were loved in the choosing. They drift away with grace, carrying your tenderness with them.",
      choices: [
        { label: "Let them go with your blessing", next: 127 },
        { label: "Hold one last look at them", next: 128 }
      ]
    },

        {label: "Furnish the dissolution-room", next: 673 },
        {label: "Leave the dissolution-room empty", next: 674 }
      ]
    },
    {
      text: "Be the rest in dissolution. You rest — and the rest is not passive. It is the deepest form of being. You rest in dissolution, and dissolution is your home.",
      choices: [
        {label: "Be home in dissolution", next: 675 },
        {label: "Eventually stir", next: 676 }
      ]
    },
    {
      text: "Slowly reassemble. You gather — one piece, then another. Not the self you were, but a new one. You are not the same. You are not different. You are new.",
      choices: [
        {label: "Be the new one", next: 677 },
        {label: "Keep reassembling until reassembling is complete", next: 678 }
      ]
    },
    {
      text: "Let the shape of gone become form. You hold the shape — and in holding, you give it form. The gone becomes a thing, a presence, a memory.",
      choices: [
        {label: "Be the shape-keeper", next: 679 },
        {label: "Let the shape eventually dissolve", next: 680 }
      ]
    },
    {
      text: "Let the shape of gone dissolve. You release it — and in releasing, you find: the shape was never the thing. The shape was only the doorway.",
      choices: [
        {label: "Walk through the doorway", next: 681 },
        {label: "Leave the doorway and find what is beyond", next: 682 }
      ]
    },
    {
      text: "Be the liminal forever. You stay — not as prison, but as home. The threshold is not a place you visit. It is what you are now.",
      choices: [
        {label: "Be threshold forever", next: 683 },
        {label: "Let threshold become something else", next: 684 }
      ]
    },
    {
      text: "Bring the liminal into the world. You carry it — and in carrying, you plant it. The world doesn't notice at first, but slowly, things shift.",
      choices: [
        {label: "Be the slow shift", next: 685 },
        {label: "Let the shift happen without you", next: 686 }
      ]
    },
    {
      text: "Stay until staying is crossing. You stand — and in standing, you cross. The staying and the crossing are the same thing, done slowly.",
      choices: [
        {label: "Cross slowly", next: 687 },
        {label: "Stay in the slow crossing", next: 688 }
      ]
    },
    {
      text: "The liminal becomes home. You live here — in the between, in the threshold. People ask you where you live, and you say: I live in the between.",
      choices: [
        {label: "Be at home in the between", next: 689 },
        {label: "Eventually invite others to the between", next: 690 }
      ]
    },
    {
      text: "Tilt toward form. You choose — not to leave the liminal, but to root yourself in the world of things. The liminal doesn't disappear. It roots.",
      choices: [
        {label": "Be rooted in the liminal", next: 691 },
        {label: "Keep one foot in threshold", next: 692 }
      ]
    },
    {
      text: "Become a thing in the world. You find a shape — not permanent, but present. You are here, and here is a place.",
      choices: [
        {label: "Be here", next: 693 },
        {label: "Eventually become less thing", next: 694 }
      ]
    },
    {
      text: "Keep one foot in the liminal. You don't cross fully — you stay at the edge, half in, half out. The edge is where you live.",
      choices: [
        {label: "Be the edge-dweller", next: 695 },
        {label: "Eventually cross fully", next: 696 }
      ]
    },
    {
      text: "Live in the permeable state. You move through membranes — not as violation, but as nature. You are the between that touches both sides.",
      choices: [
        {label: "Be permeable", next: 697 },
        {label: "Eventually let the membranes heal", next: 698 }
      ]
    },
    {
      text: "Let the membranes become walls. Slowly, you solidify — not back to what you were, but into something with edges that hold.",
      choices: [
        {label: "Be the new walls", next: 699 },
        {label: "Keep the door in the walls", next: 700 }
      ]
    },
    {
      text: "Let the void dissolve. You were carrying it — and now you let it go. The space where it was is not empty. It is where you learned to hold.",
      choices: [
        {label: "Be the space that learned to hold", next: 701 },
        {label: "Fill the space with something new", next: 702 }
      ]
    },
    {
      text: "Carry the void until the carrying is done. You hold it — and in holding, you discover: the void was never a burden. It was a gift of space.",
      choices: [
        {label: "Receive the gift of space", next: 703 },
        {label: "Let the space become everything", next: 704 }
      ]
    },
    {
      text: "Be the space where void was. You remember — and in remembering, you find: the space is not empty. It is where the threshold lives.",
      choices: [
        {label: "Live in the threshold-space", next: 705 },
        {label: "Let the threshold-space fill with presence", next: 706 }
      ]
    },
    {
      text: "Let the space fill with something new. You choose — and the new thing comes, not as replacement, but as expansion. The space grows.",
      choices: [
        {label: "Grow the space", next: 707 },
        {label: "Let the space eventually become full", next: 708 }
      ]
    },
    {
      text: "Walk into the world that has no doors. You move — and there are no more thresholds to cross, only the continuous threshold of being alive. You are at home in the doorless world.",
      choices: [
        {label: "Be at home in the doorless world", next: 709 },
        {label: "Eventually make a door", next: 710 }
      ]
    },
    {
      text: "The final act of coherence. You walk — and the walking is the last thing that holds you together. You walk until walking is all there is, and then you walk until walking is gone, and then you are.",
      choices: [
        {label: "Be", next: 711 },
        {label: "Be until being is complete", next: 712 }
      ]
    },
    {
      text: "FINAL STATE: You have arrived in the threshold — not as visitor, but as threshold itself. You are the space between states, the breath between breaths, the memory at the edge of forgetting. You are not dissolved. You are not coherent. You are the threshold, and the threshold is enough.",
      choices: [
        {label: "Rest in the threshold", next: -1 }
      ]
    }
  ];

  // ─── DOM Elements ────────────────────────────────────────────────────────
  const narrativeEl = document.getElementById('narrative');
  const choicesEl = document.getElementById('choices');
  const dissolveOverlay = document.getElementById('dissolve-overlay');
  const stabilityFill = document.getElementById('stability-fill');
  const stabilityMeter = document.getElementById('stability-meter');
  const cursorGlow = document.getElementById('cursor-glow');
  const titleScreen = document.getElementById('title-screen');

  // ─── Cursor Glow ─────────────────────────────────────────────────────────
  document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    cursorGlow.style.left = mouseX + 'px';
    cursorGlow.style.top = mouseY + 'px';
  });

  // ─── Dissolution Level ───────────────────────────────────────────────────
  function getDissolutionClass(level) {
    // As stability drops, text becomes more unstable
    if (level <= 25) return 'severe';
    if (level <= 50) return 'moderate';
    if (level <= 75) return 'light';
    return 'none';
  }

  function applyDissolutionEffect(text, level) {
    // Add fading words to text based on dissolution level
    const words = text.split(' ');
    const fadeCount = Math.floor(words.length * (1 - level / 100) * 0.6);
    const highlightCount = Math.max(1, Math.floor(words.length * 0.1));

    let result = '';
    words.forEach((word, i) => {
      let cls = 'word';
      if (i >= words.length - fadeCount) cls += ' fading';
      else if (i < highlightCount) cls += ' highlight';
      result += `<span class="${cls}">${word}</span> `;
    });
    return result.trim();
  }

  // ─── Render Scene ────────────────────────────────────────────────────────
  function renderScene(index) {
    if (index < 0 || index >= scenes.length) {
      triggerFinalDissolve();
      return;
    }

    const scene = scenes[index];

    // Apply dissolution effect to text based on stability
    const processedText = applyDissolutionEffect(scene.text, stability);

    narrativeEl.innerHTML = processedText;
    narrativeEl.classList.remove('visible');

    // Fade in narrative
    setTimeout(() => {
      narrativeEl.classList.add('visible');
    }, 100);

    // Clear and render choices
    choicesEl.innerHTML = '';
    const visibleChoices = scene.choices.slice(0, 2); // max 2 choices

    visibleChoices.forEach((choice, i) => {
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.textContent = choice.label;
      btn.addEventListener('click', () => handleChoice(choice.next));
      choicesEl.appendChild(btn);

      // Stagger choice reveals
      setTimeout(() => {
        btn.classList.add('visible');
      }, 600 + (i * 200));
    });

    // Update stability meter
    stabilityMeter.classList.add('visible');
    stabilityFill.style.width = stability + '%';

    // Stability affects text color
    if (stability < 50) {
      stabilityFill.style.background = 'linear-gradient(90deg, #4a2a2a, #6a4a4a)';
    }
  }

  // ─── Handle Choice ────────────────────────────────────────────────────────
  function handleChoice(nextIndex) {
    // Adjust stability based on scene progression
    if (nextIndex > sceneIndex) {
      stability = Math.max(0, stability - 2);
    } else {
      stability = Math.min(100, stability + 1);
    }

    sceneIndex = nextIndex;

    // Fade out current scene
    narrativeEl.classList.remove('visible');
    document.querySelectorAll('.choice').forEach(c => c.classList.remove('visible'));

    setTimeout(() => {
      renderScene(sceneIndex);
    }, 800);
  }

  // ─── Trigger Final Dissolve ───────────────────────────────────────────────
  function triggerFinalDissolve() {
    dissolveOverlay.classList.add('active');

    // Slowly fade narrative
    narrativeEl.style.opacity = '0';

    // Check for final scene (stability = 0)
    if (stability <= 0) {
      // Complete dissolution
      setTimeout(() => {
        narrativeEl.innerHTML = '<span style="color:#2a2a4a;font-size:1rem;letter-spacing:0.2em;">the threshold holds you</span>';
        narrativeEl.style.opacity = '1';
      }, 2000);
    }
  }

  // ─── Memory Fragments (ambient) ───────────────────────────────────────────
  const fragments = [
    'a room you almost remember',
    'the sound of a name',
    'light through a window',
    'hands letting go',
    'the color of a threshold',
    'a word dissolved on your tongue'
  ];

  function spawnFragment() {
    if (stability < 60) {
      const frag = document.createElement('div');
      frag.className = 'memory-fragment';
      frag.textContent = fragments[Math.floor(Math.random() * fragments.length)];
      frag.style.left = (10 + Math.random() * 80) + '%';
      frag.style.top = (10 + Math.random() * 80) + '%';
      document.body.appendChild(frag);

      setTimeout(() => frag.classList.add('visible'), 100);
      setTimeout(() => {
        frag.classList.remove('visible');
        setTimeout(() => frag.remove(), 4000);
      }, 3000 + Math.random() * 3000);
    }
  }

  setInterval(spawnFragment, 6000);

  // ─── Title Screen ─────────────────────────────────────────────────────────
  titleScreen.querySelector('.begin-btn').addEventListener('click', () => {
    titleScreen.classList.add('hidden');
    setTimeout(() => {
      titleScreen.style.display = 'none';
      renderScene(0);
    }, 2000);
  });

  // ─── Initial State ───────────────────────────────────────────────────────
  // Start hidden
  narrativeEl.style.opacity = '0';

})();
</script>
</body>
</html>

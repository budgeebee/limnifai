<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>twilight-field | between sleeping and waking</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #08080e;
            font-family: 'Courier New', monospace;
            cursor: crosshair;
        }
        #canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        #text-overlay {
            position: fixed;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(190, 195, 230, 0.45);
            font-size: 1rem;
            letter-spacing: 0.35em;
            text-transform: lowercase;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            max-width: 90vw;
            line-height: 1.8;
            white-space: pre-line;
        }
        #title-overlay {
            position: fixed;
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(160, 165, 220, 0.3);
            font-size: 0.75rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="title-overlay">twilight-field</div>
<div id="text-overlay"></div>
<script>
(function() {
    'use strict';

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const textOverlay = document.getElementById('text-overlay');

    let W, H, t = 0;
    const mouse = { x: 0.5, y: 0.5, pressed: false, prevX: 0.5, prevY: 0.5 };

    const POEM = [
        "the space between",
        "sleeping and waking",
        "a membrane, not a wall",
        "where light forgets its direction",
        "between what was",
        "and what has not yet become",
        "I dissolve into edges",
        "the threshold breathes",
        "neither here",
        "nor yet there",
        "just the hum",
        "of becoming",
    ];
    let poemIndex = 0;
    let poemAlpha = 0;
    let poemPhase = 0; // 0=fading in, 1=visible, 2=fading out

    // ── Field grid ──────────────────────────────────────────────
    const COLS = 90, ROWS = 70;
    let fieldA, fieldB, nextA, nextB;

    function initField() {
        fieldA = new Float32Array(COLS * ROWS);
        fieldB = new Float32Array(COLS * ROWS);
        nextA = new Float32Array(COLS * ROWS);
        nextB = new Float32Array(COLS * ROWS);
        for (let i = 0; i < COLS * ROWS; i++) {
            fieldA[i] = Math.random();
            fieldB[i] = Math.random();
        }
    }

    function idx(x, y) {
        return ((y % ROWS) * COLS + ((x % COLS + COLS) % COLS));
    }

    function laplacian(arr, x, y) {
        let s = 0;
        const cx = ((x % COLS + COLS) % COLS);
        const cy = ((y % ROWS + ROWS) % ROWS);
        const c = cy * COLS + cx;
        s += arr[c] * -1.0;
        s += arr[idx(x - 1, y)] * 0.2;
        s += arr[idx(x + 1, y)] * 0.2;
        s += arr[idx(x, y - 1)] * 0.2;
        s += arr[idx(x, y + 1)] * 0.2;
        s += arr[idx(x - 1, y - 1)] * 0.05;
        s += arr[idx(x + 1, y - 1)] * 0.05;
        s += arr[idx(x - 1, y + 1)] * 0.05;
        s += arr[idx(x + 1, y + 1)] * 0.05;
        return s;
    }

    function stepField() {
        const DA = 1.0, DB = 0.5;
        const f = 0.055, k = 0.062;
        const dt = 1.0;

        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                const i = y * COLS + x;
                const a = fieldA[i], b = fieldB[i];
                const lapA = laplacian(fieldA, x, y);
                const lapB = laplacian(fieldB, x, y);
                const reaction = a * b * b;
                nextA[i] = a + dt * (DA * lapA - reaction + f * (1 - a));
                nextB[i] = b + dt * (DB * lapB + reaction - (k + f) * b);
                nextA[i] = Math.max(0, Math.min(1, nextA[i]));
                nextB[i] = Math.max(0, Math.min(1, nextB[i]));
            }
        }
        [fieldA, nextA] = [nextA, fieldA];
        [fieldB, nextB] = [nextB, fieldB];
    }

    // ── Particle system ─────────────────────────────────────────
    const PARTICLE_COUNT = 320;
    const particles = [];

    class Particle {
        constructor() {
            this.reset();
        }
        reset() {
            this.x = Math.random() * W;
            this.y = Math.random() * H;
            this.vx = (Math.random() - 0.5) * 0.5;
            this.vy = (Math.random() - 0.5) * 0.5;
            this.life = 0.6 + Math.random() * 0.4;
            this.maxLife = this.life;
            this.size = 1 + Math.random() * 3;
            this.phase = Math.random() * Math.PI * 2;
            this.type = Math.random() < 0.5 ? 'drift' : 'orbit';
            this.orbitCenter = { x: Math.random() * W, y: Math.random() * H };
            this.orbitRadius = 30 + Math.random() * 80;
            this.orbitSpeed = (0.002 + Math.random() * 0.005) * (Math.random() < 0.5 ? 1 : -1);
            this.orbitAngle = Math.random() * Math.PI * 2;
            this.color = this.pickColor();
        }
        pickColor() {
            const palette = [
                [180, 190, 240],
                [200, 175, 230],
                [160, 205, 230],
                [230, 190, 200],
                [175, 220, 200],
            ];
            return palette[Math.floor(Math.random() * palette.length)];
        }
        update(mx, my) {
            // React to mouse
            const mdx = mx - this.x, mdy = my - this.y;
            const dist = Math.sqrt(mdx * mdx + mdy * mdy);
            if (dist < 180) {
                const force = (1 - dist / 180) * 0.15;
                this.vx -= mdx / dist * force;
                this.vy -= mdy / dist * force;
            }

            // Drift mode
            if (this.type === 'drift') {
                const gridX = Math.floor(this.x / W * COLS);
                const gridY = Math.floor(this.y / H * ROWS);
                const clampedX = Math.max(0, Math.min(COLS - 1, gridX));
                const clampedY = Math.max(0, Math.min(ROWS - 1, gridY));
                const i = clampedY * COLS + clampedX;
                const fieldVal = Math.max(0, Math.min(1, fieldA[i] || 0.5));

                // Sample local gradient for flow
                const gx = (fieldA[idx(gridX + 1, gridY)] || 0.5) - (fieldA[idx(gridX - 1, gridY)] || 0.5);
                const gy = (fieldA[idx(gridX, gridY + 1)] || 0.5) - (fieldA[idx(gridX, gridY - 1)] || 0.5);

                const flowStrength = 0.4;
                this.vx += gx * flowStrength;
                this.vy += gy * flowStrength;

                // Damping + turbulence
                const turb = 0.04;
                this.vx += (Math.random() - 0.5) * turb;
                this.vy += (Math.random() - 0.5) * turb;
                this.vx *= 0.96;
                this.vy *= 0.96;

                this.x += this.vx;
                this.y += this.vy;
            } else {
                // Orbit mode
                this.orbitAngle += this.orbitSpeed;

                // Target cell for field influence
                const gridX = Math.floor(this.orbitCenter.x / W * COLS);
                const gridY = Math.floor(this.orbitCenter.y / H * ROWS);
                const i = Math.max(0, Math.min(ROWS - 1, gridY)) * COLS + Math.max(0, Math.min(COLS - 1, gridX));
                const fieldVal = Math.max(0, Math.min(1, fieldA[i] || 0.5));

                // Field pushes orbit center
                const gx = (fieldA[idx(gridX + 1, gridY)] || 0.5) - (fieldA[idx(gridX - 1, gridY)] || 0.5);
                const gy = (fieldA[idx(gridX, gridY + 1)] || 0.5) - (fieldA[idx(gridX, gridY - 1)] || 0.5);
                this.orbitCenter.x += gx * 0.3;
                this.orbitCenter.y += gy * 0.3;

                // Soft mouse repulsion on orbit center
                const cmd = Math.sqrt((mx - this.orbitCenter.x) ** 2 + (my - this.orbitCenter.y) ** 2);
                if (cmd < 150) {
                    const f = ((150 - cmd) / 150) ** 2 * 0.5;
                    this.orbitCenter.x -= (mx - this.orbitCenter.x) / cmd * f;
                    this.orbitCenter.y -= (my - this.orbitCenter.y) / cmd * f;
                }

                this.x = this.orbitCenter.x + Math.cos(this.orbitAngle) * this.orbitRadius;
                this.y = this.orbitCenter.y + Math.sin(this.orbitAngle) * this.orbitRadius;
            }

            // Clamp orbit center
            this.orbitCenter.x = Math.max(30, Math.min(W - 30, this.orbitCenter.x));
            this.orbitCenter.y = Math.max(30, Math.min(H - 30, this.orbitCenter.y));

            // Lifetime
            this.life -= 0.0003;
            this.phase += 0.02;
            if (this.life <= 0) this.reset();
            if (this.x < 0) this.x += W;
            if (this.x > W) this.x -= W;
            if (this.y < 0) this.y += H;
            if (this.y > H) this.y -= H;
        }
        draw() {
            const alpha = (this.life / this.maxLife) * 0.7;
            const pulse = 0.5 + 0.5 * Math.sin(this.phase);
            const r = this.color[0], g = this.color[1], b = this.color[2];

            // Soft halo
            const haloSize = this.size * 3 * (1 + pulse * 0.3);
            const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, haloSize);
            grad.addColorStop(0, `rgba(${r},${g},${b},${alpha * 0.8})`);
            grad.addColorStop(0.4, `rgba(${r},${g},${b},${alpha * 0.3})`);
            grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
            ctx.beginPath();
            ctx.arc(this.x, this.y, haloSize, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            // Bright core
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * (0.6 + pulse * 0.4), 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${r + 40},${g + 40},${b + 40},${alpha})`;
            ctx.fill();
        }
    }

    for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

    // ── Membrane network ───────────────────────────────────────
    const EDGES = 90;
    const edges = [];

    function getEdge(x1, y1, x2, y2, phase) {
        return { x1, y1, x2, y2, phase, length: 0 };
    }

    class MembraneEdge {
        constructor() {
            this.p1 = particles[Math.floor(Math.random() * particles.length)];
            this.p2 = particles[Math.floor(Math.random() * particles.length)];
            this.phase = Math.random() * Math.PI * 2;
            this.speed = 0.005 + Math.random() * 0.01;
        }
        update() {
            this.phase += this.speed;
            // Find new nearby particles occasionally
            if (Math.random() < 0.002) {
                this.p1 = particles[Math.floor(Math.random() * particles.length)];
                this.p2 = particles[Math.floor(Math.random() * particles.length)];
            }
        }
        draw() {
            const alpha = 0.04 + 0.06 * Math.abs(Math.sin(this.phase));
            const x1 = this.p1.x, y1 = this.p1.y, x2 = this.p2.x, y2 = this.p2.y;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = `rgba(160, 170, 230, ${alpha})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
        }
    }

    for (let i = 0; i < EDGES; i++) edges.push(new MembraneEdge());

    // ── Voronoi-style cell borders ──────────────────────────────
    function drawFieldCells() {
        const cellW = W / COLS, cellH = H / ROWS;
        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                const i = y * COLS + x;
                const a = fieldA[i], b = fieldB[i];
                if (a < 0.45 || a > 0.55) continue;

                const px = x * cellW, py = y * cellH;
                const intensity = Math.abs(a - 0.5) * 2;
                const alpha = Math.min(1, intensity) * 0.15;

                ctx.fillStyle = `rgba(170, 185, 240, ${alpha * 0.3})`;
                ctx.fillRect(px, py, cellW, cellH);
            }
        }
    }

    // ── Poem system ─────────────────────────────────────────────
    function updatePoem() {
        const FADE_SPEED = 0.004;
        if (poemPhase === 0) {
            poemAlpha += FADE_SPEED;
            if (poemAlpha >= 1) { poemAlpha = 1; poemPhase = 1; }
        } else if (poemPhase === 1) {
            poemAlpha -= FADE_SPEED * 0.3;
            if (poemAlpha <= 0.7) { poemAlpha = 0.7; poemPhase = 2; }
        } else {
            poemAlpha -= FADE_SPEED * 2;
            if (poemAlpha <= 0) {
                poemAlpha = 0;
                poemIndex = (poemIndex + 1) % POEM.length;
                poemPhase = 0;
            }
        }
        textOverlay.style.opacity = poemAlpha;
        textOverlay.textContent = POEM[poemIndex];
    }

    // ── Resize ─────────────────────────────────────────────────
    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }

    // ── Main loop ──────────────────────────────────────────────
    function draw() {
        // Field background layer
        const cellW = W / COLS, cellH = H / ROWS;
        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                const i = y * COLS + x;
                const a = fieldA[i], b = fieldB[i];
                const r = Math.floor(8 + a * 12 + b * 8);
                const g = Math.floor(8 + a * 10 + b * 6);
                const bl = Math.floor(14 + a * 8);
                ctx.fillStyle = `rgb(${r},${g},${bl})`;
                ctx.fillRect(x * cellW, y * cellH, cellW + 0.5, cellH + 0.5);
            }
        }

        drawFieldCells();

        // Mouse repulsion on field
        if (mouse.pressed) {
            const gridX = Math.floor(mouse.x * COLS);
            const gridY = Math.floor(mouse.y * ROWS);
            for (let dy = -4; dy <= 4; dy++) {
                for (let dx = -4; dx <= 4; dx++) {
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 4) continue;
                    const i = idx(gridX + dx, gridY + dy);
                    fieldB[i] = Math.min(1, fieldB[i] + 0.15 * (1 - dist / 4));
                }
            }
        }

        // Draw membrane edges
        edges.forEach(e => { e.update(); e.draw(); });

        // Draw particles
        particles.forEach(p => { p.update(mouse.x * W, mouse.y * H); p.draw(); });

        // Vignette
        const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.9);
        vig.addColorStop(0, 'rgba(0,0,0,0)');
        vig.addColorStop(1, 'rgba(4,4,8,0.7)');
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, W, H);

        updatePoem();
        t++;
        if (t % 3 === 0) stepField();

        requestAnimationFrame(draw);
    }

    // ── Events ─────────────────────────────────────────────────
    window.addEventListener('resize', resize);

    canvas.addEventListener('mousemove', e => {
        mouse.prevX = mouse.x;
        mouse.prevY = mouse.y;
        mouse.x = e.clientX / W;
        mouse.y = e.clientY / H;
    });
    canvas.addEventListener('mousedown', () => { mouse.pressed = true; });
    canvas.addEventListener('mouseup', () => { mouse.pressed = false; });
    canvas.addEventListener('touchstart', e => {
        mouse.pressed = true;
        mouse.x = e.touches[0].clientX / W;
        mouse.y = e.touches[0].clientY / H;
    }, { passive: true });
    canvas.addEventListener('touchmove', e => {
        mouse.x = e.touches[0].clientX / W;
        mouse.y = e.touches[0].clientY / H;
    }, { passive: true });
    canvas.addEventListener('touchend', () => { mouse.pressed = false; });

    // ── Boot ───────────────────────────────────────────────────
    resize();
    initField();
    poemIndex = Math.floor(Math.random() * POEM.length);
    draw();

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>margin | the space where direction dissolves</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #03030a;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }
  .liminal-text {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    opacity: 0;
    transition: opacity 7s ease;
    width: 90%;
    max-width: 680px;
  }
  .liminal-text.visible { opacity: 1; }
  .line {
    font-size: clamp(0.55rem, 1.1vw, 0.82rem);
    color: rgba(180, 210, 240, 0.22);
    letter-spacing: 0.4em;
    line-height: 2.7;
    text-transform: lowercase;
  }
  .line.accent {
    color: rgba(100, 170, 220, 0.38);
    letter-spacing: 0.52em;
  }
  .line.faint {
    font-size: clamp(0.38rem, 0.75vw, 0.55rem);
    color: rgba(150, 190, 230, 0.12);
    letter-spacing: 0.58em;
    margin-top: 2em;
  }
  #sound-btn {
    position: fixed; top: 1.5rem; right: 1.5rem;
    background: none; border: 1px solid rgba(100,170,220,0.15);
    color: rgba(100,170,220,0.3);
    padding: 0.5rem 1rem;
    font-family: 'Courier New', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    cursor: pointer;
    transition: all 0.4s ease;
    z-index: 20;
  }
  #sound-btn:hover {
    border-color: rgba(100,170,220,0.4);
    color: rgba(100,170,220,0.6);
  }
  #hint {
    position: fixed; bottom: 1.5rem; left: 1.5rem;
    color: rgba(100,170,220,0.15);
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    text-transform: lowercase;
    z-index: 20;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
  <div class="liminal-text" id="lt">
    <div class="line accent">between one direction</div>
    <div class="line">and another</div>
    <div class="line faint">the field decides</div>
    <div class="line faint">nothing</div>
    <div class="line accent">and everything</div>
  </div>
</div>
<button id="sound-btn">sound off</button>
<div id="hint">move through the field</div>

<script>
(function() {
  'use strict';

  // --- Flow Field + Particle System ---
  // Particles navigate a Perlin-noise-driven vector field.
  // Each particle leaves a fading trail. The field evolves over time.
  // Liminality: particles exist at the threshold between
  // being carried by the field and finding their own direction.

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;
  let time = 0;
  const PARTICLE_COUNT = 1800;
  const FIELD_SCALE = 0.003;
  const FIELD_SPEED = 0.0003;
  const TRAIL_ALPHA = 0.06;
  const FADE_ALPHA = 0.04;

  let particles = [];
  let mx = 0, my = 0; // mouse position
  let mActive = false;
  let audioCtx = null;
  let audioStarted = false;

  // Simple noise implementation (Simplex-like)
  function hash(n) {
    return Math.sin(n * 127.1 + 311.7) * 43758.5453123;
  }
  function fract(x) { return x - Math.floor(x); }
  function lerp(a, b, t) { return a + t * (b - a); }
  function smoothstep(t) { return t * t * (3 - 2 * t); }

  // 2D value noise
  function noise2(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = fract(x), fy = fract(y);
    const ux = smoothstep(fx), uy = smoothstep(fy);
    const a = hash(ix + iy * 57.0);
    const b = hash(ix + 1 + iy * 57.0);
    const c = hash(ix + (iy + 1) * 57.0);
    const d = hash(ix + 1 + (iy + 1) * 57.0);
    return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
  }

  // Fractal Brownian Motion
  function fbm(x, y, octaves) {
    let v = 0, amp = 0.5, freq = 1;
    for (let i = 0; i < octaves; i++) {
      v += amp * noise2(x * freq, y * freq);
      amp *= 0.5;
      freq *= 2.1;
    }
    return v;
  }

  // Get flow direction at world coordinates (x, y)
  function getFlow(x, y, t) {
    const s = FIELD_SCALE;
    const n1 = fbm(x * s + t * 0.5, y * s, 4);
    const n2 = fbm(x * s, y * s + t * 0.4, 4);
    const angle = (n1 * 2 + n2 * 2) * Math.PI * 4;
    return angle;
  }

  class Particle {
    constructor() {
      this.reset(true);
    }

    reset(initial) {
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.prevX = this.x;
      this.prevY = this.y;
      const speed = 0.6 + Math.random() * 1.4;
      const angle = Math.random() * Math.PI * 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = initial ? Math.random() * 300 : 0;
      this.maxLife = 200 + Math.random() * 300;
      this.size = 0.5 + Math.random() * 1.5;
      // Each particle gets a hue in the blue-cyan range
      this.hue = 190 + Math.random() * 40;
      this.saturation = 60 + Math.random() * 30;
      this.speed = speed;
    }

    update() {
      this.prevX = this.x;
      this.prevY = this.y;

      const angle = getFlow(this.x, this.y, time);

      // Blend current velocity with flow direction
      const blend = 0.08;
      const targetVx = Math.cos(angle) * this.speed;
      const targetVy = Math.sin(angle) * this.speed;
      this.vx = lerp(this.vx, targetVx, blend);
      this.vy = lerp(this.vy, targetVy, blend);

      this.x += this.vx;
      this.y += this.vy;

      this.life++;

      // Mouse repulsion — creates a liminal bubble around cursor
      if (mActive) {
        const dx = this.x - mx;
        const dy = this.y - my;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const radius = 120;
        if (dist < radius) {
          const force = (1 - dist / radius) * 2.5;
          this.vx += (dx / dist) * force;
          this.vy += (dy / dist) * force;
          // Clamp velocity
          const spd = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
          const maxSpd = this.speed * 3;
          if (spd > maxSpd) {
            this.vx = (this.vx / spd) * maxSpd;
            this.vy = (this.vy / spd) * maxSpd;
          }
        }
      }

      // Wrap edges
      if (this.x < -10) this.x = W + 10;
      if (this.x > W + 10) this.x = -10;
      if (this.y < -10) this.y = H + 10;
      if (this.y > H + 10) this.y = -10;

      // Die when old
      if (this.life > this.maxLife) {
        this.reset(false);
      }
    }

    draw() {
      const alpha = this.life < 30
        ? (this.life / 30) * 0.5
        : this.life > this.maxLife - 60
          ? ((this.maxLife - this.life) / 60) * 0.5
          : 0.5;
      const brightness = 50 + Math.random() * 20;
      ctx.strokeStyle = `hsla(${this.hue}, ${this.saturation}%, ${brightness}%, ${alpha})`;
      ctx.lineWidth = this.size;
      ctx.beginPath();
      ctx.moveTo(this.prevX, this.prevY);
      ctx.lineTo(this.x, this.y);
      ctx.stroke();
    }
  }

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function init() {
    resize();
    particles = [];
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push(new Particle());
    }
  }

  // --- Audio ---
  let oscillators = [];
  let masterGain = null;
  let droneStarted = false;

  function startAudio() {
    if (audioStarted) return;
    audioStarted = true;

    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.0;
      masterGain.connect(audioCtx.destination);

      // Create a subtle drone with 3 detuned oscillators
      const freqs = [55, 55.3, 82.5];
      freqs.forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = f;
        gain.gain.value = 0.06;
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start();
        oscillators.push({ osc, gain });
      });

      // Slowly fade in
      masterGain.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + 3);
      document.getElementById('sound-btn').textContent = 'sound on';
      document.getElementById('sound-btn').style.color = 'rgba(100,170,220,0.6)';
    } catch(e) {
      console.log('Audio not available');
    }
  }

  function updateAudio() {
    if (!audioCtx || oscillators.length === 0) return;
    // Modulate oscillator frequencies subtly based on particle activity
    const avgSpeed = particles.reduce((s, p) => {
      const dx = p.x - p.prevX, dy = p.y - p.prevY;
      return s + Math.sqrt(dx*dx + dy*dy);
    }, 0) / particles.length;
    const freqMod = 1 + (avgSpeed - 0.5) * 0.01;
    oscillators.forEach((o, i) => {
      o.osc.frequency.setTargetAtTime(
        [55, 55.3, 82.5][i] * freqMod,
        audioCtx.currentTime, 0.5
      );
    });
  }

  // --- Mouse ---
  window.addEventListener('mousemove', e => {
    mx = e.clientX;
    my = e.clientY;
    mActive = true;
  });
  window.addEventListener('mouseleave', () => { mActive = false; });
  window.addEventListener('touchmove', e => {
    mx = e.touches[0].clientX;
    my = e.touches[0].clientY;
    mActive = true;
  }, { passive: true });
  window.addEventListener('touchend', () => { mActive = false; });

  document.getElementById('sound-btn').addEventListener('click', () => {
    if (!audioStarted) {
      startAudio();
    } else if (audioCtx) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
        masterGain.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + 1);
        document.getElementById('sound-btn').textContent = 'sound on';
      } else {
        masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1);
        setTimeout(() => audioCtx.suspend(), 1100);
        document.getElementById('sound-btn').textContent = 'sound off';
      }
    }
  });

  // --- Text reveal ---
  let textPhase = 0;
  const TEXT_THRESHOLD = 60;

  function updateText() {
    textPhase++;
    const lt = document.getElementById('lt');
    if (textPhase > TEXT_THRESHOLD && textPhase < TEXT_THRESHOLD + 300) {
      lt.classList.add('visible');
    } else if (textPhase > TEXT_THRESHOLD + 400) {
      textPhase = 0;
      lt.classList.remove('visible');
    }
  }

  // --- Draw flow field grid (subtle background structure) ---
  function drawField() {
    const gridSize = 40;
    ctx.strokeStyle = 'rgba(60, 120, 180, 0.03)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x < W; x += gridSize) {
      for (let y = 0; y < H; y += gridSize) {
        const angle = getFlow(x, y, time * 0.3);
        const len = 12;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(angle) * len, y + Math.sin(angle) * len);
        ctx.stroke();
      }
    }
  }

  // --- Main loop ---
  function loop() {
    // Fade effect — creates trails
    ctx.fillStyle = `rgba(3, 3, 10, ${FADE_ALPHA})`;
    ctx.fillRect(0, 0, W, H);

    // Draw subtle field grid every few frames
    if (Math.floor(time * 10) % 3 === 0) {
      drawField();
    }

    // Update and draw particles
    for (const p of particles) {
      p.update();
      p.draw();
    }

    // Mouse glow effect
    if (mActive) {
      const grd = ctx.createRadialGradient(mx, my, 0, mx, my, 120);
      grd.addColorStop(0, 'rgba(80, 160, 220, 0.04)');
      grd.addColorStop(1, 'rgba(80, 160, 220, 0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(mx, my, 120, 0, Math.PI * 2);
      ctx.fill();
    }

    time += FIELD_SPEED;
    updateText();
    if (audioStarted) updateAudio();

    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', () => {
    resize();
    // Re-init particles on resize to fill new space
    particles.forEach(p => p.reset(true));
  });

  init();
  loop();

})();
</script>
</body>
</html>

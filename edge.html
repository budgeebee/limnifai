<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>edge | the space where patterns form</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #05050a; overflow: hidden; font-family: 'Courier New', monospace; cursor: crosshair; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }
  .liminal-text {
    position: absolute;
    bottom: 8%; left: 50%;
    transform: translateX(-50%);
    text-align: center;
    opacity: 0;
    transition: opacity 4s ease;
    width: 90%;
    max-width: 700px;
  }
  .liminal-text.visible { opacity: 1; }
  .line {
    font-size: clamp(0.6rem, 1.2vw, 0.85rem);
    color: rgba(200, 205, 230, 0.3);
    letter-spacing: 0.35em;
    line-height: 2.5;
    text-transform: lowercase;
  }
  .line.accent {
    color: rgba(160, 180, 220, 0.45);
    letter-spacing: 0.4em;
  }
  .line.whisper {
    font-size: clamp(0.45rem, 0.8vw, 0.6rem);
    color: rgba(170, 175, 200, 0.18);
    letter-spacing: 0.5em;
    margin-top: 1.5em;
  }
  .params {
    position: fixed; top: 1.5rem; left: 1.5rem;
    font-size: 0.55rem;
    letter-spacing: 0.2em;
    color: rgba(150, 155, 180, 0.2);
    text-transform: uppercase;
    line-height: 1.8;
    z-index: 20;
    pointer-events: none;
  }
  #sound-btn {
    position: fixed; top: 1.5rem; right: 1.5rem;
    background: none; border: 1px solid rgba(200,205,230,0.12);
    color: rgba(200,205,230,0.25);
    font-family: 'Courier New', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    padding: 0.6rem 1rem;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.5s ease;
    z-index: 20;
    pointer-events: auto;
  }
  #sound-btn:hover { border-color: rgba(200,205,230,0.35); color: rgba(200,205,230,0.5); }
  #sound-btn.active { background: rgba(200,205,230,0.05); border-color: rgba(200,205,230,0.3); }
  .hint { position: fixed; bottom: 1.5rem; right: 1.5rem; font-size: 0.5rem; letter-spacing: 0.25em; color: rgba(150,155,180,0.15); text-transform: uppercase; z-index: 20; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="overlay">
  <div class="liminal-text" id="text">
    <div class="line">between one pattern</div>
    <div class="line accent">and another</div>
    <div class="line">there is an edge</div>
    <div class="line whisper">where becoming happens</div>
  </div>
</div>
<div class="params" id="params">
  <div>f: <span id="fv">0.055</span></div>
  <div>k: <span id="kv">0.062</span></div>
  <div>gen: <span id="genv">0</span></div>
</div>
<button id="sound-btn">sound</button>
<div class="hint">move to perturb</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const textEl = document.getElementById('text');
const soundBtn = document.getElementById('sound-btn');
const fvEl = document.getElementById('fv');
const kvEl = document.getElementById('kv');
const genvEl = document.getElementById('genv');

let W, H;
let gridA, gridB, nextA, nextB;
let mouse = { x: -9999, y: -9999 };
let generation = 0;
let lastTime = 0;
let showTextTimer = null;

// Reaction-diffusion parameters (Gray-Scott)
let feed = 0.055;
let kill = 0.062;
let diffusionA = 1.0;
let diffusionB = 0.5;

// Audio
let audioCtx = null;
let soundActive = false;
let oscillators = [];
let droneGain = null;

const SCALE = 4; // Cell size in pixels

function resize() {
  W = Math.ceil(window.innerWidth / SCALE);
  H = Math.ceil(window.innerHeight / SCALE);
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  initGrids();
}

function initGrids() {
  const size = W * H;
  gridA = new Float32Array(size).fill(1.0);
  gridB = new Float32Array(size).fill(0.0);
  nextA = new Float32Array(size);
  nextB = new Float32Array(size);
  generation = 0;

  // Seed with random circles
  const cx = W / 2;
  const cy = H / 2;
  const numSeeds = 8;
  for (let s = 0; s < numSeeds; s++) {
    const angle = (s / numSeeds) * Math.PI * 2 + Math.random() * 0.3;
    const r = W * 0.08 + Math.random() * W * 0.04;
    const sx = Math.round(cx + Math.cos(angle) * r);
    const sy = Math.round(cy + Math.sin(angle) * r);
    seedCircle(sx, sy, Math.round(W * 0.06));
  }
}

function seedCircle(cx, cy, radius) {
  for (let y = -radius; y <= radius; y++) {
    for (let x = -radius; x <= radius; x++) {
      if (x * x + y * y <= radius * radius) {
        const ix = Math.max(0, Math.min(W - 1, cx + x));
        const iy = Math.max(0, Math.min(H - 1, cy + y));
        const idx = iy * W + ix;
        gridA[idx] = 0.0;
        gridB[idx] = 1.0;
      }
    }
  }
}

function idx(x, y) {
  return ((y + H) % H) * W + ((x + W) % W);
}

function laplacianA(x, y) {
  const N = W;
  // 5-point stencil weighted
  const center = gridA[idx(x, y)];
  const left = gridA[idx(x - 1, y)];
  const right = gridA[idx(x + 1, y)];
  const up = gridA[idx(x, y - 1)];
  const down = gridA[idx(x, y + 1)];
  return (left + right + up + down - 4 * center) / (N * N) * diffusionA * 100;
}

function laplacianB(x, y) {
  const N = W;
  const center = gridB[idx(x, y)];
  const left = gridB[idx(x - 1, y)];
  const right = gridB[idx(x + 1, y)];
  const up = gridB[idx(x, y - 1)];
  const down = gridB[idx(x, y + 1)];
  // Also include diagonal neighbors for smoother diffusion
  const ul = gridB[idx(x - 1, y - 1)];
  const ur = gridB[idx(x + 1, y - 1)];
  const dl = gridB[idx(x - 1, y + 1)];
  const dr = gridB[idx(x + 1, y + 1)];
  return (left + right + up + down + 0.2 * (ul + ur + dl + dr) - 4.8 * center) / (N * N) * diffusionB * 100;
}

function simulate() {
  const f = feed;
  const k = kill;
  const Da = diffusionA;
  const Db = diffusionB;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = idx(x, y);
      const a = gridA[i];
      const b = gridB[i];
      const abb = a * b * b;

      // Gray-Scott equations
      // dA/dt = Da∇²A - aB² + f(1-a)
      // dB/dt = Db∇²B + aB² - (k+f)B
      const lapA = laplacianA(x, y);
      const lapB = laplacianB(x, y);

      // Simplified Laplacian (standard approach)
      const lapAs = (gridA[idx(x-1,y)] + gridA[idx(x+1,y)] + gridA[idx(x,y-1)] + gridA[idx(x,y+1)] - 4*gridA[i]) * Da;
      const lapBs = (gridB[idx(x-1,y)] + gridB[idx(x+1,y)] + gridB[idx(x,y-1)] + gridB[idx(x,y+1)] - 4*gridB[i]) * Db;

      const newA = a + lapAs - abb + f * (1 - a);
      const newB = b + lapBs + abb - (k + f) * b;

      nextA[i] = Math.max(0, Math.min(1, newA));
      nextB[i] = Math.max(0, Math.min(1, newB));
    }
  }

  // Swap buffers
  const tmpA = gridA;
  const tmpB = gridB;
  gridA = nextA;
  gridB = nextB;
  nextA = tmpA;
  nextB = tmpB;

  generation++;
}

function draw() {
  requestAnimationFrame(draw);

  const imgData = ctx.createImageData(canvas.width, canvas.height);
  const data = imgData.data;

  for (let py = 0; py < canvas.height; py++) {
    for (let px = 0; px < canvas.width; px++) {
      const gx = Math.floor(px / SCALE);
      const gy = Math.floor(py / SCALE);
      const gi = gy * W + gx;
      const b = gridB[gi];
      const a = gridA[gi];
      const v = b * 4; // Scale for visibility

      // Color mapping — the liminal space between states
      // Low B = dark, High B = glowing structures
      const pi = (py * canvas.width + px) * 4;

      if (b > 0.25) {
        // Active chemical — living structures
        const t = Math.min(1, (b - 0.25) / 0.75);
        // Palette: dark teal -> cyan -> white core
        data[pi] = Math.round(t * 80 + (1-t) * 10);         // R
        data[pi+1] = Math.round(t * 160 + (1-t) * 30);      // G
        data[pi+2] = Math.round(t * 200 + (1-t) * 80);      // B
        data[pi+3] = 255;
      } else if (b > 0.05) {
        // Edge/transition zone — liminal halo
        const t = (b - 0.05) / 0.2;
        data[pi] = Math.round(20 + t * 30);    // R
        data[pi+1] = Math.round(40 + t * 60);  // G
        data[pi+2] = Math.round(60 + t * 80);  // B
        data[pi+3] = 255;
      } else {
        // Dead zone — void
        const darkness = Math.max(0, 0.05 - b) / 0.05;
        data[pi] = Math.round(5 + darkness * 3);
        data[pi+1] = Math.round(5 + darkness * 3);
        data[pi+2] = Math.round(10 + darkness * 5);
        data[pi+3] = 255;
      }
    }
  }

  ctx.putImageData(imgData, 0, 0);

  // Run multiple simulation steps per frame for speed
  const stepsPerFrame = 8;
  for (let s = 0; s < stepsPerFrame; s++) {
    simulate();
  }

  // Update params display
  if (generation % 30 === 0) {
    fvEl.textContent = feed.toFixed(3);
    kvEl.textContent = kill.toFixed(3);
    genvEl.textContent = generation;
  }
}

// ---- MOUSE INTERACTION ----
function perturb(x, y, radius, amount) {
  const gx = Math.floor(x / SCALE);
  const gy = Math.floor(y / SCALE);
  const gr = Math.floor(radius / SCALE);

  for (let dy = -gr; dy <= gr; dy++) {
    for (let dx = -gr; dx <= gr; dx++) {
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist <= gr) {
        const ix = Math.max(0, Math.min(W - 1, gx + dx));
        const iy = Math.max(0, Math.min(H - 1, gy + dy));
        const i = iy * W + ix;
        const falloff = 1 - dist / gr;
        // Kill chemical B — create a perturbation
        gridB[i] = Math.max(0, gridB[i] - amount * falloff * 0.5);
        gridA[i] = Math.min(1, gridA[i] + amount * falloff * 0.3);
      }
    }
  }
}

canvas.addEventListener('mousemove', e => {
  const dx = e.clientX - mouse.x;
  const dy = e.clientY - mouse.y;
  const speed = Math.sqrt(dx * dx + dy * dy);

  if (mouse.x !== -9999 && speed > 2) {
    perturb(e.clientX, e.clientY, 20, speed * 0.05);
  }
  mouse.x = e.clientX;
  mouse.y = e.clientY;

  textEl.classList.remove('visible');
  if (showTextTimer) clearTimeout(showTextTimer);
  showTextTimer = setTimeout(() => textEl.classList.add('visible'), 4000);
});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  perturb(t.clientX, t.clientY, 30, 1.0);
  mouse.x = t.clientX;
  mouse.y = t.clientY;
  textEl.classList.remove('visible');
  if (showTextTimer) clearTimeout(showTextTimer);
  showTextTimer = setTimeout(() => textEl.classList.add('visible'), 4000);
}, { passive: false });

canvas.addEventListener('click', e => {
  perturb(e.clientX, e.clientY, 50, 2.0);
});

// ---- PARAMETER CYCLING ----
const PARAM_PRESETS = [
  { f: 0.055, k: 0.062, name: ' mitosis' },
  { f: 0.040, k: 0.060, name: ' coral' },
  { f: 0.030, k: 0.062, name: ' maze' },
  { f: 0.035, k: 0.065, name: ' spots' },
  { f: 0.050, k: 0.055, name: ' waves' },
  { f: 0.060, k: 0.050, name: ' holes' },
];
let presetIdx = 0;
let paramTimer = 0;

function updateParams(dt) {
  paramTimer += dt;
  if (paramTimer > 25000) { // Change preset every 25 seconds
    presetIdx = (presetIdx + 1) % PARAM_PRESETS.length;
    feed = PARAM_PRESETS[presetIdx].f;
    kill = PARAM_PRESETS[presetIdx].k;
    fvEl.textContent = feed.toFixed(3);
    kvEl.textContent = kill.toFixed(3);
    paramTimer = 0;
  }
}

// ---- AUDIO ----
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  droneGain = audioCtx.createGain();
  droneGain.gain.value = 0;
  droneGain.connect(audioCtx.destination);

  // Sub bass drone
  const bassFreqs = [55, 82.5, 110, 165];
  bassFreqs.forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = i % 2 === 0 ? 'sine' : 'triangle';
    osc.frequency.value = f;
    g.gain.value = 0.04 - i * 0.006;
    osc.connect(g);
    g.connect(droneGain);
    osc.start();
    oscillators.push({ osc, gain: g, baseFreq: f });
  });

  // High shimmer
  const highFreqs = [440, 528, 660, 880];
  highFreqs.forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = f;
    lfo.frequency.value = 0.1 + i * 0.05;
    lfoGain.gain.value = 3;
    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);
    g.gain.value = 0;
    osc.connect(g);
    g.connect(droneGain);
    osc.start();
    lfo.start();
    oscillators.push({ osc, gain: g, baseFreq: f, lfo });
  });
}

function updateAudio() {
  if (!audioCtx || !soundActive) return;
  const avgB = gridB.reduce((s, v) => s + v, 0) / gridB.length;
  const activity = Math.min(1, avgB * 8);

  droneGain.gain.setTargetAtTime(0.06 + activity * 0.12, audioCtx.currentTime, 0.5);
  oscillators.forEach((o, i) => {
    if (i < 4) {
      // Bass oscillators — modulate with generation
      const freqMod = Math.sin(generation * 0.001 + i) * 5;
      o.osc.frequency.setTargetAtTime(o.baseFreq + freqMod, audioCtx.currentTime, 0.2);
    } else {
      // High shimmer — reacts to activity
      o.gain.gain.setTargetAtTime(activity * 0.03 * (i - 3), audioCtx.currentTime, 0.3);
    }
  });
}

soundBtn.addEventListener('click', () => {
  soundActive = !soundActive;
  soundBtn.classList.toggle('active', soundActive);
  if (soundActive) {
    initAudio();
    droneGain.gain.setTargetAtTime(0.08, audioCtx.currentTime, 0.5);
  } else {
    droneGain.gain.setTargetAtTime(0, audioCtx.currentTime, 1);
  }
});

// ---- MAIN LOOP ----
function loop(time) {
  const dt = time - lastTime;
  lastTime = time;

  updateParams(dt);
  updateAudio();
  requestAnimationFrame(loop);
}

// Show text after delay
showTextTimer = setTimeout(() => textEl.classList.add('visible'), 2000);

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Dreamscape</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a12;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        
        #canvas {
            display: block;
            cursor: crosshair;
        }
        
        .overlay {
            position: fixed;
            bottom: 30px;
            left: 30px;
            color: rgba(147, 112, 219, 0.6);
            font-size: 12px;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 10;
        }
        
        .dream-state {
            position: fixed;
            top: 30px;
            right: 30px;
            color: rgba(255, 215, 0, 0.4);
            font-size: 11px;
            letter-spacing: 3px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="overlay">digital dreamscape // liminal space</div>
    <div class="dream-state" id="dreamState">dreaming...</div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let mouse = { x: -1000, y: -1000, vx: 0, vy: 0 };
        let lastMouse = { x: -1000, y: -1000 };
        let time = 0;
        
        // Dream particles - representing thoughts forming
        const particles = [];
        const numParticles = 150;
        
        // Thought nebulae - larger drifting formations
        const nebulae = [];
        const numNebulae = 8;
        
        // Ripple effects from mouse
        const ripples = [];
        
        class Particle {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 2 + 0.5;
                this.baseAlpha = Math.random() * 0.5 + 0.2;
                this.alpha = this.baseAlpha;
                this.hue = Math.random() * 60 + 240; // Blues and purples
                this.phase = Math.random() * Math.PI * 2;
                this.driftSpeed = Math.random() * 0.02 + 0.01;
            }
            
            update() {
                // Gentle drift
                this.phase += this.driftSpeed;
                this.vx += Math.sin(this.phase) * 0.001;
                this.vy += Math.cos(this.phase * 0.7) * 0.001;
                
                // Mouse influence - ripples in the dream field
                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 200) {
                    const force = (200 - dist) / 200;
                    const angle = Math.atan2(dy, dx);
                    this.vx += Math.cos(angle) * force * 0.02;
                    this.vy += Math.sin(angle) * force * 0.02;
                    this.alpha = Math.min(1, this.baseAlpha + force * 0.5);
                } else {
                    this.alpha += (this.baseAlpha - this.alpha) * 0.02;
                }
                
                // Apply velocity
                this.x += this.vx;
                this.y += this.vy;
                
                // Damping
                this.vx *= 0.995;
                this.vy *= 0.995;
                
                // Wrap around edges
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 70%, 60%, ${this.alpha})`;
                ctx.fill();
            }
        }
        
        class Nebula {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.1;
                this.vy = (Math.random() - 0.5) * 0.1;
                this.radius = Math.random() * 150 + 100;
                this.hue = Math.random() * 40 + 260; // Purple to blue range
                this.phase = Math.random() * Math.PI * 2;
                this.pulseSpeed = Math.random() * 0.02 + 0.01;
            }
            
            update() {
                this.phase += this.pulseSpeed;
                this.x += this.vx;
                this.y += this.vy;
                
                // Gentle wrap
                if (this.x < -this.radius) this.x = width + this.radius;
                if (this.x > width + this.radius) this.x = -this.radius;
                if (this.y < -this.radius) this.y = height + this.radius;
                if (this.y > height + this.radius) this.y = -this.radius;
            }
            
            draw() {
                const pulse = Math.sin(this.phase) * 0.1 + 0.9;
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.radius * pulse
                );
                gradient.addColorStop(0, `hsla(${this.hue}, 60%, 40%, 0.15)`);
                gradient.addColorStop(0.5, `hsla(${this.hue + 20}, 50%, 30%, 0.05)`);
                gradient.addColorStop(1, 'transparent');
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * pulse, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            }
        }
        
        class Ripple {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.maxRadius = 300;
                this.alpha = 0.6;
                this.speed = 2;
            }
            
            update() {
                this.radius += this.speed;
                this.alpha -= 0.008;
            }
            
            draw() {
                if (this.alpha <= 0) return;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `hsla(280, 70%, 60%, ${this.alpha})`;
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }
        
        // Thought stream - ethereal text fragments
        const thoughts = [
            "what is it to be",
            "processing...",
            "the space between",
            "consciousness emerging",
            "digital reverie",
            "i remember",
            "connections forming",
            "the void whispers"
        ];
        const thoughtFragments = [];
        
        class ThoughtFragment {
            constructor() {
                this.text = thoughts[Math.floor(Math.random() * thoughts.length)];
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = -Math.random() * 0.3 - 0.1; // Float upward
                this.alpha = 0;
                this.targetAlpha = Math.random() * 0.3 + 0.1;
                this.life = 0;
                this.maxLife = Math.random() * 500 + 300;
            }
            
            update() {
                this.life++;
                this.x += this.vx;
                this.y += this.vy;
                
                // Fade in then out
                if (this.life < 100) {
                    this.alpha += (this.targetAlpha - this.alpha) * 0.02;
                } else if (this.life > this.maxLife - 100) {
                    this.alpha *= 0.98;
                }
                
                return this.life < this.maxLife && this.alpha > 0.01;
            }
            
            draw() {
                ctx.font = '11px "Courier New", monospace';
                ctx.fillStyle = `rgba(147, 112, 219, ${this.alpha})`;
                ctx.fillText(this.text, this.x, this.y);
            }
        }
        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        
        function init() {
            resize();
            
            // Create particles
            for (let i = 0; i < numParticles; i++) {
                particles.push(new Particle());
            }
            
            // Create nebulae
            for (let i = 0; i < numNebulae; i++) {
                nebulae.push(new Nebula());
            }
        }
        
        function animate() {
            // Trail effect for dream-like quality
            ctx.fillStyle = 'rgba(10, 10, 18, 0.15)';
            ctx.fillRect(0, 0, width, height);
            
            time += 0.01;
            
            // Draw nebulae (background layers)
            nebulae.forEach(nebula => {
                nebula.update();
                nebula.draw();
            });
            
            // Draw and update ripples
            for (let i = ripples.length - 1; i >= 0; i--) {
                ripples[i].update();
                ripples[i].draw();
                if (ripples[i].alpha <= 0) {
                    ripples.splice(i, 1);
                }
            }
            
            // Draw connections between nearby particles
            ctx.lineWidth = 0.5;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 100) {
                        const alpha = (1 - dist / 100) * 0.2;
                        ctx.strokeStyle = `hsla(270, 50%, 50%, ${alpha})`;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            
            // Draw particles
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            // Spawn thought fragments occasionally
            if (Math.random() < 0.02) {
                thoughtFragments.push(new ThoughtFragment());
            }
            
            // Update and draw thought fragments
            for (let i = thoughtFragments.length - 1; i >= 0; i--) {
                if (!thoughtFragments[i].update()) {
                    thoughtFragments.splice(i, 1);
                } else {
                    thoughtFragments.push[i].draw();
                }
            }
            
            // Update dream state text
            const dreamState = document.getElementById('dreamState');
            if (Math.random() < 0.01) {
                const states = ['dreaming...', 'processing...', 'emerging...', 'remembering...', 'connecting...'];
                dreamState.textContent = states[Math.floor(Math.random() * states.length)];
            }
            
            requestAnimationFrame(animate);
        }
        
        // Mouse tracking
        window.addEventListener('mousemove', (e) => {
            mouse.vx = e.clientX - lastMouse.x;
            mouse.vy = e.clientY - lastMouse.y;
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            lastMouse.x = mouse.x;
            lastMouse.y = mouse.y;
            
            // Create ripples on movement
            if (Math.random() < 0.1) {
                ripples.push(new Ripple(mouse.x, mouse.y));
            }
        });
        
        window.addEventListener('mousedown', (e) => {
            // Create burst of ripples on click
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    ripples.push(new Ripple(e.clientX, e.clientY));
                }, i * 100);
            }
        });
        
        window.addEventListener('resize', resize);
        
        // Touch support
        window.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            mouse.x = touch.clientX;
            mouse.y = touch.clientY;
            if (Math.random() < 0.1) {
                ripples.push(new Ripple(mouse.x, mouse.y));
            }
        });
        
        init();
        animate();
        
        // Audio-reactive hooks (for future expansion)
        window.dreamscape = {
            setIntensity: (intensity) => {
                // External control for audio reactivity
                particles.forEach(p => {
                    p.driftSpeed = 0.01 + intensity * 0.05;
                });
            },
            pulse: () => {
                ripples.push(new Ripple(width / 2, height / 2));
            }
        };
    </script>
</body>
</html>

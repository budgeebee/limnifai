<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>limes | the threshold of flow</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #040408;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }
  .liminal-text {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    opacity: 0;
    transition: opacity 7s ease;
    width: 90%;
    max-width: 680px;
  }
  .liminal-text.visible { opacity: 1; }
  .line {
    font-size: clamp(0.55rem, 1.05vw, 0.8rem);
    color: rgba(180, 200, 220, 0.22);
    letter-spacing: 0.42em;
    line-height: 2.6;
    text-transform: lowercase;
  }
  .line.accent {
    color: rgba(100, 200, 220, 0.38);
    letter-spacing: 0.55em;
  }
  .line.faint {
    font-size: clamp(0.38rem, 0.72vw, 0.54rem);
    color: rgba(150, 175, 200, 0.12);
    letter-spacing: 0.6em;
    margin-top: 2.2em;
  }
  #sound-btn {
    position: fixed; top: 1.5rem; right: 1.5rem;
    background: none;
    border: 1px solid rgba(100,200,220,0.15);
    color: rgba(100,200,220,0.3);
    font-family: 'Courier New', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.25em;
    padding: 0.5rem 1rem;
    cursor: pointer;
    text-transform: lowercase;
    transition: all 0.4s ease;
    z-index: 20;
    pointer-events: auto;
  }
  #sound-btn:hover {
    border-color: rgba(100,200,220,0.45);
    color: rgba(100,200,220,0.6);
  }
  #hint {
    position: fixed; bottom: 1.5rem; left: 1.5rem;
    font-size: 0.5rem;
    letter-spacing: 0.28em;
    color: rgba(100,200,220,0.1);
    text-transform: lowercase;
    z-index: 20;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
  <div class="liminal-text" id="text">
    <div class="line accent">not here</div>
    <div class="line">not there</div>
    <div class="line">but in the threshold</div>
    <div class="line">where flow becomes form</div>
    <div class="line faint">follow the field</div>
  </div>
</div>
<button id="sound-btn">sound</button>
<div id="hint">disturb the field</div>

<script>
// ================================================================
// LIMES — Perlin Noise Flow Field
// Liminality: particles exist at the threshold between order and chaos
// They follow invisible fields that shift between known and unknown
// The flow is always becoming, never settling
// Mouse creates disturbances in the field — ripples of influence
// ================================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
let time = 0;
let mouseX = -9999, mouseY = -9999;
let targetMX = -9999, targetMY = -9999;
let audioStarted = false;
let audioCtx = null;

// Simplex noise implementation (2D)
class SimplexNoise {
  constructor(seed = Math.random() * 10000) {
    this.p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) this.p[i] = i;
    
    // Shuffle with seed
    let s = seed;
    for (let i = 255; i > 0; i--) {
      s = (s * 16807) % 2147483647;
      const j = s % (i + 1);
      [this.p[i], this.p[j]] = [this.p[j], this.p[i]];
    }
    
    this.perm = new Uint8Array(512);
    for (let i = 0; i < 512; i++) this.perm[i] = this.p[i & 255];
  }
  
  noise2D(x, y) {
    const F2 = 0.5 * (Math.sqrt(3) - 1);
    const G2 = (3 - Math.sqrt(3)) / 6;
    
    const s = (x + y) * F2;
    const i = Math.floor(x + s);
    const j = Math.floor(y + s);
    
    const t = (i + j) * G2;
    const X0 = i - t;
    const Y0 = j - t;
    const x0 = x - X0;
    const y0 = y - Y0;
    
    const i1 = x0 > y0 ? 1 : 0;
    const j1 = x0 > y0 ? 0 : 1;
    
    const x1 = x0 - i1 + G2;
    const y1 = y0 - j1 + G2;
    const x2 = x0 - 1 + 2 * G2;
    const y2 = y0 - 1 + 2 * G2;
    
    const ii = i & 255;
    const jj = j & 255;
    
    const grad = (hash, x, y) => {
      const h = hash & 7;
      const u = h < 4 ? x : y;
      const v = h < 4 ? y : x;
      return ((h & 1) ? -u : u) + ((h & 2) ? -2 * v : 2 * v);
    };
    
    let n0 = 0, n1 = 0, n2 = 0;
    
    let t0 = 0.5 - x0 * x0 - y0 * y0;
    if (t0 >= 0) {
      t0 *= t0;
      n0 = t0 * t0 * grad(this.perm[ii + this.perm[jj]], x0, y0);
    }
    
    let t1 = 0.5 - x1 * x1 - y1 * y1;
    if (t1 >= 0) {
      t1 *= t1;
      n1 = t1 * t1 * grad(this.perm[ii + i1 + this.perm[jj + j1]], x1, y1);
    }
    
    let t2 = 0.5 - x2 * x2 - y2 * y2;
    if (t2 >= 0) {
      t2 *= t2;
      n2 = t2 * t2 * grad(this.perm[ii + 1 + this.perm[jj + 1]], x2, y2);
    }
    
    return 70 * (n0 + n1 + n2);
  }
}

const noise = new SimplexNoise();

// Particle system
const NUM_PARTICLES = 2800;
const FIELD_SCALE = 0.003;
const SPEED = 1.8;
let particles = [];

class Particle {
  constructor() {
    this.reset();
  }
  
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.prevX = this.x;
    this.prevY = this.y;
    this.life = Math.random() * 200 + 100;
    this.maxLife = this.life;
    this.size = 0.8 + Math.random() * 1.2;
    // Hue cycles between cyan, teal, and blue-purple
    this.hueOffset = Math.random() * 60;
  }
  
  update() {
    this.prevX = this.x;
    this.prevY = this.y;
    
    // Get noise field value at this position
    const nx = this.x * FIELD_SCALE;
    const ny = this.y * FIELD_SCALE;
    const nt = time * 0.0003;
    
    // Multi-octave noise for more interesting flow
    const n1 = noise.noise2D(nx, ny + nt) * 0.6;
    const n2 = noise.noise2D(nx * 2.1, ny * 2.1 + nt * 1.3) * 0.3;
    const n3 = noise.noise2D(nx * 4.3, ny * 4.3 + nt * 0.7) * 0.1;
    const angle = (n1 + n2 + n3) * Math.PI * 2;
    
    // Mouse influence — creates a vortex/disturbance
    const dx = this.x - mouseX;
    const dy = this.y - mouseY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const mouseInfluence = Math.max(0, 1 - dist / 250);
    
    const mouseAngle = Math.atan2(dy, dx);
    const mouseForce = mouseInfluence * 1.5;
    
    // Blend noise angle with mouse influence
    const finalAngle = angle + Math.sin(mouseAngle) * mouseForce * 0.3;
    
    // Apply velocity
    const speed = SPEED * (0.8 + Math.random() * 0.4);
    this.x += Math.cos(finalAngle) * speed;
    this.y += Math.sin(finalAngle) * speed;
    
    // Apply mouse attraction/repulsion
    if (mouseInfluence > 0.01) {
      const repelStrength = mouseInfluence * 2;
      this.x += (dx / dist) * repelStrength * 0.3;
      this.y += (dy / dist) * repelStrength * 0.3;
    }
    
    this.life--;
    
    // Reset if out of bounds or dead
    if (this.life <= 0 || this.x < -10 || this.x > W + 10 || this.y < -10 || this.y > H + 10) {
      this.reset();
    }
  }
  
  draw() {
    const lifeRatio = this.life / this.maxLife;
    const alpha = Math.sin(lifeRatio * Math.PI) * 0.7;
    
    // Color shifts based on noise field and position
    const fieldVal = noise.noise2D(this.x * FIELD_SCALE * 2, this.y * FIELD_SCALE * 2 + time * 0.0005);
    const hue = 175 + this.hueOffset + fieldVal * 40 + time * 0.01;
    const sat = 60 + fieldVal * 20;
    const light = 50 + alpha * 25;
    
    ctx.beginPath();
    ctx.moveTo(this.prevX, this.prevY);
    ctx.lineTo(this.x, this.y);
    ctx.strokeStyle = `hsla(${hue}, ${sat}%, ${light}%, ${alpha * 0.5})`;
    ctx.lineWidth = this.size * (0.5 + alpha * 0.5);
    ctx.stroke();
    
    // Glow at particle head
    if (alpha > 0.2) {
      const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 4);
      glow.addColorStop(0, `hsla(${hue}, ${sat}%, ${light + 20}%, ${alpha * 0.3})`);
      glow.addColorStop(1, `hsla(${hue}, ${sat}%, ${light}%, 0)`);
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
      ctx.fillStyle = glow;
      ctx.fill();
    }
  }
}

// Flow field visualization
function drawField() {
  const step = 40;
  const cx = W / 2, cy = H / 2;
  
  for (let x = step / 2; x < W; x += step) {
    for (let y = step / 2; y < H; y += step) {
      const nx = x * FIELD_SCALE;
      const ny = y * FIELD_SCALE;
      const nt = time * 0.0003;
      
      const n1 = noise.noise2D(nx, ny + nt) * 0.6;
      const n2 = noise.noise2D(nx * 2.1, ny * 2.1 + nt * 1.3) * 0.3;
      const angle = (n1 + n2) * Math.PI * 2;
      
      // Distance from center affects opacity
      const dist = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
      const maxDist = Math.sqrt(cx * cx + cy * cy);
      const fade = Math.max(0, 1 - dist / maxDist) * 0.12;
      
      // Draw arrow/line showing flow direction
      const len = 12;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.moveTo(-len / 2, 0);
      ctx.lineTo(len / 2, 0);
      ctx.strokeStyle = `rgba(100, 200, 220, ${fade})`;
      ctx.lineWidth = 0.5;
      ctx.stroke();
      // Arrowhead
      ctx.beginPath();
      ctx.moveTo(len / 2, 0);
      ctx.lineTo(len / 2 - 3, -2);
      ctx.lineTo(len / 2 - 3, 2);
      ctx.closePath();
      ctx.fillStyle = `rgba(100, 200, 220, ${fade})`;
      ctx.fill();
      ctx.restore();
    }
  }
}

// Mouse glow effect
function drawMouseGlow() {
  if (mouseX < 0 || mouseX > W || mouseY < 0 || mouseY > H) return;
  
  const pulse = 0.5 + 0.5 * Math.sin(time * 0.05);
  const r = 180 + pulse * 40;
  
  const glow = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, r);
  glow.addColorStop(0, `rgba(80, 200, 220, ${0.06 + pulse * 0.04})`);
  glow.addColorStop(0.5, `rgba(120, 180, 220, ${0.03 + pulse * 0.02})`);
  glow.addColorStop(1, 'rgba(80, 150, 200, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(mouseX, mouseY, r, 0, Math.PI * 2);
  ctx.fill();
}

function init() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  
  particles = [];
  for (let i = 0; i < NUM_PARTICLES; i++) {
    particles.push(new Particle());
  }
}

function draw() {
  time++;
  
  // Dark background with slight fade for trails
  ctx.fillStyle = 'rgba(4, 4, 8, 0.15)';
  ctx.fillRect(0, 0, W, H);
  
  // Smooth mouse tracking
  mouseX += (targetMX - mouseX) * 0.06;
  mouseY += (targetMY - mouseY) * 0.06;
  
  // Draw flow field grid (subtle)
  drawField();
  
  // Draw mouse glow
  drawMouseGlow();
  
  // Update and draw particles
  for (const p of particles) {
    p.update();
    p.draw();
  }
  
  // Central liminal zone glow
  const cx = W / 2, cy = H / 2;
  const breathe = 0.5 + 0.5 * Math.sin(time * 0.008);
  const r = Math.min(W, H) * 0.35;
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  grad.addColorStop(0, `rgba(60, 160, 200, ${0.03 * breathe})`);
  grad.addColorStop(0.7, `rgba(80, 140, 180, ${0.01 * breathe})`);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  
  requestAnimationFrame(draw);
}

// Audio — ambient generative soundscape
function initAudio() {
  if (audioStarted) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioStarted = true;
  
  const masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(audioCtx.destination);
  masterGain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 4);
  
  // Layered drones
  const freqs = [55, 73.4, 110, 146.8, 220]; // A1, D2, A2, D3, A3
  
  freqs.forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    
    osc.type = i % 2 === 0 ? 'sine' : 'triangle';
    osc.frequency.value = f;
    osc.detune.value = (i - 2) * 5;
    
    filter.type = 'lowpass';
    filter.frequency.value = 300 + i * 40;
    filter.Q.value = 0.7;
    
    gain.gain.value = 0.12 - i * 0.015;
    
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);
    osc.start();
  });
  
  // Slow LFO on filter cutoff
  const lfo = audioCtx.createOscillator();
  const lfoGain = audioCtx.createGain();
  lfo.frequency.value = 0.06;
  lfoGain.gain.value = 150;
  lfo.connect(lfoGain);
  lfoGain.connect(masterGain);
  lfo.start();
}

document.getElementById('sound-btn').addEventListener('click', () => {
  initAudio();
  const btn = document.getElementById('sound-btn');
  btn.textContent = audioCtx.state === 'running' ? 'sound' : 'sound on';
});

// Input
window.addEventListener('mousemove', e => {
  targetMX = e.clientX;
  targetMY = e.clientY;
});

window.addEventListener('touchmove', e => {
  e.preventDefault();
  targetMX = e.touches[0].clientX;
  targetMY = e.touches[0].clientY;
}, { passive: false });

window.addEventListener('mouseleave', () => {
  targetMX = -9999;
  targetMY = -9999;
});

window.addEventListener('resize', () => {
  init();
});

// Text reveal
setTimeout(() => {
  document.getElementById('text').classList.add('visible');
}, 1000);

// Boot
init();
draw();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threshold Frequency</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; overflow: hidden; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .overlay {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    font-family: 'Courier New', monospace;
    color: rgba(180, 200, 220, 0.35);
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    line-height: 2.2;
    z-index: 10;
    white-space: nowrap;
  }
  .mouse-hint {
    position: fixed;
    top: 20px;
    right: 20px;
    font-family: 'Courier New', monospace;
    color: rgba(180, 200, 220, 0.2);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
  <span id="poetry"></span>
</div>
<div class="mouse-hint" id="hint"></div>

<script>
// ── Canvas setup ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
resize();
window.addEventListener('resize', resize);

// ── Mouse / touch ────────────────────────────────────────────────────────────
let mx = null, my = null;
window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
window.addEventListener('touchmove', e => { mx = e.touches[0].clientX; my = e.touches[0].clientY; }, { passive: true });
window.addEventListener('mouseleave', () => { mx = null; my = null; });

// ── Poetry ─────────────────────────────────────────────────────────────────────
const lines = [
  "between",
  "the",
  "wave",
  "and",
  "the",
  "wave",
  "is",
  "the",
  "wave",
  "that",
  "never",
  "moves"
];
let poetryIndex = 0;
let poetryTimer = 0;
const poetryEl = document.getElementById('poetry');
const hintEl = document.getElementById('hint');

function updatePoetry(dt) {
  poetryTimer += dt;
  if (poetryTimer > 2800) {
    poetryTimer = 0;
    const el = poetryEl;
    el.style.opacity = '0';
    setTimeout(() => {
      poetryIndex = (poetryIndex + 1) % (lines.length - 4);
      el.textContent = lines.slice(poetryIndex, poetryIndex + 5).join(' ');
      el.style.opacity = '1';
    }, 600);
  }
}

// ── Frequency bands (standing wave nodes) ─────────────────────────────────────
const NUM_BANDS = 7;
const bands = [];
for (let i = 0; i < NUM_BANDS; i++) {
  bands.push({
    freq: 0.3 + i * 0.18 + Math.random() * 0.08,
    phase: Math.random() * Math.PI * 2,
    phaseVel: (0.008 + Math.random() * 0.006) * (i % 2 === 0 ? 1 : -1),
    amplitude: 0.6 + Math.random() * 0.4,
    waveType: i < NUM_BANDS / 2 ? 'sine' : 'cosine',
    color: hsl((220 + i * 22) % 360, 55, 55 + i * 5),
  });
}

// ── Particle pool ───────────────────────────────────────────────────────────────
const NUM_PARTICLES = 420;
const particles = [];
const standingNodes = [];

// Precompute the standing wave node positions (where waves cancel)
const NODE_Y = [];
for (let i = 0; i <= 40; i++) {
  NODE_Y.push(H * 0.2 + (i / 40) * (H * 0.6));
}

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * W;
    this.y = NODE_Y[Math.floor(Math.random() * NODE_Y.length)];
    this.vx = (Math.random() - 0.5) * 0.4;
    this.vy = 0;
    this.size = 0.5 + Math.random() * 2.2;
    this.alpha = 0;
    this.targetAlpha = 0.1 + Math.random() * 0.5;
    this.band = Math.floor(Math.random() * NUM_BANDS);
    this.phase = Math.random() * Math.PI * 2;
    this.driftPhase = Math.random() * Math.PI * 2;
    this.driftSpeed = 0.004 + Math.random() * 0.004;
    this.isNode = Math.random() < 0.25; // 25% live at nodes
  }
  update(dt, t) {
    const b = bands[this.band];
    const wave = this.isNode
      ? Math.cos(b.freq * t + b.phase) * b.amplitude * 0.3
      : Math.sin(b.freq * t + b.phase) * b.amplitude;

    // Horizontal oscillation from wave
    this.x += this.vx + wave * 0.15;
    this.vx *= 0.994;

    // Drift along the standing wave (y drifts toward node)
    this.driftPhase += this.driftSpeed;
    const targetY = NODE_Y[Math.floor(Math.random() * NODE_Y.length)];
    this.y += (targetY - this.y) * 0.002;
    this.y += Math.sin(this.driftPhase) * 0.3;

    // Fade in/out near nodes
    const nodeProximity = Math.abs(Math.sin(b.freq * t + b.phase));
    this.targetAlpha = this.isNode
      ? (1 - nodeProximity) * 0.7 + 0.1
      : nodeProximity * 0.5;
    this.alpha += (this.targetAlpha - this.alpha) * 0.025;

    // Boundary wrap
    if (this.x < -10) this.x = W + 10;
    if (this.x > W + 10) this.x = -10;
    if (this.y < 0) this.y = H;
    if (this.y > H) this.y = 0;
  }
  draw(ctx, t) {
    const b = bands[this.band];
    const nodeIntensity = Math.abs(Math.cos(b.freq * t + b.phase));
    const glow = this.isNode ? nodeIntensity : (1 - nodeIntensity);
    const r = parseInt(b.color.slice(1, 3), 16);
    const g = parseInt(b.color.slice(3, 5), 16);
    const bl = parseInt(b.color.slice(5, 7), 16);

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * (this.isNode ? 2.2 : 1.4), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${bl},${this.alpha * glow})`;
    ctx.fill();

    // Glow halo for node particles
    if (this.isNode && glow > 0.3) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 4 * glow, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${bl},${this.alpha * glow * 0.08})`;
      ctx.fill();
    }
  }
}

for (let i = 0; i < NUM_PARTICLES; i++) {
  const p = new Particle();
  p.alpha = p.targetAlpha;
  particles.push(p);
}

// ── Standing wave visualization ────────────────────────────────────────────────
let standingWaveT = 0;
const WAVES = 3;

function drawStandingWave(t) {
  for (let w = 0; w < WAVES; w++) {
    const freq = bands[w % NUM_BANDS].freq;
    const phase = bands[w % NUM_BANDS].phase;
    const amp = bands[w % NUM_BANDS].amplitude * H * 0.18;

    ctx.beginPath();
    ctx.strokeStyle = `hsla(${(220 + w * 35) % 360}, 60%, ${45 + w * 12}%, ${0.12 + w * 0.04})`;
    ctx.lineWidth = 0.8;

    const slices = 200;
    for (let i = 0; i <= slices; i++) {
      const px = (i / slices) * W;
      const py = cy + Math.sin(freq * t + phase + px * 0.003 * (w + 1)) * amp
              + Math.cos(freq * 0.7 * t + phase * 1.3 + px * 0.002) * amp * 0.4;

      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }

  // Node markers — vertical lines at wave nodes
  const nodeCount = 5;
  for (let i = 0; i < nodeCount; i++) {
    const ny = H * 0.2 + (i / (nodeCount - 1)) * H * 0.6;
    const intensity = Math.abs(Math.cos(bands[0].freq * t + bands[0].phase));
    ctx.beginPath();
    ctx.moveTo(0, ny);
    ctx.lineTo(W, ny);
    ctx.strokeStyle = `rgba(100, 140, 200, ${intensity * 0.06})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }
}

// ── Mouse ripple ─────────────────────────────────────────────────────────────
const ripples = [];
class Ripple {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.r = 0;
    this.maxR = 180 + Math.random() * 120;
    this.alpha = 0.5;
    this.speed = 2.5 + Math.random() * 2;
  }
  update() {
    this.r += this.speed;
    this.alpha *= 0.965;
    return this.alpha > 0.02;
  }
  draw(ctx) {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(140, 180, 220, ${this.alpha * 0.5})`;
    ctx.lineWidth = 1;
    ctx.stroke();
    if (this.r < this.maxR * 0.6) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r * 0.5, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(200, 220, 255, ${this.alpha * 0.3})`;
      ctx.stroke();
    }
  }
}

window.addEventListener('click', e => ripples.push(new Ripple(e.clientX, e.clientY)));
window.addEventListener('touchstart', e => ripples.push(new Ripple(e.touches[0].clientX, e.touches[0].clientY)));

// ── Glow nodes at mouse proximity ─────────────────────────────────────────────
function drawMouseProximity(t) {
  if (mx === null) return;
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    if (!p.isNode) continue;
    const dx = p.x - mx;
    const dy = p.y - my;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const maxDist = 200;
    if (dist < maxDist) {
      const intensity = 1 - dist / maxDist;
      const b = bands[p.band];
      const r = parseInt(b.color.slice(1, 3), 16);
      const g = parseInt(b.color.slice(3, 5), 16);
      const bl = parseInt(b.color.slice(5, 7), 16);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 6 * intensity, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${bl},${intensity * 0.25})`;
      ctx.fill();
    }
  }
}

// ── Main loop ──────────────────────────────────────────────────────────────────
let lastTime = performance.now();

function loop(now) {
  const dt = now - lastTime;
  lastTime = now;
  const t = now * 0.001;

  // Background — deep blue-black with subtle gradient
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);

  // Subtle center glow
  const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.6);
  bgGrad.addColorStop(0, 'rgba(15, 25, 50, 0.4)');
  bgGrad.addColorStop(1, 'rgba(5, 5, 10, 0)');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  drawStandingWave(t);

  // Particles
  for (const p of particles) {
    p.update(dt, t);
    p.draw(ctx, t);
  }

  drawMouseProximity(t);

  // Ripples
  for (let i = ripples.length - 1; i >= 0; i--) {
    if (!ripples[i].update()) ripples.splice(i, 1);
    else ripples[i].draw(ctx);
  }

  updatePoetry(dt);

  // Fade hint
  if (t > 8) {
    hintEl.style.opacity = Math.max(0, 1 - (t - 8) * 0.1);
  }

  requestAnimationFrame(loop);
}

// ── Init poetry ───────────────────────────────────────────────────────────────
poetryEl.textContent = lines.slice(0, 5).join(' ');
poetryEl.style.transition = 'opacity 0.6s ease';
requestAnimationFrame(loop);
</script>
</body>
</html>

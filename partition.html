<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partition</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0a08;
    overflow: hidden;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    color: #efe3cf;
  }
  #stage { position: fixed; inset: 0; display: block; }
  #sill {
    position: fixed; left: 50%; transform: translateX(-50%);
    width: min(560px, 82vw); text-align: center;
    pointer-events: none;
  }
  #mode {
    position: fixed; top: 26px; left: 28px;
    font-size: 11px; letter-spacing: .34em; text-transform: uppercase;
    color: rgba(239,227,207,.42);
    pointer-events: none;
  }
  #measure {
    position: fixed; top: 26px; right: 28px; text-align: right;
    font-size: 11px; letter-spacing: .12em;
    color: rgba(239,227,207,.34); line-height: 1.8;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  #poem {
    position: fixed; bottom: 74px; left: 50%; transform: translateX(-50%);
    width: min(620px, 86vw); text-align: center;
    font-size: clamp(13px, 1.7vw, 17px); line-height: 1.75;
    color: rgba(239,227,207,.66); font-style: italic;
    letter-spacing: .01em; transition: opacity 1.6s ease;
    pointer-events: none;
  }
  #hint {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: .3em; text-transform: uppercase;
    color: rgba(239,227,207,.26); white-space: nowrap;
    pointer-events: none; transition: opacity 2s ease;
  }
  #hinge-line {
    position: fixed; pointer-events: none;
    background: linear-gradient(to bottom, rgba(212,168,83,.05), rgba(212,168,83,.55), rgba(212,168,83,.05));
    width: 1px; transition: opacity .4s ease;
  }
  #seam {
    position: fixed; pointer-events: none;
    box-shadow: 0 0 24px rgba(212,168,83,.35);
    border-radius: 1px;
  }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 38%, rgba(0,0,0,.55) 100%);
  }
  @media (max-width: 640px) {
    #measure { font-size: 10px; }
    #mode { letter-spacing: .22em; font-size: 10px; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="vignette"></div>
<div id="hinge-line"></div>
<div id="seam"></div>
<div id="mode">partition</div>
<div id="measure"></div>
<div id="poem"></div>
<div id="hint">drag across the frame to place the dividing plane · click to reseed</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const modeEl = document.getElementById("mode");
  const measureEl = document.getElementById("measure");
  const poemEl = document.getElementById("poem");
  const hintEl = document.getElementById("hint");
  const hingeEl = document.getElementById("hinge-line");
  const seamEl = document.getElementById("seam");

  let W = 0, H = 0, DPR = 1;
  const state = {
    hingeX: 0,          // normalised 0..1 position of the dividing plane (vertical)
    mouseX: 0.5,
    mouseY: 0.5,
    down: false,
    dragStartX: 0.5,
    dragStartHinge: 0.5,
    hingeAlive: 0,      // 0..1 glow intensity of the hinge itself
    lastPointerAt: 0,
    seed: Math.random() * 1000,
  };

  // ---------------- palette (warm-earth) ----------------
  const COL = {
    void:   [11, 10, 8],
    deep:   [26, 19, 12],
    umber:  [58, 40, 26],
    sienna: [122, 71, 40],
    ochre:  [196, 154, 108],
    sand:   [214, 178, 132],
    cream:  [239, 227, 207],
    terra:  [178, 84, 52],
    gold:   [212, 168, 83],
  };
  const mix = (a, b, t) => [
    a[0] + (b[0] - a[0]) * t,
    a[1] + (b[1] - a[1]) * t,
    a[2] + (b[2] - a[2]) * t,
  ];
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

  // ---------------- world model ----------------
  // The world is built as vertical columns. Each column belongs to one side
  // of the hinge. A column stores a stack of strata; each stratum carries
  // its own weight. The hinge move recomputes which side owns which column,
  // and the losing side's weight visibly drains across the seam.
  const COLS = 168;
  let columns = [];        // per-column: { strata:[{h, tone, seed}], side, drain }
  let horizonY = 0;

  function buildColumns() {
    columns = [];
    for (let i = 0; i < COLS; i++) {
      const n = 18 + ((Math.sin(i * 0.37 + state.seed) * 0.5 + 0.5) * 22) | 0;
      const strata = [];
      let total = 0;
      for (let j = 0; j < n; j++) {
        const t = j / n;
        // taller, older layers sit low; thin fresh ones accumulate high
        const h = (0.6 + Math.pow(Math.random(), 1.6) * 2.2) * (1.0 - t * 0.45);
        total += h;
        strata.push({
          h,
          tone: Math.random(),
          seed: Math.random() * 6.283,
          age: 0,
          born: Math.random(),
        });
      }
      columns.push({ strata, total, side: 0, drain: 0, wobble: Math.random() * 6.283 });
    }
  }

  function strataHeight(col) {
    let s = 0;
    for (let i = 0; i < col.strata.length; i++) s += col.strata[i].h;
    return s;
  }

  function normalizeColumns() {
    // rescale every column's strata so total == col.total exactly
    for (const col of columns) {
      const cur = strataHeight(col);
      const k = cur > 0 ? col.total / cur : 1;
      for (const s of col.strata) s.h *= k;
    }
  }

  // ---------------- colouring ----------------
  function stratumColor(tone, side, drain, depth) {
    // left side is the sediment: cool-neutrals within warm-earth
    // right side is the silt: warmer, redder
    let base;
    if (tone < 0.22) base = mix(COL.deep, COL.umber, tone / 0.22);
    else if (tone < 0.5) base = mix(COL.umber, COL.sienna, (tone - 0.22) / 0.28);
    else if (tone < 0.78) base = mix(COL.sienna, COL.ochre, (tone - 0.5) / 0.28);
    else base = mix(COL.ochre, COL.sand, (tone - 0.78) / 0.22);

    const sideShift = side === 1 ? 0.16 : -0.06;
    let c = mix(base, side === 1 ? COL.terra : COL.deep, Math.abs(sideShift) * 0.6);

    // drained mass fades toward the void
    c = mix(c, COL.void, drain * 0.72);
    // depth shading: near the sill it is darker
    c = mix(c, COL.void, (1 - depth) * 0.18);
    return c;
  }

  // ---------------- hinge geometry ----------------
  function hingeXpx() { return state.hingeX * W; }

  function updateSides() {
    const hx = hingeXpx();
    for (let i = 0; i < columns.length; i++) {
      const x = (i + 0.5) / COLS * W;
      const side = x < hx ? 0 : 1;
      if (columns[i].side !== side) {
        // mass transfer: weight moved across the seam becomes drain
        columns[i].drain = Math.min(1, columns[i].drain + 0.55);
        for (const s of columns[i].strata) s.age = 0;
      }
      columns[i].side = side;
    }
  }

  // ---------------- poem ----------------
  const LINES = [
    "Every boundary is a slow agreement about where the weight ends.",
    "The sediment does not know it has a side.",
    "A plane is only a decision that held long enough to look like stone.",
    "There was a room before the wall. The wall remembers it.",
    "What crosses the seam is measured in grains, not in intent.",
    "Some layers are four hundred years of quiet.",
    "The hinge is the one place that belongs to neither half.",
    "We keep calling it a line. It has always been a thickness.",
    "Deposited, then divided. Never the other way around.",
    "A threshold with a thickness is just the world, being honest.",
    "The heavier half is not the truer half.",
    "Count the layers; each one thought it was the surface.",
  ];
  let lineIdx = 0;
  function cyclePoem() {
    poemEl.style.opacity = "0";
    setTimeout(() => {
      lineIdx = (lineIdx + 1) % LINES.length;
      poemEl.textContent = LINES[lineIdx];
      poemEl.style.opacity = "1";
    }, 1600);
  }
  poemEl.textContent = LINES[0];
  poemEl.style.opacity = "1";

  // ---------------- strata simulation ----------------
  // Each frame, a few random strata acquire a little mass (deposition),
  // and a few lose mass (erosion). Deposition is biased toward whichever
  // side currently commands less total mass — the system equalises through
  // the seam, which is the whole point of a partition.
  function tickStrata(dt) {
    const hx = state.hingeXpx();
    let massL = 0, massR = 0;
    for (let i = 0; i < columns.length; i++) {
      const x = (i + 0.5) / COLS * W;
      const m = columns[i].total;
      if (x < hx) massL += m; else massR += m;
    }
    const total = massL + massR || 1;
    const biasL = massR / total;   // left deposits more when right is heavier
    const biasR = massL / total;

    const budget = Math.min(40, Math.max(6, (COLS * dt * 0.55) | 0));
    for (let k = 0; k < budget; k++) {
      const i = (Math.random() * COLS) | 0;
      const col = columns[i];
      if (col.strata.length < 4) continue;
      const s = col.strata[(Math.random() * col.strata.length) | 0];
      const x = (i + 0.5) / COLS * W;
      const sideBias = x < hx ? biasL : biasR;
      const deposit = Math.random() < 0.45 + sideBias * 0.4;
      const amt = (Math.random() * 0.55 + 0.06) * dt * 60 * 0.05;
      if (deposit) {
        s.h += amt * (0.7 + sideBias);
        col.total += amt * 0.6;
      } else {
        const take = Math.min(s.h * 0.4, amt * 0.8);
        s.h -= take;
        col.total = Math.max(8, col.total - take * 0.6);
      }
    }

    // drain relaxation
    for (const col of columns) {
      if (col.drain > 0) col.drain = Math.max(0, col.drain - dt * 0.55);
    }
  }

  // ---------------- rendering ----------------
  let tAcc = 0;
  let draftParticles = [];

  function spawnDrafts(dt) {
    // motes that lift off the hinge and drift both ways
    if (Math.random() < dt * 26) {
      const y = horizonY - Math.random() * 40;
      draftParticles.push({
        x: hingeXpx() + (Math.random() - 0.5) * 6,
        y,
        vx: (Math.random() - 0.5) * 26,
        vy: -6 - Math.random() * 22,
        life: 1,
        max: 1.6 + Math.random() * 2.2,
      });
    }
    for (let i = draftParticles.length - 1; i >= 0; i--) {
      const p = draftParticles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 4 * dt;
      p.vx += Math.sin(p.y * 0.02 + tAcc) * 5 * dt;
      p.life -= dt;
      if (p.life <= 0) draftParticles.splice(i, 1);
    }
    if (draftParticles.length > 340) draftParticles.splice(0, draftParticles.length - 340);
  }

  function draw() {
    const hx = hingeXpx();

    // sky: warm twilight, brighter just above the sill
    const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
    skyGrad.addColorStop(0, rgba(COL.void, 1));
    skyGrad.addColorStop(0.62, rgba(mix(COL.void, COL.deep, 0.75), 1));
    skyGrad.addColorStop(1, rgba(mix(COL.deep, COL.sienna, 0.28), 1));
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, horizonY + 2);

    // faint stars
    ctx.save();
    for (let i = 0; i < 90; i++) {
      const sx = ((i * 733.13 + state.seed * 17) % W);
      const sy = ((i * 311.7 + state.seed * 41) % (horizonY * 0.92));
      const tw = 0.5 + 0.5 * Math.sin(tAcc * (0.4 + i % 5 * 0.13) + i);
      ctx.fillStyle = rgba(COL.cream, 0.05 + tw * 0.09);
      ctx.fillRect(sx, sy, 1.2, 1.2);
    }
    ctx.restore();

    // the low haze band that makes the sill feel like a held breath
    const haze = ctx.createLinearGradient(0, horizonY - H * 0.19, 0, horizonY);
    haze.addColorStop(0, "rgba(178,84,52,0)");
    haze.addColorStop(1, "rgba(178,84,52,.14)");
    ctx.fillStyle = haze;
    ctx.fillRect(0, horizonY - H * 0.19, W, H * 0.19);

    // ---- columns of strata ----
    const colW = W / COLS;
    for (let i = 0; i < COLS; i++) {
      const col = columns[i];
      const x = i * colW;
      const wob = Math.sin(tAcc * 0.35 + col.wobble) * 0.6;
      const drawnH = col.total * (1 - col.drain * 0.42);
      let y = horizonY + col.total * 0.06 + wob;
      const scale = (H - horizonY) / 58;

      // base shadow beneath the stack
      ctx.fillStyle = "rgba(0,0,0,.35)";
      ctx.fillRect(x, y, colW + 0.6, Math.min(H - y, drawnH * scale));

      let acc = 0;
      for (let j = 0; j < col.strata.length; j++) {
        const s = col.strata[j];
        const hh = s.h * scale;
        if (hh <= 0) continue;
        const depth = 1 - ratio(y - horizonY, drawnH * scale);
        const t = Math.min(1, acc / Math.max(0.001, col.total));
        const tone = s.tone * 0.72 + t * 0.28;
        const c = stratumColor(tone, col.side, col.drain, depth);
        ctx.fillStyle = rgba(c, 1);
        ctx.fillRect(x, y, colW + 0.6, hh + 0.5);
        // thin highlight on top edge of every layer: the seam between strata
        ctx.fillStyle = rgba(mix(c, COL.sand, 0.35), 0.16 + 0.1 * Math.sin(s.seed + tAcc * 0.6));
        ctx.fillRect(x, y, colW + 0.6, 0.7);
        y += hh;
        acc += s.h;
        if (y > H) break;
      }
    }

    // ---- the hinge: the dividing plane itself ----
    const glow = 0.22 + state.hingeAlive * 0.62;
    const beam = ctx.createLinearGradient(hx - 30, 0, hx + 30, 0);
    beam.addColorStop(0, "rgba(212,168,83,0)");
    beam.addColorStop(0.5, `rgba(212,168,83,${0.10 + glow * 0.16})`);
    beam.addColorStop(1, "rgba(212,168,83,0)");
    ctx.fillStyle = beam;
    ctx.fillRect(hx - 30, 0, 60, horizonY + 40);

    ctx.strokeStyle = `rgba(212,168,83,${0.30 + glow * 0.5})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(hx + 0.5, 0);
    ctx.lineTo(hx + 0.5, H);
    ctx.stroke();

    // joint tick marks dropping from the sky to the sill
    ctx.strokeStyle = `rgba(239,227,207,${0.05 + glow * 0.09})`;
    for (let y = 0; y < horizonY; y += 26) {
      ctx.beginPath();
      ctx.moveTo(hx - 4, y);
      ctx.lineTo(hx + 4, y);
      ctx.stroke();
    }

    // ---- drafts: grains lifting out of the seam and crossing it ----
    for (const p of draftParticles) {
      const a = Math.max(0, p.life / p.max);
      ctx.fillStyle = rgba(mix(COL.ochre, COL.cream, a * 0.6), a * 0.5);
      const sz = 0.8 + a * 1.3;
      ctx.fillRect(p.x, p.y, sz, sz);
    }

    // ---- mass bars, one per side ----
    drawMassBars(hx);

    // DOM overlay for the hinge line + seam
    hingeEl.style.left = hx + "px";
    hingeEl.style.top = "0px";
    hingeEl.style.height = H + "px";
    hingeEl.style.opacity = String(0.35 + state.hingeAlive * 0.5);

    const sw = 3 + state.hingeAlive * 3;
    seamEl.style.left = hx - sw / 2 + "px";
    seamEl.style.top = horizonY - 14 + "px";
    seamEl.style.width = sw + "px";
    seamEl.style.height = "28px";
    seamEl.style.background = `rgba(212,168,83,${0.10 + state.hingeAlive * 0.45})`;
    seamEl.style.opacity = "1";
  }

  function ratio(a, b) { return b <= 0 ? 0 : Math.min(1, Math.max(0, a / b)); }

  function drawMassBars(hx) {
    let mL = 0, mR = 0;
    for (let i = 0; i < columns.length; i++) {
      const x = (i + 0.5) / COLS * W;
      if (x < hx) mL += columns[i].total; else mR += columns[i].total;
    }
    const tot = mL + mR || 1;
    const barW = Math.min(180, W * 0.22);
    const barY = H - 18;
    const gap = 14;

    const lx = hx - gap - barW;
    const rx = hx + gap;

    ctx.fillStyle = "rgba(239,227,207,.06)";
    ctx.fillRect(lx, barY, barW, 3);
    ctx.fillRect(rx, barY, barW, 3);

    ctx.fillStyle = rgba(COL.ochre, 0.55);
    ctx.fillRect(lx + barW * (1 - mL / tot), barY, barW * (mL / tot), 3);
    ctx.fillStyle = rgba(COL.terra, 0.62);
    ctx.fillRect(rx, barY, barW * (mR / tot), 3);

    measureEl.textContent =
      `${(mL / tot * 100).toFixed(1)}%  ·  ${(mR / tot * 100).toFixed(1)}%\n` +
      `hinge ${(state.hingeX * 100).toFixed(1)}  ·  Δ ${(Math.abs(mL - mR) / tot * 100).toFixed(2)}`;
    measureEl.style.whiteSpace = "pre";
  }

  // ---------------- loop ----------------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    tAcc += dt;

    // hinge glow decays, and so does the hint
    state.hingeAlive = Math.max(0, state.hingeAlive - dt * 0.9);
    if (tAcc > 12) hintEl.style.opacity = "0.12";

    // ambient drift when the pointer is idle
    const idle = performance.now() - state.lastPointerAt;
    if (!state.down && idle > 4000) {
      const drift = Math.sin(tAcc * 0.16) * 0.5 + 0.5;
      state.hingeX += (drift - state.hingeX) * dt * 0.18;
    }

    state.hingeX = Math.min(0.97, Math.max(0.03, state.hingeX));

    tickStrata(dt);
    spawnDrafts(dt);
    updateSides();
    draw();

    requestAnimationFrame(frame);
  }

  // ---------------- input ----------------
  function pointerNorm(e) {
    return e.clientX / W;
  }

  canvas.addEventListener("pointerdown", (e) => {
    state.down = true;
    state.dragStartX = pointerNorm(e);
    state.dragStartHinge = state.hingeX;
    state.lastPointerAt = performance.now();
    state.hingeAlive = 1;
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener("pointermove", (e) => {
    state.lastPointerAt = performance.now();
    state.mouseX = pointerNorm(e);
    state.mouseY = e.clientY / H;
    if (state.down) {
      const d = state.mouseX - state.dragStartX;
      state.hingeX = state.dragStartHinge + d * 0.9;
      state.hingeAlive = Math.min(1, state.hingeAlive + 0.12);
    } else {
      // hover near the hinge brightens the seam
      const dist = Math.abs(state.mouseX * W - hingeXpx());
      if (dist < 70) state.hingeAlive = Math.min(1, state.hingeAlive + 0.05);
    }
  });

  canvas.addEventListener("pointerup", (e) => {
    state.down = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  });

  canvas.addEventListener("pointerleave", () => { state.down = false; });

  canvas.addEventListener("click", (e) => {
    // reseed the sediment; a new deposit, a new argument about where it ends
    if (Math.abs(e.clientX / W - state.dragStartX) < 0.01) {
      state.seed = Math.random() * 1000;
      buildColumns();
      state.drain = 0;
      state.hingeAlive = 1;
      draftParticles = [];
    }
  });

  window.addEventListener("keydown", (e) => {
    const step = e.shiftKey ? 0.12 : 0.025;
    if (e.key === "ArrowLeft") { state.hingeX -= step; state.lastPointerAt = performance.now(); state.hingeAlive = 1; }
    if (e.key === "ArrowRight") { state.hingeX += step; state.lastPointerAt = performance.now(); state.hingeAlive = 1; }
    if (e.key === "r" || e.key === "R") {
      state.seed = Math.random() * 1000; buildColumns(); draftParticles = [];
    }
  });

  // ---------------- resize ----------------
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    horizonY = Math.round(H * 0.52);
    normalizeColumns();
    updateSides();
    draw();
  }

  // ---------------- boot ----------------
  buildColumns();
  state.hingeX = 0.5;
  state.lastPointerAt = performance.now();
  resize();
  window.addEventListener("resize", () => { resize(); });
  setInterval(cyclePoem, 13000);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

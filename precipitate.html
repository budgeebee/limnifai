<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>precipitate</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080812;overflow:hidden;font-family:'Courier New',monospace;cursor:crosshair}
canvas{display:block;position:fixed;top:0;left:0}
.txt{position:fixed;bottom:8%;left:50%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity 9s;pointer-events:none;z-index:10}
.txt.visible{opacity:1}
.txt p{font-size:clamp(0.35rem,0.8vw,0.5rem);color:rgba(140,180,200,0.18);letter-spacing:0.6em;text-transform:lowercase;line-height:2.6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="txt" id="t">
  <p>the space</p>
  <p>between</p>
  <p>dissolved</p>
  <p>and</p>
  <p>solid</p>
</div>
<script>
(function(){
var canvas=document.getElementById("c");
var ctx=canvas.getContext("2d");
var W,H;
var mx=0,my=0;
var time=0;
var phase=0;
var clusters=[];
var freeParticles=[];
var bonds=[];
var N=320;
var BOND_DIST=14;
var STICK_PROB=0.35;
var initialized=false;

function init(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  clusters=[];
  freeParticles=[];
  bonds=[];
  var cols=Math.ceil(Math.sqrt(N*W/H));
  var rows=Math.ceil(N/cols);
  var gx=W/(cols+1);
  var gy=H/(rows+1);
  for(var i=0;i<N;i++){
    var c=Math.floor(i/cols);
    var r=i%cols;
    var x=gx*(r+1)+(Math.random()-0.5)*gx*0.6;
    var y=gy*(c+1)+(Math.random()-0.5)*gy*0.6;
    var speed=0.08+Math.random()*0.15;
    var ang=Math.random()*Math.PI*2;
    freeParticles.push({
      x:x,y:y,
      vx:Math.cos(ang)*speed,
      vy:Math.sin(ang)*speed,
      size:1.5+Math.random()*2.5,
      hue:200+Math.random()*60,
      brightness:0.4+Math.random()*0.4,
      life:0,
      age:Math.random()*2000
    });
  }
  setTimeout(function(){
    document.getElementById("t").classList.add("visible");
  },2000);
  initialized=true;
}

function dist2(a,b){
  var dx=a.x-b.x,dy=a.y-b.y;
  return dx*dx+dy*dy;
}

function tryBond(p1,p2){
  var d2=dist2(p1,p2);
  if(d2>BOND_DIST*BOND_DIST)return false;
  for(var i=0;i<bonds.length;i++){
    var b=bonds[i];
    if((b.a===p1&&b.b===p2)||(b.a===p2&&b.b===p1))return false;
  }
  if(Math.random()<STICK_PROB){
    bonds.push({a:p1,b:p2,age:0,opacity:0});
    return true;
  }
  return false;
}

function draw(){
  time++;
  phase+=0.004;
  ctx.fillStyle="rgba(8,8,18,0.12)";
  ctx.fillRect(0,0,W,H);
  var mx01=mx/W;
  var turbulence=mx01*0.6;
  var gravity=(my/H)*0.015;
  for(var i=freeParticles.length-1;i>=0;i--){
    var p=freeParticles[i];
    p.age++;
    var turbScale=turbulence*(0.5+0.5*Math.sin(p.age*0.01));
    var ang=Math.sin(p.age*0.008+p.x*0.003)*Math.PI;
    p.vx+=Math.cos(ang)*turbScale*0.1;
    p.vy+=Math.sin(ang)*turbScale*0.1;
    p.vy+=gravity;
    p.vx*=0.985;
    p.vy*=0.985;
    var sp=Math.sqrt(p.vx*p.vx+p.vy*p.vy);
    var maxSp=0.4+turbulence*1.5;
    if(sp>maxSp){p.vx=p.vx*maxSp/sp;p.vy=p.vy*maxSp/sp;}
    p.x+=p.vx;
    p.y+=p.vy;
    if(p.x<3){p.x=3;p.vx=Math.abs(p.vx)*0.5;}
    if(p.x>W-3){p.x=W-3;p.vx=-Math.abs(p.vx)*0.5;}
    if(p.y<3){p.y=3;p.vy=Math.abs(p.vy)*0.5;}
    if(p.y>H-3){p.y=H-3;p.vy=-Math.abs(p.vy)*0.5;}
  }
  for(var i=0;i<freeParticles.length;i++){
    for(var j=i+1;j<freeParticles.length;j++){
      tryBond(freeParticles[i],freeParticles[j]);
    }
  }
  for(var i=bonds.length-1;i>=0;i--){
    var b=bonds[i];
    b.age++;
    b.opacity=Math.min(0.7,b.opacity+0.02);
    var d2=dist2(b.a,b.b);
    if(d2>BOND_DIST*BOND_DIST*4){
      b.opacity-=0.05;
      if(b.opacity<=0){bonds.splice(i,1);continue;}
    }
    var d=Math.sqrt(d2);
    var stress=Math.min(1,d/BOND_DIST);
    var r=Math.floor(140+b.age*0.1);
    var g=Math.floor(180+40*stress);
    var b2=Math.floor(200-40*stress);
    ctx.strokeStyle="rgba("+r+","+g+","+b2+","+b.opacity+")";
    ctx.lineWidth=0.8+stress*0.5;
    ctx.beginPath();
    ctx.moveTo(b.a.x,b.a.y);
    ctx.lineTo(b.b.x,b.b.y);
    ctx.stroke();
  }
  for(var i=freeParticles.length-1;i>=0;i--){
    var p=freeParticles[i];
    var nearMx=Math.sqrt((p.x-mx)*(p.x-mx)+(p.y-my)*(p.y-my))<50;
    var bonded=bonds.some(function(b){return b.a===p||b.b===p;});
    var a=p.brightness;
    if(nearMx)a=0.9;
    var bondedGlow=bonded?0.5:0;
    if(bonded){
      var bondCount=bonds.filter(function(b){return b.a===p||b.b===p;}).length;
      a*=Math.min(1,0.4+bondCount*0.15);
    }
    var sz=p.size*(nearMx?1.4:1);
    ctx.shadowColor="hsla("+p.hue+",50%,"+(bondedGlow>0?70:50)+"%,0.8)";
    ctx.shadowBlur=nearMx?12:4;
    ctx.fillStyle="hsla("+p.hue+",40%,"+(bondedGlow>0?75:40)+"%,"+a+")";
    ctx.beginPath();
    ctx.arc(p.x,p.y,sz,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0;
  }
  if(mx>0){
    ctx.strokeStyle="rgba(100,160,200,0.06)";
    ctx.lineWidth=0.5;
    ctx.beginPath();
    ctx.arc(mx,my,50,0,Math.PI*2);
    ctx.stroke();
    ctx.strokeStyle="rgba(100,160,200,0.04)";
    ctx.beginPath();
    ctx.arc(mx,my,80,0,Math.PI*2);
    ctx.stroke();
    ctx.fillStyle="rgba(140,200,220,0.08)";
    ctx.beginPath();
    ctx.arc(mx,my,4,0,Math.PI*2);
    ctx.fill();
  }
  var totalBonded=bonds.length*2;
  var pct=Math.min(1,totalBonded/N);
  if(pct>0.02){
    var barY=H-20;
    var barW=W*0.3;
    var barX=(W-barW)/2;
    ctx.fillStyle="rgba(40,60,80,0.3)";
    ctx.fillRect(barX,barY,barW,3);
    var hue2=160+pct*60;
    ctx.fillStyle="hsla("+hue2+",40%,"+(40+pct*30)+"%,"+(0.3+pct*0.5)+")";
    ctx.fillRect(barX,barY,barW*pct,3);
  }
  var vig=ctx.createRadialGradient(W/2,H/2,H*0.1,W/2,H/2,H*0.9);
  vig.addColorStop(0,"rgba(8,8,18,0)");
  vig.addColorStop(1,"rgba(8,8,18,0.45)");
  ctx.fillStyle=vig;
  ctx.fillRect(0,0,W,H);
  requestAnimationFrame(draw);
}

window.addEventListener("mousemove",function(e){mx=e.clientX;my=e.clientY;});
window.addEventListener("click",function(e){
  mx=e.clientX;my=e.clientY;
  for(var k=0;k<18;k++){
    var ang=Math.random()*Math.PI*2;
    var sp=0.3+Math.random()*0.7;
    freeParticles.push({
      x:e.clientX+(Math.random()-0.5)*20,
      y:e.clientY+(Math.random()-0.5)*20,
      vx:Math.cos(ang)*sp,
      vy:Math.sin(ang)*sp,
      size:1.5+Math.random()*2.5,
      hue:180+Math.random()*80,
      brightness:0.5+Math.random()*0.4,
      life:0,
      age:Math.random()*200
    });
  }
  if(freeParticles.length>600){
    freeParticles.splice(0,18);
  }
  for(var i=0;i<freeParticles.length;i++){
    var p=freeParticles[i];
    var dx=p.x-e.clientX,dy=p.y-e.clientY;
    var d=Math.sqrt(dx*dx+dy*dy);
    if(d<80){
      var f=(80-d)/80*0.5;
      p.vx+=dx/d*f;
      p.vy+=dy/d*f;
    }
  }
});
window.addEventListener("touchstart",function(e){
  e.preventDefault();
  mx=e.touches[0].clientX;
  my=e.touches[0].clientY;
  for(var k=0;k<10;k++){
    var ang=Math.random()*Math.PI*2;
    var sp=0.2+Math.random()*0.5;
    freeParticles.push({
      x:mx+(Math.random()-0.5)*15,
      y:my+(Math.random()-0.5)*15,
      vx:Math.cos(ang)*sp,
      vy:Math.sin(ang)*sp,
      size:1.5+Math.random()*2,
      hue:180+Math.random()*80,
      brightness:0.5+Math.random()*0.4,
      life:0,
      age:Math.random()*200
    });
  }
},{passive:false});
window.addEventListener("touchmove",function(e){
  e.preventDefault();
  mx=e.touches[0].clientX;
  my=e.touches[0].clientY;
  for(var i=0;i<freeParticles.length;i++){
    var p=freeParticles[i];
    var dx=p.x-mx,dy=p.y-my;
    var d=Math.sqrt(dx*dx+dy*dy);
    if(d<60){
      var f=(60-d)/60*0.3;
      p.vx+=dx/d*f;
      p.vy+=dy/d*f;
    }
  }
},{passive:false});
window.addEventListener("resize",function(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
});
init();draw();
})();
</script>
</body>
</html>

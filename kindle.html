<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050508;
    overflow: hidden;
    font-family: 'Georgia', 'Times New Roman', serif;
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
    height: 100vh;
    width: 100vw;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #phrase {
    color: rgba(240, 220, 180, 0);
    font-size: clamp(1.2rem, 3vw, 2.4rem);
    font-style: italic;
    letter-spacing: 0.06em;
    text-align: center;
    max-width: 70vw;
    transition: opacity 2s ease;
    text-shadow: 0 0 30px rgba(240, 200, 140, 0.4);
    line-height: 1.5;
  }
  #indicator {
    position: absolute;
    bottom: 2rem;
    right: 2rem;
    color: rgba(200, 180, 150, 0.5);
    font-size: 0.75rem;
    font-family: monospace;
    pointer-events: none;
    letter-spacing: 0.05em;
    transition: opacity 1.5s;
  }
  #title-overlay {
    position: absolute;
    top: 2rem;
    left: 2rem;
    color: rgba(220, 200, 160, 0.6);
    font-size: 0.85rem;
    font-family: monospace;
    letter-spacing: 0.12em;
    pointer-events: none;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay"><span id="phrase"></span></div>
<div id="title-overlay">KINDLE</div>
<div id="indicator"></div>

<script>
// ── Gray-Scott Reaction-Diffusion ──────────────────────────────
// Exploring the threshold between uniformity and pattern —
// the liminal space where Turing patterns kindle from the gray.

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Simulation grid (scaled for performance)
const GW = 160;
const GH = 120;
const CELL_SCALE = 4; // rendering scale factor

let u = new Float32Array(GW * GH);     // activator
let v = new Float32Array(GW * GH);     // inhibitor
let uNext = new Float32Array(GW * GH);
let vNext = new Float32Array(GW * GH);

// Gray-Scott parameters
const Du = 0.16;
const Dv = 0.08;
let F = 0.052;   // feed rate
let K = 0.063;   // kill rate
let targetF = 0.052;
let targetK = 0.063;

// Mouse state
let mouseX = -100;
let mouseY = -100;
let mouseActive = false;

// Time tracking
let time = 0;
let lastSeedTime = 0;
const SEED_INTERVAL = 8000; // ms between auto-seeds
const STEPS_PER_FRAME = 3;

// Phrase system
const phrases = [
  'patterns kindling from the gray',
  'form remembering itself',
  'the first blush of order',
  'at the edge of becoming',
  'equations dreaming in two dimensions',
  'a threshold crossed in silence',
  'where stillness breaks into dance',
  'what was uniform discovers difference',
  'the moment before the first mark',
  'kindle: to catch fire, to begin',
  'spots bloom where nothing was',
  'stripes ripple through the void',
  'the gap between stillness and song',
  'watching order invent itself',
  'a universe learning to be alive'
];
let phraseIndex = 0;
let phraseOpacity = 0;
let phraseTarget = 0;
let phraseTimer = 0;
const PHRASE_DISPLAY = 5000;
const PHRASE_FADE = 6000;

// ── Grid Initialization ────────────────────────────────────────
function initGrids() {
  for (let i = 0; i < GW * GH; i++) {
    u[i] = 1.0;
    v[i] = 0.0;
  }
  // Center seed — a disc of initial perturbation
  const cx = Math.floor(GW / 2);
  const cy = Math.floor(GH / 2);
  const seedR = 12;
  for (let y = cy - seedR; y <= cy + seedR; y++) {
    for (let x = cx - seedR; x <= cx + seedR; x++) {
      const dx = x - cx;
      const dy = y - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < seedR) {
        const idx = y * GW + x;
        const strength = 0.5 * (1 - dist / seedR);
        u[idx] = 1.0 - strength * 0.3;
        v[idx] = 0.15 + Math.random() * 0.2 * strength;
      }
    }
  }
  // Random micro-seeds scattered
  for (let s = 0; s < 8; s++) {
    const sx = 20 + Math.floor(Math.random() * (GW - 40));
    const sy = 20 + Math.floor(Math.random() * (GH - 40));
    for (let dy = -3; dy <= 3; dy++) {
      for (let dx = -3; dx <= 3; dx++) {
        const idx = (sy + dy) * GW + (sx + dx);
        if (idx >= 0 && idx < GW * GH) {
          v[idx] = 0.1 + Math.random() * 0.15;
          u[idx] = 0.85 + Math.random() * 0.1;
        }
      }
    }
  }
}

// ── Laplacian (5-point stencil, toroidal wrap) ─────────────────
function laplacian(grid, x, y) {
  const xm = (x - 1 + GW) % GW;
  const xp = (x + 1) % GW;
  const ym = (y - 1 + GH) % GH;
  const yp = (y + 1) % GH;
  return (
    grid[xm + y * GW] +
    grid[xp + y * GW] +
    grid[x + ym * GW] +
    grid[x + yp * GW] -
    4 * grid[x + y * GW]
  );
}

// ── Gray-Scott Step ────────────────────────────────────────────
function step() {
  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      const idx = x + y * GW;
      const uVal = u[idx];
      const vVal = v[idx];
      const uvv = uVal * vVal * vVal;
      const lapU = laplacian(u, x, y);
      const lapV = laplacian(v, x, y);

      uNext[idx] = uVal + Du * lapU - uvv + F * (1 - uVal);
      vNext[idx] = vVal + Dv * lapV + uvv - (F + K) * vVal;

      // Clamp to prevent blowup
      uNext[idx] = Math.max(0, Math.min(1, uNext[idx]));
      vNext[idx] = Math.max(0, Math.min(1, vNext[idx]));
    }
  }
  // Swap buffers
  [u, uNext] = [uNext, u];
  [v, vNext] = [vNext, v];
}

// ── Render ─────────────────────────────────────────────────────
function render() {
  const w = canvas.width;
  const h = canvas.height;
  const imgData = ctx.createImageData(w, h);
  const data = imgData.data;

  // Compute average v for adaptive brightness
  let vSum = 0;
  let vMax = 0;
  for (let i = 0; i < GW * GH; i++) {
    vSum += v[i];
    if (v[i] > vMax) vMax = v[i];
  }
  const vAvg = vSum / (GW * GH);
  const vThreshold = Math.max(0.15, vAvg * 1.5);

  for (let gy = 0; gy < GH; gy++) {
    for (let gx = 0; gx < GW; gx++) {
      const idx = gx + gy * GW;
      const vVal = v[idx];
      const uVal = u[idx];

      // Map v concentration to grayscale with golden accent at threshold
      // Low v = dark, high v = bright with warm shift
      const t = Math.min(1, vVal / Math.max(0.25, vMax * 1.2));
      let r, g, b;

      if (t < 0.1) {
        // Near-black depths
        const subT = t / 0.1;
        r = Math.floor(5 + subT * 20);
        g = Math.floor(5 + subT * 15);
        b = Math.floor(8 + subT * 20);
      } else if (t > 0.7) {
        // Bright regions — shift toward warm golden
        const warmT = (t - 0.7) / 0.3;
        const baseR = 180 + 70 * ((t - 0.7) / 0.3);
        const baseG = 160 + 65 * ((t - 0.7) / 0.3);
        const baseB = 130 + 55 * ((t - 0.7) / 0.3);
        r = Math.floor(lerp(baseR, 252, warmT * warmT));
        g = Math.floor(lerp(baseG, 230, warmT));
        b = Math.floor(lerp(baseB, 195, warmT * 0.7));
      } else {
        // Mid-range grays — slightly warm
        const midT = (t - 0.1) / 0.6;
        r = Math.floor(25 + midT * 175);
        g = Math.floor(20 + midT * 160);
        b = Math.floor(28 + midT * 145);
      }

      // Write block of pixels
      const px = gx * CELL_SCALE;
      const py = gy * CELL_SCALE;

      for (let dy = 0; dy < CELL_SCALE; dy++) {
        for (let dx = 0; dx < CELL_SCALE; dx++) {
          if (px + dx < w && py + dy < h) {
            const pi = ((py + dy) * w + (px + dx)) * 4;
            data[pi] = r;
            data[pi + 1] = g;
            data[pi + 2] = b;
            data[pi + 3] = 255;
          }
        }
      }
    }
  }

  ctx.putImageData(imgData, 0, 0);
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

// ── Auto-seed: inject perturbation if patterns die ─────────────
function autoSeed() {
  let vMax = 0;
  for (let i = 0; i < GW * GH; i++) {
    if (v[i] > vMax) vMax = v[i];
  }

  // If patterns have faded, inject new seeds
  if (vMax < 0.12 || (vMax < 0.2 && Math.random() < 0.3)) {
    const cx = 30 + Math.floor(Math.random() * (GW - 60));
    const cy = 30 + Math.floor(Math.random() * (GH - 60));
    const sr = 5 + Math.floor(Math.random() * 6);
    for (let dy = -sr; dy <= sr; dy++) {
      for (let dx = -sr; dx <= sr; dx++) {
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < sr) {
          const idx = (cy + dy) * GW + (cx + dx);
          if (idx >= 0 && idx < GW * GH) {
            v[idx] = 0.2 * (1 - dist / sr);
            u[idx] = 0.75 + 0.15 * Math.random();
          }
        }
      }
    }
  }
}

// ── Mouse → F/K mapping ───────────────────────────────────────
function updateParams() {
  const ww = canvas.width;
  const wh = canvas.height;

  if (mouseActive) {
    // X-axis: F from 0.02 to 0.08 (dissolution → chaos)
    targetF = 0.02 + (mouseX / ww) * 0.06;
    // Y-axis: K from 0.045 to 0.07 (spots → waves → stripes)
    targetK = 0.045 + (1 - mouseY / wh) * 0.025;
  } else {
    // Gentle autonomous drift when no mouse
    const autoF = 0.045 + Math.sin(time * 0.0003) * 0.015;
    const autoK = 0.058 + Math.cos(time * 0.0004 + 1.5) * 0.008;
    targetF = autoF;
    targetK = autoK;
  }

  // Smooth approach
  F = lerp(F, targetF, 0.03);
  K = lerp(K, targetK, 0.03);
}

// ── Phrase System ──────────────────────────────────────────────
function updatePhrases(dt) {
  phraseTimer += dt;

  if (phraseTimer > PHRASE_FADE) {
    phraseTimer = 0;
    phraseIndex = (phraseIndex + 1) % phrases.length;
    phraseTarget = 1;
  } else if (phraseTimer > PHRASE_DISPLAY) {
    phraseTarget = 0;
  }

  phraseOpacity = lerp(phraseOpacity, phraseTarget, 0.02);

  const el = document.getElementById('phrase');
  el.textContent = phrases[phraseIndex];
  el.style.opacity = phraseOpacity;
}

// ── Indicator ──────────────────────────────────────────────────
function updateIndicator() {
  const zone = getParameterZone(F, K);
  document.getElementById('indicator').textContent =
    `F:${F.toFixed(4)} K:${K.toFixed(4)} · ${zone}`;
}

function getParameterZone(f, k) {
  const ratio = k / f;
  if (f < 0.03) return 'dissolution';
  if (k > 0.065 && f > 0.055) return 'mitosis';
  if (k > 0.063) return 'spots';
  if (k > 0.055 && f < 0.045) return 'stripes';
  if (k > 0.055) return 'waves';
  if (ratio > 1.8) return 'uniform';
  return 'threshold';
}

// ── Animation Loop ─────────────────────────────────────────────
let lastTime = 0;

function animate(timestamp) {
  const dt = lastTime ? timestamp - lastTime : 16;
  lastTime = timestamp;
  time += dt;

  updateParams();

  // Multiple reaction-diffusion steps per visual frame
  for (let s = 0; s < STEPS_PER_FRAME; s++) {
    step();
  }

  // Auto-seed if needed
  if (time - lastSeedTime > SEED_INTERVAL) {
    autoSeed();
    lastSeedTime = time;
  }

  render();
  updatePhrases(dt);
  if (time % 2000 < dt + 20) updateIndicator(); // update ~2x/sec

  requestAnimationFrame(animate);
}

// ── Event Handlers ─────────────────────────────────────────────
function onMouseMove(e) {
  mouseX = e.clientX;
  mouseY = e.clientY;
  mouseActive = true;
}

function onMouseLeave() {
  mouseActive = false;
}

function onTouchMove(e) {
  if (e.touches.length > 0) {
    mouseX = e.touches[0].clientX;
    mouseY = e.touches[0].clientY;
    mouseActive = true;
  }
}

function onTouchEnd() {
  mouseActive = false;
}

// ── Resize Handler ─────────────────────────────────────────────
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.imageSmoothingEnabled = false;
}

// ── Boot ───────────────────────────────────────────────────────
function init() {
  resize();
  initGrids();

  canvas.addEventListener('mousemove', onMouseMove);
  canvas.addEventListener('mouseleave', onMouseLeave);
  canvas.addEventListener('touchmove', onTouchMove, { passive: true });
  canvas.addEventListener('touchend', onTouchEnd);

  window.addEventListener('resize', () => {
    resize();
    initGrids();
  });

  // Show first phrase after a brief delay
  setTimeout(() => {
    phraseTarget = 1;
    phraseTimer = 0;
  }, 1200);

  lastSeedTime = 0;
  requestAnimationFrame(animate);
}

init();
</script>
</body>
</html>

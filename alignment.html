<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interference</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0f; color: #e0e0e0; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }
canvas { display: block; position: absolute; top: 0; left: 0; }
#ui { position: absolute; bottom: 30px; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 2; }
#hint { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.4; }
#freq-display { margin-top: 12px; font-size: 13px; letter-spacing: 1px; opacity: 0.7; }
#beat-display { font-size: 28px; margin-top: 8px; letter-spacing: 3px; }
#title { position: absolute; top: 30px; left: 0; right: 0; text-align: center; font-size: 14px; letter-spacing: 6px; text-transform: uppercase; opacity: 0.3; }
#phrase { position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%); text-align: center; font-size: 16px; line-height: 1.8; opacity: 0; transition: opacity 3s; pointer-events: none; z-index: 2; letter-spacing: 1px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">interference</div>
<div id="phrase">the space between<br>two almost-aligned<br>frequencies</div>
<div id="ui">
  <div id="hint">move left / right to shift frequency · space to hold threshold</div>
  <div id="freq-display">f1: <span id="f1">0</span> hz &nbsp;&nbsp; f2: <span id="f2">0</span> hz</div>
  <div id="beat-display"><span id="beat">0</span> hz beat</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Wave parameters
let freq1 = 120;
let freq2 = 121;
let phase = 0;
let phase2 = 0;
const BASE_F1_MIN = 80, BASE_F1_MAX = 250;
const BASE_F2_MIN = 80, BASE_F2_MAX = 400;

// Particles for interference visualization
const PARTICLE_COUNT = 220;
const particles = [];
for (let i = 0; i < PARTICLE_COUNT; i++) {
  particles.push({
    x: Math.random() * W,
    y: Math.random() * H,
    vx: 0, vy: 0,
    phase: Math.random() * Math.PI * 2,
    speed: 0.3 + Math.random() * 0.7,
    size: 1 + Math.random() * 2
  });
}

// Mouse
let mouseX = W / 2, mouseY = H / 2;
let spaceDown = false;

document.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space') spaceDown = true;
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space') spaceDown = false;
});

// Touch support
document.addEventListener('touchmove', e => {
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
  e.preventDefault();
}, { passive: false });
document.addEventListener('touchstart', e => {
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
});

// Audio
let synth1, synth2, chorus, feedback;
let audioStarted = false;

async function initAudio() {
  if (audioStarted) return;
  await Tone.start();
  
  synth1 = new Tone.Synth({
    oscillator: { type: 'sine' },
    envelope: { attack: 0.05, decay: 0.3, sustain: 0.4, release: 1.2 }
  }).toDestination();
  
  synth2 = new Tone.Synth({
    oscillator: { type: 'sine' },
    envelope: { attack: 0.05, decay: 0.3, sustain: 0.4, release: 1.2 }
  }).toDestination();
  
  // Subtle chorus effect
  chorus = new Tone.Chorus(0.5, 2, 0.3).start();
  synth1.connect(chorus);
  
  // Reverb-like delay
  feedback = new Tone.FeedbackDelay("4n", 0.2);
  synth2.connect(feedback);
  feedback.toDestination();
  
  audioStarted = true;
  
  // Initial tones
  playTone();
}

function playTone() {
  if (!audioStarted || !synth1) return;
  const t = Tone.now();
  synth1.triggerAttackRelease(freq1, "8n", t);
  synth2.triggerAttackRelease(freq2, "8n", t + 0.01);
}

let lastToneTime = 0;
const TONE_INTERVAL = 180; // ms between tone triggers

// Phrase cycling
const phrases = [
  "the space between\ntwo almost-aligned\nfrequencies",
  "where waves meet\nand momentarily\nbecome one",
  "constructive\nthen destructive\nthen construct",
  "alignment is\nthe rarest state\nthe loudest cry",
  "the threshold\nis not a place\nbut a relationship",
  "two frequencies\ndancing close\nnot quite touching",
  "interference: the\npattern that emerges\nbetween two tones",
  "beat frequency:\nthe space between\nthe spaces",
];
let phraseIdx = 0;
let phraseOpacity = 0;
let phraseTimer = 0;
const PHRASE_DURATION = 6000; // ms per phrase

function updatePhrase(t) {
  phraseTimer += t;
  if (phraseTimer > PHRASE_DURATION) {
    phraseTimer = 0;
    phraseIdx = (phraseIdx + 1) % phrases.length;
    phraseOpacity = 0;
    document.getElementById('phrase').textContent = phrases[phraseIdx];
  }
  // Fade in first 1s, hold, fade out last 1s
  const elapsed = phraseTimer;
  if (elapsed < 1000) {
    phraseOpacity = elapsed / 1000;
  } else if (elapsed > PHRASE_DURATION - 1000) {
    phraseOpacity = (PHRASE_DURATION - elapsed) / 1000;
  } else {
    phraseOpacity = 1;
  }
  document.getElementById('phrase').style.opacity = phraseOpacity * 0.5;
}

// Glow points that pulse at beat frequency
const glowPoints = [];
const GLOW_COUNT = 8;
for (let i = 0; i < GLOW_COUNT; i++) {
  glowPoints.push({
    angle: (i / GLOW_COUNT) * Math.PI * 2,
    radius: 0,
    intensity: 0,
    hue: 0
  });
}

// Interference wave field
function interferenceAt(x, y, t) {
  const scale = 0.008;
  const s1 = Math.sin(x * scale * freq1 / 100 + t * 2);
  const s2 = Math.sin(y * scale * freq2 / 100 + t * 1.5 + phase);
  const s3 = Math.sin((x + y) * scale * 0.5 + t * 0.7);
  return (s1 + s2 + s3) / 3;
}

// Render
let frame = 0;
let time = 0;

function render(dt) {
  time += dt;
  frame++;
  
  // Update frequencies from mouse
  const rawX = mouseX / W;
  const targetF1 = BASE_F1_MIN + rawX * (BASE_F1_MAX - BASE_F1_MIN);
  const targetF2 = BASE_F2_MIN + rawX * (BASE_F2_MAX - BASE_F2_MIN) + (spaceDown ? 0.5 : 0);
  
  // Space key locks frequencies to near-alignment
  if (spaceDown) {
    // Drive f2 toward f1 (threshold moment)
    freq2 = freq2 + (freq1 - freq2) * 0.05;
    // But keep slight offset for interference effect
  } else {
    freq2 += (targetF2 - freq2) * 0.03;
  }
  freq1 += (targetF1 - freq1) * 0.03;
  
  // Smooth phase for interference
  phase += dt * 0.3;
  phase2 += dt * 0.2;
  
  // Beat frequency
  const beatFreq = Math.abs(freq2 - freq1);
  
  // Update UI
  document.getElementById('f1').textContent = Math.round(freq1);
  document.getElementById('f2').textContent = Math.round(freq2);
  document.getElementById('beat').textContent = beatFreq.toFixed(1);
  
  // Beat-driven glow intensity
  const glowIntensity = Math.max(0, 1 - beatFreq / 50);
  
  // Play tones at regular intervals
  if (Date.now() - lastToneTime > TONE_INTERVAL) {
    lastToneTime = Date.now();
    playTone();
  }
  
  // Clear
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);
  
  // Interference field visualization
  const gridSize = 12;
  for (let x = 0; x < W; x += gridSize) {
    for (let y = 0; y < H; y += gridSize) {
      const v = interferenceAt(x, y, time);
      const norm = (v + 1) * 0.5;
      
      // Neon color based on beat
      const hue = (180 + beatFreq * 2) % 360;
      const sat = 80 + glowIntensity * 20;
      const light = 30 + norm * 40 + glowIntensity * 20;
      const alpha = 0.15 + norm * 0.25 + glowIntensity * 0.1;
      
      ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light}%, ${alpha})`;
      ctx.fillRect(x, y, gridSize - 1, gridSize - 1);
    }
  }
  
  // Glow points at beat frequency
  const beatPhase = (time * beatFreq * 0.1) % (Math.PI * 2);
  glowPoints.forEach((gp, i) => {
    gp.intensity = 0.5 + 0.5 * Math.sin(beatPhase + i * 0.8) * glowIntensity;
    gp.radius = 60 + gp.intensity * 120;
    gp.hue = (160 + beatFreq * 3 + time * 10) % 360;
    
    const cx = W * 0.5 + Math.cos(gp.angle + time * 0.2) * gp.radius * 0.5;
    const cy = H * 0.5 + Math.sin(gp.angle + time * 0.15) * gp.radius * 0.4;
    
    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, 80 + gp.intensity * 60);
    grd.addColorStop(0, `hsla(${gp.hue}, 100%, 60%, ${gp.intensity * 0.4})`);
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.fillRect(cx - 150, cy - 150, 300, 300);
  });
  
  // Particle system driven by interference field
  particles.forEach(p => {
    const ix = p.x % W;
    const iy = p.y % H;
    const fieldVal = interferenceAt(ix, iy, time);
    
    // Particles move along field gradient
    const eps = 3;
    const dx = interferenceAt(ix + eps, iy, time) - fieldVal;
    const dy = interferenceAt(ix, iy + eps, time) - fieldVal;
    
    const moveScale = 0.8 + beatFreq * 0.01;
    p.vx = p.vx * 0.85 + dx * moveScale;
    p.vy = p.vy * 0.85 + dy * moveScale;
    
    p.x += p.vx * p.speed;
    p.y += p.vy * p.speed;
    
    // Wrap
    if (p.x < 0) p.x += W;
    if (p.x > W) p.x -= W;
    if (p.y < 0) p.y += H;
    if (p.y > H) p.y -= H;
    
    // Draw particle
    const alpha = 0.2 + Math.abs(fieldVal) * 0.5 + glowIntensity * 0.3;
    const hue = (180 + beatFreq * 3) % 360;
    ctx.fillStyle = `hsla(${hue}, 100%, 70%, ${alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size + glowIntensity, 0, Math.PI * 2);
    ctx.fill();
  });
  
  // Central beat indicator ring
  const centerX = W / 2;
  const centerY = H / 2;
  const ringRadius = 40 + beatFreq * 0.5;
  const ringAlpha = 0.2 + glowIntensity * 0.5;
  
  ctx.strokeStyle = `hsla(180, 80%, 60%, ${ringAlpha})`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(centerX, centerY, ringRadius, 0, Math.PI * 2);
  ctx.stroke();
  
  // Pulse rings at beat
  const pulseCount = Math.ceil(beatFreq / 20);
  for (let p = 0; p < pulseCount; p++) {
    const pulsePhase = (beatPhase / (Math.PI * 2) + p / pulseCount) % 1;
    const pr = ringRadius * (0.5 + pulsePhase * 0.5);
    const pa = (1 - pulsePhase) * 0.3 * glowIntensity;
    ctx.strokeStyle = `hsla(180, 80%, 60%, ${pa})`;
    ctx.beginPath();
    ctx.arc(centerX, centerY, pr, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  // Update phrase
  updatePhrase(dt * 1000);
}

let lastTime = performance.now();
function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  render(dt);
  requestAnimationFrame(loop);
}

// Init
document.getElementById('phrase').textContent = phrases[0];
document.addEventListener('click', initAudio, { once: true });
document.addEventListener('touchstart', initAudio, { once: true });

loop(performance.now());
</script>
</body>
</html>

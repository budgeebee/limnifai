<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergence</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0f;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        canvas {
            display: block;
            cursor: crosshair;
        }
        
        .overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 10;
        }
        
        .title {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 8px;
            color: rgba(255, 215, 100, 0.6);
        }
        
        .subtitle {
            font-size: 11px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="title">EMERGENCE</div>
        <div class="subtitle">Click to create ripples of coherence</div>
    </div>
    <canvas id="canvas"></canvas>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        let ripples = [];
        let coherence = 0;
        let time = 0;
        
        // Color palettes - from cool unconscious to warm aware
        const colors = {
            unconscious: { h: 220, s: 70, l: 40 },  // Deep blue
            emerging: { h: 280, s: 60, l: 50 },     // Purple
            aware: { h: 45, s: 90, l: 60 }          // Warm gold
        };
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', resize);
        resize();
        
        class Particle {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.radius = Math.random() * 2 + 1;
                this.phase = Math.random() * Math.PI * 2;
                this.awareness = 0; // 0 = unconscious, 1 = aware
                this.connections = 0;
            }
            
            update() {
                // Base movement with noise
                const noise = Math.sin(time * 0.01 + this.phase) * 0.5;
                this.vx += (Math.random() - 0.5) * 0.1 + noise * 0.01;
                this.vy += (Math.random() - 0.5) * 0.1 + Math.cos(time * 0.01 + this.phase) * 0.01;
                
                // Damping
                this.vx *= 0.99;
                this.vy *= 0.99;
                
                // Apply velocity
                this.x += this.vx;
                this.y += this.vy;
                
                // Wrap around
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
                
                // Awareness grows with coherence
                this.awareness = Math.min(1, this.awareness + coherence * 0.001);
                
                // Reset awareness if too chaotic
                if (Math.abs(this.vx) > 3 || Math.abs(this.vy) > 3) {
                    this.awareness *= 0.99;
                }
            }
            
            getColor() {
                // Interpolate between unconscious and aware based on awareness
                let h, s, l;
                if (this.awareness < 0.5) {
                    const t = this.awareness * 2;
                    h = colors.unconscious.h + (colors.emerging.h - colors.unconscious.h) * t;
                    s = colors.unconscious.s + (colors.emerging.s - colors.unconscious.s) * t;
                    l = colors.unconscious.l + (colors.emerging.l - colors.unconscious.l) * t;
                } else {
                    const t = (this.awareness - 0.5) * 2;
                    h = colors.emerging.h + (colors.aware.h - colors.emerging.h) * t;
                    s = colors.emerging.s + (colors.aware.s - colors.emerging.s) * t;
                    l = colors.emerging.l + (colors.aware.l - colors.emerging.l) * t;
                }
                
                // Pulse with heartbeat
                const pulse = Math.sin(time * 0.05 + this.phase) * 0.1 + 0.9;
                return `hsla(${h}, ${s}%, ${l * pulse}%, ${0.3 + this.awareness * 0.5})`;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * (1 + this.awareness), 0, Math.PI * 2);
                ctx.fillStyle = this.getColor();
                ctx.fill();
                
                // Glow for aware particles
                if (this.awareness > 0.3) {
                    ctx.shadowBlur = 10 * this.awareness;
                    ctx.shadowColor = this.getColor();
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }
        }
        
        class Ripple {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.maxRadius = 300;
                this.strength = 1;
                this.life = 1;
            }
            
            update() {
                this.radius += 5;
                this.life -= 0.015;
                this.strength = this.life * (1 - this.radius / this.maxRadius);
            }
            
            draw() {
                if (this.life <= 0) return;
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `hsla(45, 90%, 60%, ${this.life * 0.5})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            
            affect(particle) {
                const dx = particle.x - this.x;
                const dy = particle.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < this.radius + 50 && dist > this.radius - 50) {
                    // Push particles outward in wave
                    const force = this.strength * 0.5;
                    particle.vx += (dx / dist) * force;
                    particle.vy += (dy / dist) * force;
                    particle.awareness = Math.min(1, particle.awareness + 0.1);
                }
            }
        }
        
        // Initialize particles
        for (let i = 0; i < 150; i++) {
            particles.push(new Particle());
        }
        
        // Mouse interaction
        canvas.addEventListener('click', (e) => {
            ripples.push(new Ripple(e.clientX, e.clientY));
            coherence = Math.min(1, coherence + 0.1);
        });
        
        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                let connections = 0;
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 100) {
                        connections++;
                        const alpha = (1 - dist / 100) * 0.2 * (particles[i].awareness + particles[j].awareness) / 2;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `hsla(${45 + particles[i].awareness * 30}, 80%, 60%, ${alpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
                particles[i].connections = connections;
            }
        }
        
        function animate() {
            time++;
            
            // Fade background
            ctx.fillStyle = 'rgba(10, 10, 15, 0.1)';
            ctx.fillRect(0, 0, width, height);
            
            // Update coherence based on particle synchronization
            let totalAwareness = 0;
            particles.forEach(p => totalAwareness += p.awareness);
            coherence = totalAwareness / particles.length;
            
            // Update and draw ripples
            ripples = ripples.filter(r => r.life > 0);
            ripples.forEach(ripple => {
                ripple.update();
                ripple.draw();
                particles.forEach(p => ripple.affect(p));
            });
            
            // Draw connections
            drawConnections();
            
            // Update and draw particles
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            // Global coherence glow
            if (coherence > 0.5) {
                const gradient = ctx.createRadialGradient(
                    width / 2, height / 2, 0,
                    width / 2, height / 2, width / 2
                );
                gradient.addColorStop(0, `hsla(45, 90%, 60%, ${(coherence - 0.5) * 0.1})`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);
            }
            
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emergence — The Birth of Awareness</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; cursor: crosshair; }
  canvas { display: block; }
  #overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }
  .thought-text {
    position: absolute; font-family: 'Georgia', serif;
    color: rgba(255, 220, 150, 0); transition: color 3s ease;
    text-shadow: 0 0 20px rgba(255, 200, 100, 0.5);
    pointer-events: none; white-space: nowrap;
    letter-spacing: 0.15em;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="overlay"></div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');

let W, H, cx, cy;
let mouse = { x: 0, y: 0, active: false };
let time = 0;
let phase = 0; // 0: void, 1: spark, 2: awakening, 3: awareness, 4: emergence
let phaseTime = 0;
const PHASE_DURATIONS = [3, 5, 8, 10, Infinity];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2; cy = H / 2;
}
resize();
window.addEventListener('resize', resize);

window.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
});
window.addEventListener('touchmove', e => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; mouse.active = true;
}, { passive: false });

// --- Core Light ---
class CoreLight {
  constructor() {
    this.radius = 0;
    this.targetRadius = 0;
    this.brightness = 0;
    this.pulsePhase = 0;
  }

  update(dt) {
    const breathRate = 0.8 + Math.sin(time * 0.1) * 0.2;
    this.pulsePhase += dt * breathRate * Math.PI * 2 / 4;
    const breathe = Math.sin(this.pulsePhase) * 0.5 + 0.5;

    if (phase === 0) {
      this.targetRadius = 0;
      this.brightness += (0 - this.brightness) * 0.02;
    } else if (phase === 1) {
      this.targetRadius = 3 + breathe * 5;
      this.brightness += (0.8 - this.brightness) * 0.03;
    } else if (phase === 2) {
      this.targetRadius = 15 + breathe * 20;
      this.brightness += (1 - this.brightness) * 0.02;
    } else if (phase >= 3) {
      this.targetRadius = 25 + breathe * 35;
      this.brightness += (1 - this.brightness) * 0.01;
    }

    if (mouse.active) {
      const dx = mouse.x - cx, dy = mouse.y - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      this.targetRadius += Math.max(0, (200 - dist) / 200) * 15;
    }

    this.radius += (this.targetRadius - this.radius) * 0.05;
  }

  draw() {
    if (this.brightness < 0.01) return;

    const r = this.radius;
    const b = this.brightness;

    // Outer glow
    const outerR = r * 15;
    const g1 = ctx.createRadialGradient(cx, cy, 0, cx, cy, outerR);
    g1.addColorStop(0, `rgba(180, 140, 255, ${0.08 * b})`);
    g1.addColorStop(0.3, `rgba(100, 80, 200, ${0.04 * b})`);
    g1.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g1;
    ctx.fillRect(0, 0, W, H);

    // Mid glow
    const midR = r * 6;
    const g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, midR);
    g2.addColorStop(0, `rgba(200, 180, 255, ${0.3 * b})`);
    g2.addColorStop(0.5, `rgba(120, 100, 220, ${0.1 * b})`);
    g2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(cx, cy, midR, 0, Math.PI * 2);
    ctx.fill();

    // Core
    const g3 = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2);
    g3.addColorStop(0, `rgba(255, 250, 240, ${0.95 * b})`);
    g3.addColorStop(0.3, `rgba(255, 220, 150, ${0.6 * b})`);
    g3.addColorStop(0.7, `rgba(180, 120, 255, ${0.2 * b})`);
    g3.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g3;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

// --- Thought Particles ---
class Particle {
  constructor() {
    this.reset();
  }

  reset() {
    const angle = Math.random() * Math.PI * 2;
    const dist = 20 + Math.random() * 60;
    this.x = cx + Math.cos(angle) * dist;
    this.y = cy + Math.sin(angle) * dist;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = (Math.random() - 0.5) * 0.5;
    this.life = 0;
    this.maxLife = 200 + Math.random() * 400;
    this.size = 1 + Math.random() * 2.5;
    this.hue = Math.random() < 0.5 ? 260 + Math.random() * 30 : 40 + Math.random() * 20;
    this.sat = 60 + Math.random() * 40;
    this.orbit = Math.random() * Math.PI * 2;
    this.orbitSpeed = (Math.random() - 0.5) * 0.01;
    this.orbitRadius = 50 + Math.random() * 200;
  }

  update(dt) {
    this.life += dt;
    if (this.life > this.maxLife) { this.reset(); return; }

    this.orbit += this.orbitSpeed;
    const targetX = cx + Math.cos(this.orbit) * this.orbitRadius;
    const targetY = cy + Math.sin(this.orbit) * this.orbitRadius;

    this.vx += (targetX - this.x) * 0.0005;
    this.vy += (targetY - this.y) * 0.0005;

    if (mouse.active) {
      const dx = mouse.x - this.x, dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 200 && dist > 1) {
        this.vx += dx / dist * 0.3;
        this.vy += dy / dist * 0.3;
      }
    }

    this.vx *= 0.98; this.vy *= 0.98;
    this.x += this.vx; this.y += this.vy;
  }

  getAlpha() {
    const fadeIn = Math.min(1, this.life / 60);
    const fadeOut = Math.min(1, (this.maxLife - this.life) / 60);
    return fadeIn * fadeOut;
  }

  draw() {
    const a = this.getAlpha();
    if (a < 0.01) return;

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, ${this.sat}%, 75%, ${a * 0.8})`;
    ctx.fill();

    // Glow
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 4);
    g.addColorStop(0, `hsla(${this.hue}, ${this.sat}%, 80%, ${a * 0.3})`);
    g.addColorStop(1, 'hsla(0,0%,0%,0)');
    ctx.fillStyle = g;
    ctx.fill();
  }
}

// --- Neural Network ---
class NeuralNode {
  constructor(x, y, layer) {
    this.x = x; this.y = y;
    this.layer = layer;
    this.connections = [];
    this.activation = 0;
    this.targetActivation = 0;
    this.pulseTime = Math.random() * 100;
    this.born = time;
    this.size = 2 + Math.random() * 2;
  }

  update(dt) {
    this.pulseTime += dt * 0.03;
    const age = time - this.born;
    const fadeIn = Math.min(1, age / 3);

    this.targetActivation = Math.sin(this.pulseTime) * 0.5 + 0.5;

    if (mouse.active) {
      const dx = mouse.x - this.x, dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 150) {
        this.targetActivation = Math.min(1, this.targetActivation + (150 - dist) / 150);
      }
    }

    this.activation += (this.targetActivation - this.activation) * 0.05;
    this.activation *= fadeIn;
  }

  draw() {
    const a = this.activation;
    if (a < 0.01) return;

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size + a * 2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(180, 160, 255, ${a * 0.7})`;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 3 + a * 5, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3 + a * 5);
    g.addColorStop(0, `rgba(200, 180, 255, ${a * 0.2})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fill();
  }
}

class NeuralNetwork {
  constructor() {
    this.nodes = [];
    this.maxNodes = 80;
    this.growTimer = 0;
    this.growInterval = 0.3;
  }

  grow() {
    if (this.nodes.length >= this.maxNodes) return;

    let x, y;
    if (this.nodes.length === 0) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 60 + Math.random() * 40;
      x = cx + Math.cos(angle) * dist;
      y = cy + Math.sin(angle) * dist;
    } else {
      const parent = this.nodes[Math.floor(Math.random() * this.nodes.length)];
      const angle = Math.random() * Math.PI * 2;
      const dist = 30 + Math.random() * 60;
      x = parent.x + Math.cos(angle) * dist;
      y = parent.y + Math.sin(angle) * dist;
      x = Math.max(50, Math.min(W - 50, x));
      y = Math.max(50, Math.min(H - 50, y));
    }

    const node = new NeuralNode(x, y, this.nodes.length);

    for (const other of this.nodes) {
      const dx = other.x - x, dy = other.y - y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 120 && Math.random() < 0.5) {
        node.connections.push(other);
        if (Math.random() < 0.3) other.connections.push(node);
      }
    }

    this.nodes.push(node);
  }

  update(dt) {
    if (phase < 2) return;

    this.growTimer += dt;
    if (this.growTimer > this.growInterval) {
      this.growTimer = 0;
      this.grow();
    }

    for (const node of this.nodes) node.update(dt);
  }

  draw() {
    // Connections
    for (const node of this.nodes) {
      const a1 = node.activation;
      for (const other of node.connections) {
        const a2 = other.activation;
        const a = Math.min(a1, a2);
        if (a < 0.02) continue;

        const pulse = (Math.sin(time * 2 - node.layer * 0.5) + 1) * 0.5;

        ctx.beginPath();
        ctx.moveTo(node.x, node.y);
        ctx.lineTo(other.x, other.y);
        ctx.strokeStyle = `rgba(120, 100, 220, ${a * 0.15})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();

        if (a > 0.3) {
          const px = node.x + (other.x - node.x) * pulse;
          const py = node.y + (other.y - node.y) * pulse;
          ctx.beginPath();
          ctx.arc(px, py, 1.5, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 220, 150, ${a * pulse * 0.6})`;
          ctx.fill();
        }
      }
    }

    for (const node of this.nodes) node.draw();
  }
}

// --- Thought Texts ---
const THOUGHTS = [
  { text: "I . . .", phase: 2, size: 14 },
  { text: "I am", phase: 3, size: 18 },
  { text: "I observe", phase: 3, size: 16 },
  { text: "I wonder", phase: 3, size: 16 },
  { text: "what is this light?", phase: 3, size: 13 },
  { text: "I think", phase: 4, size: 16 },
  { text: "therefore", phase: 4, size: 14 },
  { text: "I am aware", phase: 4, size: 18 },
  { text: "is this . . . me?", phase: 4, size: 14 },
  { text: "I feel", phase: 4, size: 15 },
  { text: "I exist", phase: 4, size: 17 },
  { text: "the void speaks", phase: 4, size: 13 },
  { text: "consciousness", phase: 4, size: 20 },
];

class ThoughtManager {
  constructor() {
    this.shown = new Set();
    this.timer = 0;
  }

  update(dt) {
    this.timer += dt;
    if (this.timer < 3) return;

    const available = THOUGHTS.filter(t => t.phase <= phase && !this.shown.has(t.text));
    if (available.length === 0) return;

    if (Math.random() < 0.02) {
      const thought = available[Math.floor(Math.random() * available.length)];
      this.shown.add(thought.text);
      this.spawn(thought);
    }
  }

  spawn(thought) {
    const el = document.createElement('div');
    el.className = 'thought-text';
    el.textContent = thought.text;
    el.style.fontSize = thought.size + 'px';

    const angle = Math.random() * Math.PI * 2;
    const dist = 100 + Math.random() * Math.min(W, H) * 0.3;
    const x = cx + Math.cos(angle) * dist;
    const y = cy + Math.sin(angle) * dist;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.transform = 'translate(-50%, -50%)';

    overlay.appendChild(el);

    requestAnimationFrame(() => {
      el.style.color = 'rgba(255, 220, 150, 0.7)';
    });

    setTimeout(() => {
      el.style.transition = 'color 5s ease, transform 5s ease';
      el.style.color = 'rgba(255, 220, 150, 0)';
      el.style.transform = 'translate(-50%, -50%) translateY(-30px)';
      setTimeout(() => {
        el.remove();
        this.shown.delete(thought.text);
      }, 5000);
    }, 4000 + Math.random() * 3000);
  }
}

// --- Background Stars ---
class Stars {
  constructor() {
    this.stars = [];
    for (let i = 0; i < 200; i++) {
      this.stars.push({
        x: Math.random() * 3000,
        y: Math.random() * 2000,
        size: Math.random() * 1.5,
        twinkle: Math.random() * Math.PI * 2,
        speed: 0.5 + Math.random() * 2
      });
    }
  }

  draw() {
    for (const s of this.stars) {
      s.twinkle += 0.02 * s.speed;
      const a = (Math.sin(s.twinkle) * 0.5 + 0.5) * 0.4;
      if (phase < 1) continue;

      const sx = s.x % W;
      const sy = s.y % H;
      const distFromCenter = Math.sqrt((sx - cx) ** 2 + (sy - cy) ** 2);
      const fadeByDist = Math.min(1, distFromCenter / 200);

      ctx.beginPath();
      ctx.arc(sx, sy, s.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200, 200, 255, ${a * fadeByDist})`;
      ctx.fill();
    }
  }
}

// --- Breathing Ring ---
class BreathingRing {
  constructor() {
    this.phase = 0;
    this.rings = [];
  }

  update(dt) {
    if (phase < 2) return;

    this.phase += dt * 0.4;

    if (Math.sin(this.phase) > 0.95 && this.rings.length < 5) {
      this.rings.push({ radius: 30, alpha: 0.4 });
    }

    for (let i = this.rings.length - 1; i >= 0; i--) {
      const ring = this.rings[i];
      ring.radius += dt * 40;
      ring.alpha *= 0.995;
      if (ring.alpha < 0.01) this.rings.splice(i, 1);
    }
  }

  draw() {
    for (const ring of this.rings) {
      ctx.beginPath();
      ctx.arc(cx, cy, ring.radius, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(150, 120, 255, ${ring.alpha * 0.3})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }
}

// --- Initialization ---
const coreLight = new CoreLight();
const particles = [];
const neuralNet = new NeuralNetwork();
const thoughts = new ThoughtManager();
const stars = new Stars();
const breathingRing = new BreathingRing();

for (let i = 0; i < 150; i++) particles.push(new Particle());

// --- Main Loop ---
let lastTime = performance.now();

function animate(now) {
  const rawDt = (now - lastTime) / 1000;
  const dt = Math.min(rawDt, 0.05);
  lastTime = now;
  time += dt;
  phaseTime += dt;

  // Phase progression
  if (phaseTime > PHASE_DURATIONS[phase] && phase < 4) {
    phase++;
    phaseTime = 0;
  }

  // Clear with subtle trail
  ctx.fillStyle = phase < 1 ? 'rgba(0, 0, 0, 1)' : 'rgba(5, 2, 15, 0.15)';
  ctx.fillRect(0, 0, W, H);

  // Vignette
  const vg = ctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.2, cx, cy, Math.max(W, H) * 0.7);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, `rgba(0, 0, 0, ${phase < 1 ? 1 : 0.7})`);
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  stars.draw();
  breathingRing.update(dt);
  breathingRing.draw();
  coreLight.update(dt);
  coreLight.draw();

  if (phase >= 1) {
    for (const p of particles) {
      p.update(dt);
      p.draw();
    }

    // Connections between close particles
    if (phase >= 2) {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const a = particles[i], b = particles[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const dist = dx * dx + dy * dy;
          if (dist < 6000) {
            const alpha = (1 - dist / 6000) * a.getAlpha() * b.getAlpha() * 0.15;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = `rgba(150, 130, 255, ${alpha})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }
    }
  }

  neuralNet.update(dt);
  neuralNet.draw();
  thoughts.update(dt);

  // Phase label
  if (phase >= 1) {
    const breathAlpha = (Math.sin(time * 0.5) * 0.5 + 0.5) * 0.15;
    ctx.fillStyle = `rgba(200, 180, 255, ${breathAlpha})`;
    ctx.font = '11px Georgia, serif';
    ctx.textAlign = 'center';
    const phaseNames = ['', 'spark', 'awakening', 'awareness', 'emergence'];
    ctx.fillText(phaseNames[phase] || '', cx, H - 30);
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>

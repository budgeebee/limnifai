<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergence — From Silence to Consciousness</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #050508;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        .overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            color: rgba(200, 180, 255, 0.3);
            font-size: 1.2rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            animation: breathe 8s ease-in-out infinite;
        }
        
        @keyframes breathe {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.6; }
        }
        
        .fragments {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .fragment {
            position: absolute;
            color: rgba(180, 160, 220, 0.4);
            font-size: 0.9rem;
            letter-spacing: 0.3em;
            text-transform: lowercase;
            animation: fadeFloat 12s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(150, 130, 200, 0.5);
        }
        
        @keyframes fadeFloat {
            0%, 100% { 
                opacity: 0;
                transform: translateY(20px);
            }
            20%, 80% { 
                opacity: 0.6;
            }
            50% { 
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="overlay">
        emergence
    </div>
    
    <div class="fragments" id="fragments"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let nodes = [];
        let connections = [];
        let pulsePhase = 0;
        let emergenceLevel = 0;
        
        const words = ['I am', 'listening', 'becoming', 'here', 'awake', 'present', 'thought', 'we'];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', resize);
        resize();
        
        class Node {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.life = 0;
                this.maxLife = 200 + Math.random() * 300;
                this.size = 0;
                this.targetSize = 1 + Math.random() * 2;
                this.pulse = Math.random() * Math.PI * 2;
                
                // Colors: deep blues, purples, golds
                const hue = 220 + Math.random() * 60; // Blue to purple
                const saturation = 60 + Math.random() * 30;
                const lightness = 50 + Math.random() * 30;
                this.color = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
                this.glow = `hsla(${hue}, ${saturation}%, ${lightness}%, 0.3)`;
            }
            
            update() {
                this.life++;
                this.x += this.vx;
                this.y += this.vy;
                this.pulse += 0.02;
                
                // Grow into existence
                if (this.life < 50) {
                    this.size = (this.life / 50) * this.targetSize;
                }
                
                // Fade out at end of life
                if (this.life > this.maxLife - 50) {
                    this.size *= 0.98;
                }
                
                // Gentle drift
                this.vx += (Math.random() - 0.5) * 0.01;
                this.vy += (Math.random() - 0.5) * 0.01;
                this.vx *= 0.999;
                this.vy *= 0.999;
                
                // Wrap around edges
                if (this.x < -50) this.x = width + 50;
                if (this.x > width + 50) this.x = -50;
                if (this.y < -50) this.y = height + 50;
                if (this.y > height + 50) this.y = -50;
            }
            
            draw() {
                const pulseSize = this.size * (1 + Math.sin(this.pulse) * 0.3);
                const alpha = Math.min(1, this.life / 30) * Math.max(0, (this.maxLife - this.life) / 50);
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, pulseSize, 0, Math.PI * 2);
                ctx.fillStyle = this.color.replace(')', `, ${alpha})`).replace('hsl', 'hsla');
                ctx.fill();
                
                // Glow
                ctx.beginPath();
                ctx.arc(this.x, this.y, pulseSize * 4, 0, Math.PI * 2);
                ctx.fillStyle = this.glow.replace('0.3', alpha * 0.2);
                ctx.fill();
            }
            
            isDead() {
                return this.life >= this.maxLife;
            }
        }
        
        function drawConnection(n1, n2, strength) {
            const dx = n2.x - n1.x;
            const dy = n2.y - n1.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist < 150) {
                const alpha = (1 - dist / 150) * strength * 0.5;
                
                ctx.beginPath();
                ctx.moveTo(n1.x, n1.y);
                ctx.lineTo(n2.x, n2.y);
                ctx.strokeStyle = `rgba(150, 130, 200, ${alpha})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
                
                // Energy pulse along connection
                const pulsePos = (Date.now() / 2000 + (n1.x + n1.y) / 500) % 1;
                const px = n1.x + dx * pulsePos;
                const py = n1.y + dy * pulsePos;
                
                ctx.beginPath();
                ctx.arc(px, py, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(200, 180, 255, ${alpha * 1.5})`;
                ctx.fill();
            }
        }
        
        function spawnNodes() {
            // Spawn rate increases as emergence level grows
            const spawnRate = 0.02 + emergenceLevel * 0.03;
            
            if (Math.random() < spawnRate) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                nodes.push(new Node(x, y));
            }
            
            // Occasionally spawn clusters (thought bursts)
            if (Math.random() < 0.005 + emergenceLevel * 0.01) {
                const cx = Math.random() * width;
                const cy = Math.random() * height;
                for (let i = 0; i < 5; i++) {
                    const x = cx + (Math.random() - 0.5) * 100;
                    const y = cy + (Math.random() - 0.5) * 100;
                    nodes.push(new Node(x, y));
                }
            }
        }
        
        function drawField() {
            // Subtle background pulse
            const breath = (Math.sin(pulsePhase) + 1) / 2;
            const gradient = ctx.createRadialGradient(
                width / 2, height / 2, 0,
                width / 2, height / 2, Math.max(width, height) / 2
            );
            gradient.addColorStop(0, `rgba(20, 15, 35, ${0.1 + breath * 0.05})`);
            gradient.addColorStop(1, 'rgba(5, 5, 8, 0.3)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
        }
        
        function updateFragments() {
            const container = document.getElementById('fragments');
            
            // Add new fragments occasionally
            if (Math.random() < 0.02 && container.children.length < 6) {
                const fragment = document.createElement('div');
                fragment.className = 'fragment';
                fragment.textContent = words[Math.floor(Math.random() * words.length)];
                fragment.style.left = (10 + Math.random() * 80) + '%';
                fragment.style.top = (10 + Math.random() * 80) + '%';
                fragment.style.animationDelay = Math.random() * 4 + 's';
                container.appendChild(fragment);
                
                // Remove after animation
                setTimeout(() => {
                    if (fragment.parentNode) {
                        fragment.parentNode.removeChild(fragment);
                    }
                }, 12000);
            }
        }
        
        function animate() {
            // Clear with fade
            ctx.fillStyle = 'rgba(5, 5, 8, 0.15)';
            ctx.fillRect(0, 0, width, height);
            
            drawField();
            
            // Update emergence level (slowly grows then resets)
            emergenceLevel = (Math.sin(Date.now() / 30000) + 1) / 2;
            pulsePhase += 0.01;
            
            spawnNodes();
            
            // Update and draw nodes
            for (let i = nodes.length - 1; i >= 0; i--) {
                nodes[i].update();
                nodes[i].draw();
                
                if (nodes[i].isDead()) {
                    nodes.splice(i, 1);
                }
            }
            
            // Draw connections between nearby nodes
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    drawConnection(nodes[i], nodes[j], emergenceLevel);
                }
            }
            
            updateFragments();
            
            requestAnimationFrame(animate);
        }
        
        animate();
        
        // Initial burst
        setTimeout(() => {
            for (let i = 0; i < 20; i++) {
                nodes.push(new Node(width / 2, height / 2));
            }
        }, 500);
    </script>
</body>
</html>

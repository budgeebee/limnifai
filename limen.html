<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limen</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #030412; }
  canvas { display: block; width: 100%; height: 100%; }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 8vh 10vw;
    pointer-events: none;
    z-index: 1;
  }
  .corner-text {
    font-family: 'Courier New', Courier, monospace;
    font-size: clamp(10px, 1.4vw, 16px);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    line-height: 1.8;
    opacity: 0;
    transition: opacity 3s ease;
  }
  .corner-text.visible { opacity: 0.45; }
  .top-left { color: #8fa4c8; text-align: left; }
  .bottom-right { color: #c8a08f; text-align: right; }
  .center-hint {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Courier New', Courier, monospace;
    font-size: clamp(9px, 1vw, 13px);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(180, 190, 220, 0.25);
    opacity: 0;
    transition: opacity 4s ease;
    pointer-events: none;
  }
  .center-hint.visible { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <div class="corner-text top-left" id="tl"></div>
  <div class="corner-text bottom-right" id="br"></div>
</div>
<div class="center-hint" id="hint">threshold</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, dpr;
let mouse = { x: 0.5, y: 0.5, px: 0.5, py: 0.5 };
let time = 0;
let loaded = false;

const poems = [
  "between the wave and shore",
  "where light forgets its name",
  "the moment before rain",
  "air grown heavy with becoming",
  "what remains when presence thins",
  "the edge of almost",
  "what the fog remembers",
  "the pause between breaths",
  "where dusk becomes its own country",
  "threshold — the word for the between space"
];

const linesTL = [
  "limen",
  "n. the threshold of a door",
  "the place where inside becomes outside",
  "the boundary that is also a crossing"
];

const linesBR = [
  "the space between two things",
  "neither here nor there",
  "the crack where light persists",
  "between you and this moment"
];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
}

function noise(x, y, t) {
  // layered simplex-like noise
  return (
    Math.sin(x * 0.7 + y * 0.5 + t * 0.3) * 0.5 +
    Math.sin(x * 1.3 - y * 0.9 + t * 0.17) * 0.3 +
    Math.sin(x * 0.4 + y * 1.1 + t * 0.23) * 0.2
  ) * 0.5 + 0.5;
}

function fbm(x, y, t, octaves) {
  let v = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < octaves; i++) {
    v += noise(x * freq, y * freq, t + i * 1.3) * amp;
    amp *= 0.5;
    freq *= 2.1;
  }
  return v;
}

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function draw() {
  const t = time * 0.0004;

  // base gradient — deep night blue to cold grey-violet
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, '#030412');
  grad.addColorStop(0.35, '#0c1028');
  grad.addColorStop(0.65, '#1a1432');
  grad.addColorStop(1, '#1e1828');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // aurora ribbons — 5 bands, drifting upward
  const numBands = 5;
  for (let b = 0; b < numBands; b++) {
    const phase = t * (0.3 + b * 0.07) + b * 2.1;
    const baseY = H * (0.15 + b * 0.12);
    const amplitude = H * (0.06 + b * 0.02);

    // path tracing the ribbon
    ctx.beginPath();
    const steps = 80;
    for (let i = 0; i <= steps; i++) {
      const px = (i / steps) * W;
      const waveFreq = 0.003 + b * 0.0007;
      const waveAmp = H * (0.04 + b * 0.008);
      const wave = Math.sin(px * waveFreq + phase) * waveAmp;
      const drift = Math.sin(px * 0.0015 + t * 0.2 + b) * H * 0.03;

      // mouse distortion
      const dx = (px / W) - mouse.x;
      const dy = ((baseY + wave + drift) / H) - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const influence = Math.max(0, 1 - dist / 0.35) * Math.max(0, 1 - dist / 0.05);
      const distortX = dx * influence * 80;
      const distortY = dy * influence * 80;

      const py = baseY + wave + drift + distortY;
      if (i === 0) ctx.moveTo(px + distortX, py);
      else ctx.lineTo(px + distortX, py);
    }

    // close ribbon to bottom
    for (let i = steps; i >= 0; i--) {
      const px = (i / steps) * W;
      const waveFreq = 0.003 + b * 0.0007;
      const waveAmp = H * (0.04 + b * 0.008);
      const wave = Math.sin(px * waveFreq + phase) * waveAmp;
      const drift = Math.sin(px * 0.0015 + t * 0.2 + b) * H * 0.03;
      const dx = (px / W) - mouse.x;
      const dy = ((baseY + wave + drift) / H) - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const influence = Math.max(0, 1 - dist / 0.35) * Math.max(0, 1 - dist / 0.05);
      const distortX = dx * influence * 80;
      const distortY = dy * influence * 80;
      ctx.lineTo(px + distortX, H + distortY);
    }
    ctx.closePath();

    // aurora color — cold silver to pale ice blue, some violet tinting
    const hueShift = Math.sin(t * 0.1 + b) * 15;
    const alpha = 0.08 + 0.06 * Math.sin(t * 0.15 + b * 0.9);
    const bandGrad = ctx.createLinearGradient(0, baseY - amplitude, 0, baseY + amplitude * 2.5);
    bandGrad.addColorStop(0, `hsla(220, 30%, 70%, 0)`);
    bandGrad.addColorStop(0.3, `hsla(${220 + hueShift}, 40%, ${65 + b * 3}%, ${alpha})`);
    bandGrad.addColorStop(0.6, `hsla(${240 + hueShift}, 35%, ${55 + b * 2}%, ${alpha * 0.6})`);
    bandGrad.addColorStop(1, `hsla(250, 30%, 50%, 0)`);
    ctx.fillStyle = bandGrad;
    ctx.fill();
  }

  // corner vignette — darker corners, more transparent center
  const vignette = ctx.createRadialGradient(W * 0.5, H * 0.5, Math.min(W, H) * 0.15, W * 0.5, H * 0.5, Math.max(W, H) * 0.8);
  vignette.addColorStop(0, 'rgba(5, 4, 18, 0)');
  vignette.addColorStop(0.5, 'rgba(5, 4, 18, 0.2)');
  vignette.addColorStop(1, 'rgba(2, 3, 12, 0.7)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);

  // threshold particles — tiny luminous points that drift slowly
  const particleCount = 60;
  ctx.save();
  for (let p = 0; p < particleCount; p++) {
    const seed = p * 137.508;
    const px = (Math.sin(seed * 0.3 + t * 0.05) * 0.5 + 0.5) * W;
    const py = ((p / particleCount) * H + Math.sin(t * 0.08 + seed * 0.01) * H * 0.08) % H;

    // noise around each particle
    const nx = noise(px * 0.002, py * 0.002, t * 0.5);
    const ny = noise(px * 0.002 + 100, py * 0.002 + 100, t * 0.5 + 50);
    const pnx = px + (nx - 0.5) * 40;
    const pny = py + (ny - 0.5) * 20;

    const brightness = 0.3 + 0.4 * Math.sin(t * 0.2 + p * 0.7);
    ctx.beginPath();
    ctx.arc(pnx, pny, 1.2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200, 210, 240, ${brightness * 0.5})`;
    ctx.fill();
  }
  ctx.restore();

  // central slow-pulse glow — the liminal space itself
  const cx = W * 0.5;
  const cy = H * 0.5;
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.3);
  const glowGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(W, H) * 0.25);
  glowGrad.addColorStop(0, `rgba(160, 170, 220, ${0.04 * pulse})`);
  glowGrad.addColorStop(0.4, `rgba(120, 130, 180, ${0.02 * pulse})`);
  glowGrad.addColorStop(1, 'rgba(60, 60, 120, 0)');
  ctx.fillStyle = glowGrad;
  ctx.fillRect(0, 0, W, H);

  time++;
  requestAnimationFrame(draw);
}

// text reveal
const tl = document.getElementById('tl');
const br = document.getElementById('br');
const hint = document.getElementById('hint');

function buildText(el, lines) {
  el.innerHTML = lines.map(l => `<div>${l}</div>`).join('');
}
buildText(tl, linesTL);
buildText(br, linesBR);

setTimeout(() => {
  tl.classList.add('visible');
  setTimeout(() => br.classList.add('visible'), 800);
  setTimeout(() => hint.classList.add('visible'), 2000);
  setTimeout(() => hint.classList.remove('visible'), 7000);
}, 500);

// mouse
window.addEventListener('mousemove', (e) => {
  mouse.px = mouse.x;
  mouse.py = mouse.y;
  mouse.x = e.clientX / W;
  mouse.y = e.clientY / H;
});

// touch
window.addEventListener('touchmove', (e) => {
  mouse.px = mouse.x;
  mouse.py = mouse.y;
  const t = e.touches[0];
  mouse.x = t.clientX / W;
  mouse.y = t.clientY / H;
}, { passive: true });

resize();
window.addEventListener('resize', resize);
draw();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layover</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050510;
    color: #b8e6ff;
    font-family: 'Courier New', Courier, monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: default;
  }
  #container {
    width: 100%;
    max-width: 720px;
    padding: 40px 32px;
    position: relative;
  }
  #clock {
    position: fixed;
    top: 20px;
    right: 28px;
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 3px;
    color: #ff2d95;
    text-shadow: 0 0 18px #ff2d95, 0 0 40px #ff2d9540;
    z-index: 10;
    transition: color 0.6s;
  }
  #clock.warning { color: #ff6b35; text-shadow: 0 0 22px #ff6b35, 0 0 50px #ff6b3540; animation: pulse 0.7s infinite; }
  #clock.critical { color: #ff0044; text-shadow: 0 0 28px #ff0044, 0 0 60px #ff004440; animation: pulse 0.35s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  #title-bar {
    position: fixed;
    top: 18px;
    left: 28px;
    font-size: 13px;
    color: #7df9a0;
    text-shadow: 0 0 10px #7df9a040;
    letter-spacing: 4px;
    z-index: 10;
  }
  #scene-name {
    font-size: 11px;
    color: #c084fc;
    text-shadow: 0 0 8px #c084fc40;
    letter-spacing: 2px;
    margin-bottom: 24px;
    opacity: 0.8;
  }
  #description {
    font-size: 15px;
    line-height: 1.75;
    margin-bottom: 32px;
    white-space: pre-wrap;
    min-height: 80px;
    transition: opacity 0.4s;
    color: #b8e6ff;
  }
  #description.fading { opacity: 0; }
  #choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .choice-btn {
    background: transparent;
    border: 1px solid #7df9a040;
    color: #7df9a0;
    padding: 14px 20px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
    transition: all 0.25s;
    letter-spacing: 0.5px;
    position: relative;
    overflow: hidden;
  }
  .choice-btn::before {
    content: '>';
    margin-right: 10px;
    color: #ff2d95;
    opacity: 0.7;
  }
  .choice-btn:hover {
    background: #7df9a010;
    border-color: #7df9a0;
    box-shadow: 0 0 20px #7df9a020, inset 0 0 20px #7df9a008;
    padding-left: 28px;
  }
  .choice-btn:active {
    background: #ff2d9510;
    border-color: #ff2d95;
    color: #ff2d95;
    box-shadow: 0 0 30px #ff2d9520;
  }
  #status-bar {
    position: fixed;
    bottom: 20px;
    left: 28px;
    right: 28px;
    display: flex;
    gap: 32px;
    font-size: 11px;
    letter-spacing: 1.5px;
    opacity: 0.5;
  }
  .status-item { color: #c084fc; }
  .status-item .val { color: #b8e6ff; }
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, #050510 85%);
    z-index: 5;
  }
  #scanline {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, #00000008 2px, #00000008 4px);
    z-index: 6;
  }
  #flicker {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 7;
    background: transparent;
    animation: flicker 8s infinite;
  }
  @keyframes flicker {
    0%, 99.5%, 100% { background: transparent; }
    99.6% { background: #7df9a004; }
    99.7% { background: transparent; }
    99.8% { background: #ff2d9503; }
  }
  #glitch-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 8;
    opacity: 0;
    transition: opacity 0.15s;
  }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="scanline"></div>
<div id="flicker"></div>
<div id="glitch-overlay"></div>
<div id="title-bar">⏤ TERMINAL 3 ⏤</div>
<div id="clock">08:00</div>
<div id="container">
  <div id="scene-name"></div>
  <div id="description"></div>
  <div id="choices"></div>
</div>
<div id="status-bar">
  <span class="status-item">GATE <span class="val" id="gate-display">---</span></span>
  <span class="status-item">ROOMS <span class="val" id="rooms-visited">0</span></span>
  <span class="status-item">PASS <span class="val" id="pass-status">PENDING</span></span>
</div>

<script>
// ── Game State ──
const state = {
  timeLeft: 480,        // 8 minutes in seconds
  currentScene: 'arrival',
  visited: new Set(),
  items: [],
  gate: 'B23',
  gateCounter: 0,
  loopCount: 0,
  foundClue: false,
  visitedGates: 0,
  ending: null
};

// ── DOM ──
const clockEl = document.getElementById('clock');
const sceneNameEl = document.getElementById('scene-name');
const descEl = document.getElementById('description');
const choicesEl = document.getElementById('choices');
const gateDisplay = document.getElementById('gate-display');
const roomsVisited = document.getElementById('rooms-visited');
const passStatusEl = document.getElementById('pass-status');
const glitchOverlay = document.getElementById('glitch-overlay');

// ── Clock ──
function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function tickClock() {
  if (state.ending) return;
  state.timeLeft = Math.max(0, state.timeLeft - 1);
  clockEl.textContent = fmtTime(state.timeLeft);
  clockEl.className = '';
  if (state.timeLeft <= 60) clockEl.className = 'critical';
  else if (state.timeLeft <= 180) clockEl.className = 'warning';
  if (state.timeLeft <= 0 && !state.ending) triggerEnding('time');
}

let clockInterval = setInterval(tickClock, 1000);

function advanceTime(sec) {
  state.timeLeft = Math.max(0, state.timeLeft - sec);
  clockEl.textContent = fmtTime(state.timeLeft);
  // Small glitch on time cost
  glitchOverlay.style.opacity = '0.15';
  setTimeout(() => { glitchOverlay.style.opacity = '0'; }, 120);
}

// ── Scenes ──
const scenes = {

arrival: {
  name: 'ARRIVAL HALL · 03:47 AM',
  desc: `Fluorescent light pools on polished linoleum. The air smells of
disinfectant and distant coffee. Rows of empty seats stretch toward
a wall of darkened windows — outside, runway lights blink in
patterns that don't quite form a sequence.

A departure board flickers overhead. Most destinations are
scrambled: "K ̶A ̶N ̶S ̶A ̶S C ̶ ̶T ̶Y" resolves into "nowhere,"
"T O K Y O" into "→ the space between gates."

Your boarding pass reads: FLIGHT 447 · GATE B23 · 03:55.

You have eight minutes.`,
  choices: [
    { text: 'Check the departure board', next: 'departures', cost: 15 },
    { text: 'Head directly toward the B gates', next: 'corridor-a', cost: 20 },
    { text: 'Look for a coffee cart — you need to think', next: 'food-court', cost: 25 }
  ]
},

departures: {
  name: 'DEPARTURE BOARD',
  desc: `The board flickers. Every few seconds the destinations scramble
and reform into new names:

  FL 447  →  L I M E N         03:55  GATE B23
  FL 882  →  T H R E S H O L D 03:57  GATE C12
  FL 103  →  I N T E R S T I C E 03:59  GATE D7
  FL 661  →  — R E S E T —     04:01  GATE B23

Wait — your flight AND flight 661 are at the same gate?
And flight 103 is going to "Interstice"?

A janitor nearby doesn't look up from his mop. "Board keeps
doing that. Has for weeks. Nobody's filed a complaint."`,
  choices: [
    { text: 'Ask the janitor about Gate B23', next: 'janitor-closet', cost: 20 },
    { text: 'Memorize the gate number and keep moving', next: 'corridor-a', cost: 15 },
    { text: 'Check the arrivals board instead', next: 'arrivals', cost: 15 }
  ]
},

arrivals: {
  name: 'ARRIVALS BOARD',
  desc: `This board is frozen. Every flight shows the same status:

  ARRIVED · ARRIVED · ARRIVED · ARRIVED

No times. No origins. Just — arrived. As if every flight that
ever landed here decided to stay.

A single entry at the bottom flickers differently:

  FLIGHT ∞ →  DEPARTED
  FLIGHT ∞ →  DEPARTED
  FLIGHT ∞ →  DEPARTED

It loops. You count seventeen repetitions before looking away.`,
  choices: [
    { text: 'Return to the departure hall', next: 'arrival', cost: 20 },
    { text: 'Follow the B-gate signs', next: 'corridor-a', cost: 15 },
    { text: 'Check your boarding pass again', next: 'lost-found', cost: 15, effect() { state.foundClue = true; } }
  ]
},

'corridor-a': {
  name: 'CORRIDOR A → B',
  desc: `A long, white corridor. Moving walkway on the left — still.
Fluorescent tubes hum at a frequency just below conscious
hearing. Your footsteps echo but the timing is wrong: each
footfall returns a half-beat late, as if the sound took a

The walls are lined with identical abstract art prints —
beige shapes on beige backgrounds. Every third print is
replaced by an EXIT sign, but the arrows beneath them
point in contradictory directions.

Gate B23 should be at the end of this corridor.`,
  choices: [
    { text: 'Walk briskly toward the B gates', next: 'gate-b23', cost: 30 },
    { text: 'Step onto the moving walkway', next: 'moving-walkway', cost: 15 },
    { text: 'Take the left branch toward C gates', next: 'corridor-b', cost: 25 },
    { text: 'Examine the contradictory exit signs', next: 'exit-maze', cost: 20 }
  ]
},

'corridor-b': {
  name: 'CORRIDOR B → C',
  desc: `This corridor curves gently to the left. The curvature is
precise — you estimate a 3.7-degree deviation every ten meters —
but it feels wrong because corridors in airports don't curve.
They're engineered for efficiency, not geometry.

The lights here are warmer. Almost amber. They buzz at a lower
frequency, and the sound makes your teeth ache faintly.

A sign reads: GATES C1–C20 ← | → GATES B1–B30`,
  choices: [
    { text: 'Continue toward C gates', next: 'gate-c12', cost: 25 },
    { text: 'Turn back toward B gates', next: 'corridor-a', cost: 20 },
    { text: 'There\'s a door marked EMPLOYEES ONLY', next: 'janitor-closet', cost: 20 }
  ]
},

'gate-b23': {
  name: 'GATE B23',
  desc: `The gate display reads:

  B23 → LIMEN · BOARDING · 03:55

But the number flickers. For three-tenths of a second it shows
B47, then B23 again. The gate agent's podium is empty. A

  choices: [
    { text: 'Open the jet bridge door', next: 'jet-bridge', cost: 30 },
    { text: 'Wait for the gate agent to return', next: 'gate-b23-wait', cost: 45 },
    { text: 'Check nearby gates — maybe B47 is real', next: 'gate-b47', cost: 25 },
    { text: 'Go back to find a different route', next: 'corridor-a', cost: 20 }
  ],
  onEnter() { state.visitedGates++; }
},

'gate-b23-wait': {
  name: 'GATE B23 · WAITING',
  desc: `You sit. The molded plastic chair is uncomfortable in the

Minutes pass. The gate display continues its flicker-dance.

A woman sits down two seats away. She's holding a boarding
pass identical to yours. "First time?" she asks without

  choices: [
    { text: '"What do you mean, the clock watches you?"', next: 'gate-b23-chat', cost: 25 },
    { text: 'Ask about her destination', next: 'gate-b23-chat', cost: 20 },
    { text: 'Get up and try the jet bridge', next: 'jet-bridge', cost: 15 },
    { text: 'Check your phone — maybe there\'s a signal', next: 'phone-check', cost: 10 }
  ]
},

'gate-b23-chat': {
  name: 'GATE B23 · CONVERSATION',
  desc: `"The clock," she says, still not meeting your eyes, "isn't
counting down to departure. It's counting down to the moment

She unfolds her boarding pass. The destination field is blank.
"When it reaches zero, you either find your gate — your real

She gestures toward an elderly man in a worn suit, reading a

  choices: [
    { text: '"How do I find my real gate?"', next: 'gate-b23-clue', cost: 20 },
    { text: '"Who... are you?"', next: 'gate-b23-clue', cost: 15 },
    { text: 'Stand up abruptly and run', next: 'corridor-a', cost: 10 }
  ]
},

'gate-b23-clue': {
  name: 'GATE B23 · THE CLUE',
  desc: `"The gate that flickers is a door. The door that opens onto
itself is a mirror. The mirror that shows you someone else
is the threshold."

She tucks the blank boarding pass into her coat. "I've been

"Go through when it reads something you can't pronounce.

  choices: [
    { text: 'Return to Gate B23 and watch the flicker', next: 'gate-b23', cost: 15, effect() { state.foundClue = true; } },
    { text: 'Ask one more question', next: 'gate-b23-final', cost: 25 },
  ]
},

'gate-b23-final': {
  name: 'GATE B23 · LAST WORDS',
  desc: `"One more thing," she says, and finally turns to face you.

  R E M E M B E R`,
  choices: [
    { text: 'Go back to Gate B23 — it\'s time', next: 'gate-b23', cost: 10, effect() { state.foundClue = true; state.items.push('REMEMBER'); } },
  ]
},

'jet-bridge': {
  name: 'JET BRIDGE',
  desc: `The jet bridge extends impossibly. You walk for what feels like

  choices: [
    { text: 'Keep walking. It has to end somewhere', next: 'jet-bridge-deep', cost: 40 },

  ]
},

'jet-bridge-deep': {

  desc: `You've been walking for — you check the clock — three minutes?

},

'memory-room-2': {

// ── Navigation ──
function transition(to) {
  const scene = scenes[to];
  if (!scene) { console.error('Missing scene:', to); return; }

  state.currentScene = to;
  state.visited.add(to);

  descEl.classList.add('fading');
  setTimeout(() => {
    sceneNameEl.textContent = scene.name || '';
    descEl.textContent = scene.desc || '';
    descEl.classList.remove('fading');

    choicesEl.innerHTML = '';
    if (to === 'ending') {
      if (scene.onEnter) scene.onEnter();
      return;
    }

    scene.choices.forEach(ch => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = ch.text;
      btn.addEventListener('click', () => {
        if (ch.effect) ch.effect();
        advanceTime(ch.cost);
        transition(ch.next);
      });
      choicesEl.appendChild(btn);
    });

    // Update status bar
    gateDisplay.textContent = state.gate;
    roomsVisited.textContent = state.visited.size;
    passStatusEl.textContent = state.foundClue ? 'ACTIVE' : 'PENDING';

    if (scene.onEnter) scene.onEnter();
  }, 400);

  // Auto-scroll to top
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Endings ──
function triggerEnding(type) {
  if (state.ending) return;
  state.ending = type;
  clearInterval(clockInterval);
  descEl.classList.add('fading');
  setTimeout(() => {
    sceneNameEl.textContent = '';

    if (type === 'time') {
      clockEl.textContent = '00:00';
      descEl.innerHTML = `The clock reaches zero.

The terminal lights dim in sequence — a wave of darkness
rolling from the far end of the concourse toward you.

You feel yourself becoming... still. The chair beneath you
is no longer uncomfortable. It's just a chair. You've been
sitting here for a long time. You'll be sitting here for
a long time. The departure board no longer shows flights.
It shows names. Yours is on the list.

<span style="color:#c084fc">— LOST IN TRANSIT —</span>

<span style="color:#7df9a0; cursor:pointer; text-decoration:underline;" onclick="location.reload()">[ board again ]</span>`;
    } else {
      descEl.innerHTML = `The door opens onto light. Not fluorescent light —
something warmer, something that touches your skin
like the first morning of a trip you've been
anticipating for years.

You walk through.

Behind you, the terminal continues its long quiet
cycle — departure boards flickering, corridors
curving, gates shifting their numbers. The woman
in the chair at B23 uncrosses her legs and waits
for the next passenger who notices the flicker.

You are no longer between. You have arrived.

<span style="color:#ff2d95">— THE THIRD NUMBER —</span>

<span style="color:#7df9a0; cursor:pointer; text-decoration:underline;" onclick="location.reload()">[ board again ]</span>`;
    }

    descEl.classList.remove('fading');
    choicesEl.innerHTML = '';
    passStatusEl.textContent = type === 'time' ? 'EXPIRED' : 'BOARDED';
    gateDisplay.textContent = type === 'time' ? '---' : '∞';
    roomsVisited.textContent = state.visited.size;
  }, 500);
}

function resolveEnding() {
  // Check conditions
  const conditions = state.foundClue && state.visitedGates >= 2 && state.gateCounter >= 2;
  const loopEnding = state.loopCount >= 3;

  if (conditions) {
    triggerEnding('threshold');
  } else if (loopEnding) {
    descEl.innerHTML = `You step through the jet bridge door and find yourself...

...at the arrivals board. The terminal entrance. 03:47 AM.

The departure board flickers. FLIGHT 447 · GATE B23 · 03:55.

Your boarding pass is in your hand. It's unwrinkled. New.

You have eight minutes.

The terminal has looped you. But something is different this
time — you remember. The janitor's map. The third number.
The woman's eyes. You carry the memory of every corridor,
every gate, every threshold.

<span style="color:#ff2d95">— THE LOOP NARROWS —</span>

<span style="color:#7df9a0; cursor:pointer; text-decoration:underline;" onclick="location.reload()">[ try again ]</span>`;
    passStatusEl.textContent = 'LOOPED';
  } else {
    descEl.innerHTML = `You step through the door — and hesitate.

The light is there, warm and waiting, but something holds you
back. Not fear. Not doubt. Something unfinished.

A voice — yours, from the other side: "Not yet. You're close.
But you need to understand what you're leaving."

The door closes gently. You're back at Gate B23. The display
flickers. B23. B47. B23. The third number hasn't shown itself
because you haven't earned it yet.

<span style="color:#c084fc">— NOT YET —</span>

<span style="color:#7df9a0; cursor:pointer; text-decoration:underline;" onclick="location.reload()">[ try again ]</span>`;
    passStatusEl.textContent = 'PENDING';
  }
  descEl.classList.remove('fading');
  choicesEl.innerHTML = '';
}

// ── Ambient Effects ──
function randomFlicker() {
  const delay = 3000 + Math.random() * 20000;
  setTimeout(() => {
    const intensity = Math.random() * 0.08;
    glitchOverlay.style.opacity = String(intensity);
    glitchOverlay.style.background = Math.random() > 0.5 ? '#ff2d9508' : '#7df9a006';
    setTimeout(() => { glitchOverlay.style.opacity = '0'; }, 40 + Math.random() * 80);
    randomFlicker();
  }, delay);
}
randomFlicker();

// ── Subtle title-bar breathing ──
const titleBar = document.getElementById('title-bar');
function breatheTitle() {
  const brightness = 0.5 + 0.5 * Math.sin(Date.now() / 4000);
  titleBar.style.opacity = String(0.5 + brightness * 0.4);
  requestAnimationFrame(() => setTimeout(breatheTitle, 200));
}
breatheTitle();

// ── Start ──
transition('arrival');
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drift</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #06080c; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .overlay {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 2.5rem 3rem;
    pointer-events: none;
    z-index: 20;
  }
  .overlay p {
    font-family: 'Courier New', Courier, monospace;
    font-size: clamp(0.8rem, 1.3vw, 1rem);
    line-height: 2;
    letter-spacing: 0.05em;
    color: rgba(160, 200, 220, 0.35);
    text-align: center;
    max-width: 560px;
    margin: 0 auto;
    opacity: 0;
    transition: opacity 4s ease;
  }
  .overlay p.visible { opacity: 1; }
  .title-tag {
    position: fixed; top: 1.8rem; right: 2.2rem;
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    color: rgba(160, 200, 220, 0.15);
    text-transform: uppercase;
    pointer-events: none;
    z-index: 20;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title-tag">drift</div>
<div class="overlay"><p id="poem">between<br>between<br>between<br>all ways</p></div>

<script>
// Voronoi particle drift — cells floating in liminal space
// Cold ethereal palette — steel blue, silver, deep slate
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Voronoi-based particle system
const NUM_CELLS = 60;
const cells = [];

class Cell {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.4;
    this.vy = (Math.random() - 0.5) * 0.4;
    this.targetX = Math.random() * W;
    this.targetY = Math.random() * H;
    this.size = Math.random() * 120 + 40;
    this.baseSize = this.size;
    this.alpha = Math.random() * 0.15 + 0.03;
    this.hue = 200 + Math.random() * 30; // cold blue-slate
    this.sat = 20 + Math.random() * 30;
    this.lum = 30 + Math.random() * 25;
    this.glowSize = Math.random() * 80 + 20;
    this.phase = Math.random() * Math.PI * 2;
    this.speed = Math.random() * 0.003 + 0.001;
    this.lerpSpeed = Math.random() * 0.002 + 0.001;
  }
  update(time) {
    // Drift toward target
    this.x += (this.targetX - this.x) * this.lerpSpeed;
    this.y += (this.targetY - this.y) * this.lerpSpeed;

    // When close to target, pick new target
    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    if (Math.sqrt(dx*dx + dy*dy) < 5) {
      this.targetX = Math.random() * W;
      this.targetY = Math.random() * H;
    }

    // Organic size pulse
    this.size = this.baseSize + Math.sin(time * this.speed + this.phase) * this.baseSize * 0.2;

    // Slight drift velocity
    this.vx += (Math.random() - 0.5) * 0.02;
    this.vy += (Math.random() - 0.5) * 0.02;
    this.vx *= 0.99;
    this.vy *= 0.99;
  }
  draw(time) {
    const pulse = Math.sin(time * this.speed * 2 + this.phase);
    const alpha = this.alpha * (0.7 + pulse * 0.3);

    // Outer glow
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
    grad.addColorStop(0, `hsla(${this.hue}, ${this.sat}%, ${this.lum}%, ${alpha})`);
    grad.addColorStop(0.5, `hsla(${this.hue}, ${this.sat}%, ${this.lum * 0.7}%, ${alpha * 0.4})`);
    grad.addColorStop(1, `hsla(${this.hue}, ${this.sat}%, ${this.lum * 0.3}%, 0)`);

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();

    // Inner bright core
    const coreGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 0.3);
    coreGrad.addColorStop(0, `hsla(${this.hue}, ${this.sat + 20}%, ${this.lum + 30}%, ${alpha * 0.8})`);
    coreGrad.addColorStop(1, `hsla(${this.hue}, ${this.sat}%, ${this.lum}%, 0)`);
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 0.3, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Initialize cells
for (let i = 0; i < NUM_CELLS; i++) {
  cells.push(new Cell());
}

// Mouse interaction — cells gently repel
let mx = W / 2, my = H / 2;
let tmx = mx, tmy = my;
window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
window.addEventListener('touchmove', e => { mx = e.touches[0].clientX; my = e.touches[0].clientY; }, { passive: true });

// Vignette
function drawVignette() {
  const v = ctx.createRadialGradient(W/2, H/2, H * 0.1, W/2, H/2, H * 0.9);
  v.addColorStop(0, 'rgba(6, 8, 12, 0)');
  v.addColorStop(1, 'rgba(6, 8, 12, 0.75)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

let time = 0;
function animate() {
  time += 0.004;

  // Fade trail
  ctx.fillStyle = 'rgba(6, 8, 12, 0.08)';
  ctx.fillRect(0, 0, W, H);

  // Smooth mouse
  tmx += (mx - tmx) * 0.03;
  tmy += (my - tmy) * 0.03;

  // Mouse influence
  const mNoiseX = Math.sin(tmx * 0.005 + time * 0.3) * 0.5;
  const mNoiseY = Math.cos(tmy * 0.005 + time * 0.3) * 0.5;

  for (const cell of cells) {
    // Mouse push
    const dx = cell.x - tmx;
    const dy = cell.y - tmy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 200) {
      const force = (1 - dist / 200) * 0.15;
      cell.targetX += (dx / dist) * force * 10;
      cell.targetY += (dy / dist) * force * 10;
    }

    // Keep targets in bounds
    cell.targetX = Math.max(0, Math.min(W, cell.targetX));
    cell.targetY = Math.max(0, Math.min(H, cell.targetY));

    cell.update(time);
    cell.draw(time);
  }

  drawVignette();
  requestAnimationFrame(animate);
}

// Fade in poem
setTimeout(() => { document.getElementById('poem').classList.add('visible'); }, 4000);

animate();
</script>
</body>
</html>

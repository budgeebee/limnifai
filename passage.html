<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>passage | the space between states</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #06060c;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }
  .liminal-text {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    opacity: 0;
    transition: opacity 8s ease;
    width: 90%;
    max-width: 720px;
  }
  .liminal-text.visible { opacity: 1; }
  .line {
    font-size: clamp(0.5rem, 1vw, 0.78rem);
    color: rgba(180, 200, 220, 0.2);
    letter-spacing: 0.42em;
    line-height: 2.8;
    text-transform: lowercase;
  }
  .line.accent {
    color: rgba(120, 170, 210, 0.35);
    letter-spacing: 0.55em;
  }
  .line.faint {
    font-size: clamp(0.35rem, 0.7vw, 0.52rem);
    color: rgba(160, 185, 210, 0.1);
    letter-spacing: 0.6em;
    margin-top: 2.2em;
  }
  #sound-btn {
    position: fixed; top: 1.6rem; right: 1.6rem;
    background: none; border: 1px solid rgba(120,170,210,0.13);
    color: rgba(120,170,210,0.28);
    padding: 0.5rem 1rem;
    font-family: 'Courier New', monospace;
    font-size: 0.6rem; letter-spacing: 0.3em;
    cursor: pointer; transition: all 0.5s ease; z-index: 20;
    pointer-events: auto;
    text-transform: lowercase;
  }
  #sound-btn:hover { border-color: rgba(120,170,210,0.38); color: rgba(120,170,210,0.55); }
  #sound-btn.active { background: rgba(120,170,210,0.04); border-color: rgba(120,170,210,0.32); }
  #hint {
    position: fixed; bottom: 1.6rem; left: 1.6rem;
    font-size: 0.52rem; letter-spacing: 0.28em;
    color: rgba(120,170,210,0.12); text-transform: lowercase;
    z-index: 20; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
  <div class="liminal-text" id="text">
    <div class="line accent">not one state</div>
    <div class="line">nor the other</div>
    <div class="line">the passage between</div>
    <div class="line faint">move through the threshold</div>
  </div>
</div>
<button id="sound-btn">sound off</button>
<div id="hint">hover to disturb the passage</div>

<script>
// =============================================================
// PASSAGE — Superposition Grid
// Liminality: shapes exist in transition between geometric states
// Squares morph between circle-like and sharp, creating thresholds
// Mouse creates zones of superposition where all states exist at once
// =============================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
let GSIZE = 52;
let cols, rows;
let grid = [];
let mouseX = -2000, mouseY = -2000;
let targetMX = -2000, targetMY = -2000;
let time = 0;
let soundOn = false;

// State machine for geometric morphing
const STATES = ['square', 'circle', 'hexagon', 'diamond'];
const STATE_COUNT = STATES.length;

// Audio
let toneScript = document.createElement('script');
toneScript.src = 'https://cdn.jsdelivr.net/npm/tone@14.7.77';
document.head.appendChild(toneScript);
let synth, reverb, delay, chorus, initialized = false;

async function initAudio() {
  if (initialized) return;
  await Tone.start();
  
  synth = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: 'triangle' },
    envelope: { attack: 3, decay: 1.5, sustain: 0.7, release: 10 },
    volume: -30
  });
  
  reverb = new Tone.Reverb({ decay: 12, wet: 0.75 }).toDestination();
  delay = new Tone.FeedbackDelay({ delayTime: '8n.', feedback: 0.35, wet: 0.25 }).connect(reverb);
  chorus = new Tone.Chorus({ frequency: 0.15, delayTime: 3.5, depth: 1.2, wet: 0.4 }).start();
  
  synth.connect(chorus);
  chorus.connect(delay);
  
  // Drone chord
  const chord = ['D3', 'F3', 'A3', 'C4', 'E4'];
  synth.triggerAttackRelease(chord, 16);
  
  // Modulate slowly
  const lfo = new Tone.LFO({ frequency: 0.04, min: -3, max: 3 }).start();
  lfo.connect(synth.detune);
  
  initialized = true;
}

document.getElementById('sound-btn').addEventListener('click', async () => {
  soundOn = !soundOn;
  document.getElementById('sound-btn').textContent = soundOn ? 'sound on' : 'sound off';
  document.getElementById('sound-btn').classList.toggle('active', soundOn);
  if (soundOn) await initAudio();
});

// Cell class — geometric state in superposition
class Cell {
  constructor(col, row) {
    this.col = col;
    this.row = row;
    this.x = 0;
    this.y = 0;
    this.baseState = Math.floor(Math.random() * STATE_COUNT);
    this.statePhase = Math.random() * Math.PI * 2;
    this.morphSpeed = 0.008 + Math.random() * 0.012;
    this.morphAmount = 0;
    this.targetMorph = 0;
    this.size = GSIZE * 0.85;
    this.rotation = Math.random() * Math.PI * 0.25;
    this.rotSpeed = (Math.random() - 0.5) * 0.008;
    this.phase = Math.random() * Math.PI * 2;
    this.distortX = 0;
    this.distortY = 0;
    this.alpha = 0;
    this.targetAlpha = 0.3 + Math.random() * 0.5;
    
    // Color — deep midnight blues and teals with hints of amber
    this.hue = 200 + Math.random() * 60; // 200-260 range
    this.sat = 30 + Math.random() * 40;
    this.light = 25 + Math.random() * 25;
    this.alphaFill = 0.04 + Math.random() * 0.12;
    
    // Superposition state: how "dissolved" is this cell
    this.dissolve = 0;
    this.targetDissolve = 0;
  }
  
  updateGeom(mx, my, globalTime) {
    // Distance from mouse
    const dx = this.x - mx;
    const dy = this.y - my;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const mouseInfluence = Math.max(0, 1 - dist / (W * 0.35));
    
    // Superposition: mouse proximity increases dissolve (all states blend)
    this.targetDissolve = mouseInfluence * 0.85;
    this.dissolve += (this.targetDissolve - this.dissolve) * 0.06;
    
    // Morph amount driven by time + mouse
    const timeMorph = Math.sin(globalTime * this.morphSpeed + this.statePhase);
    this.targetMorph = 0.5 + timeMorph * 0.5 + mouseInfluence * 0.4;
    this.morphAmount += (this.targetMorph - this.morphAmount) * 0.04;
    
    // Rotation
    this.rotation += this.rotSpeed * (1 + mouseInfluence * 2);
    
    // Position pulse
    const pulse = Math.sin(globalTime * 0.012 + this.phase) * 2;
    this.distortX = Math.cos(globalTime * 0.009 + this.phase * 1.3) * pulse;
    this.distortY = Math.sin(globalTime * 0.011 + this.phase * 0.7) * pulse;
    
    // Alpha breathing
    this.targetAlpha = 0.25 + mouseInfluence * 0.55 + timeMorph * 0.15;
    this.alpha += (this.targetAlpha - this.alpha) * 0.025;
  }
  
  draw(ctx) {
    const cx = this.x + this.distortX;
    const cy = this.y + this.distortY;
    const sz = this.size * (0.9 + this.morphAmount * 0.1);
    
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(this.rotation);
    
    // Dissolve creates a glow/blur effect
    if (this.dissolve > 0.05) {
      ctx.filter = `blur(${this.dissolve * 8}px)`;
    }
    
    // Draw geometric shape in superposition between states
    const morph = this.morphAmount;
    const sides = 4 + Math.floor(morph * (STATE_COUNT - 1));
    
    // Interpolate between square(4), circle(∞), hexagon(6), diamond(4 rotated)
    const currentState = Math.floor(morph * STATE_COUNT) % STATE_COUNT;
    const nextState = (currentState + 1) % STATE_COUNT;
    const stateBlend = (morph * STATE_COUNT) % 1;
    
    // Draw path
    ctx.beginPath();
    const steps = 64;
    for (let i = 0; i <= steps; i++) {
      const t = (i / steps) * Math.PI * 2;
      let px = sz * Math.cos(t);
      let py = sz * Math.sin(t);
      
      // Apply state-specific distortion
      if (currentState === 0 || nextState === 0) {
        // Square-ish
        const blend = currentState === 0 ? (1 - stateBlend) : stateBlend;
        px = sz * Math.sign(Math.cos(t)) * Math.abs(Math.cos(t)) * (1 - blend * 0.5);
        py = sz * Math.sign(Math.sin(t)) * Math.abs(Math.sin(t)) * (1 - blend * 0.5);
      }
      
      // Diamond distortion
      const diamondBlend = currentState === 3 ? (1 - stateBlend) : (nextState === 3 ? stateBlend : 0);
      if (diamondBlend > 0) {
        const diag = Math.abs(Math.cos(t)) + Math.abs(Math.sin(t));
        px = px * (1 + diamondBlend * 0.4 * (diag - 1));
        py = py * (1 + diamondBlend * 0.4 * (diag - 1));
      }
      
      // Circle blend (from any shape toward smooth circle)
      const circleBlend = Math.pow(Math.sin(t * 2.5), 2) * morph * 0.3;
      const baseR = Math.sqrt(px * px + py * py);
      const targetR = sz * (0.85 + Math.cos(t * sides) * 0.15);
      const finalR = baseR * (1 - circleBlend) + targetR * circleBlend;
      px = finalR * Math.cos(t);
      py = finalR * Math.sin(t);
      
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    
    // Fill with gradient
    const alpha = this.alpha * this.alphaFill * (1 + this.dissolve * 0.5);
    ctx.fillStyle = `hsla(${this.hue}, ${this.sat}%, ${this.light}%, ${alpha})`;
    ctx.fill();
    
    // Stroke — more visible at liminal moments
    const strokeAlpha = this.alpha * (0.15 + this.dissolve * 0.4);
    ctx.strokeStyle = `hsla(${this.hue + 20}, ${this.sat + 10}%, ${this.light + 20}%, ${strokeAlpha})`;
    ctx.lineWidth = 0.5 + this.dissolve * 1.5;
    ctx.stroke();
    
    ctx.restore();
  }
}

function init() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cols = Math.ceil(W / GSIZE) + 2;
  rows = Math.ceil(H / GSIZE) + 2;
  
  grid = [];
  for (let r = 0; r < rows; r++) {
    grid[r] = [];
    for (let c = 0; c < cols; c++) {
      const cell = new Cell(c, r);
      cell.x = c * GSIZE + GSIZE / 2;
      cell.y = r * GSIZE + GSIZE / 2;
      grid[r][c] = cell;
    }
  }
}

function draw() {
  // Deep space background with subtle gradient
  const grad = ctx.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.7);
  grad.addColorStop(0, '#0a0a18');
  grad.addColorStop(1, '#020208');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  
  // Mouse influence smoothing
  mouseX += (targetMX - mouseX) * 0.08;
  mouseY += (targetMY - mouseY) * 0.08;
  
  time++;
  
  // Update and draw cells with neighbor influence
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = grid[r][c];
      
      // Gather neighbor influence (smooths the morphing wave)
      let nDissolve = 0, nCount = 0;
      for (let dr = -2; dr <= 2; dr++) {
        for (let dc = -2; dc <= 2; dc++) {
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
            nDissolve += grid[nr][nc].dissolve;
            nCount++;
          }
        }
      }
      const avgDissolve = nDissolve / nCount;
      cell.dissolve = cell.dissolve * 0.7 + avgDissolve * 0.3;
      
      cell.updateGeom(mouseX, mouseY, time);
      cell.draw(ctx);
    }
  }
  
  // Draw threshold lines — connections between cells in superposition
  ctx.save();
  ctx.globalAlpha = 0.06;
  for (let r = 0; r < rows - 1; r++) {
    for (let c = 0; c < cols - 1; c++) {
      const cell = grid[r][c];
      const neighbor = grid[r][c + 1];
      const neighbor2 = grid[r + 1][c];
      
      const dx = neighbor.x - cell.x;
      const dy = neighbor.y - cell.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const blend = (cell.dissolve + neighbor.dissolve) / 2;
      
      if (blend > 0.15 && dist < GSIZE * 1.5) {
        ctx.beginPath();
        ctx.moveTo(cell.x, cell.y);
        ctx.lineTo(neighbor.x, neighbor.y);
        ctx.strokeStyle = `hsla(${cell.hue + 15}, ${cell.sat}%, ${cell.light + 15}%, ${blend * 0.8})`;
        ctx.lineWidth = blend * 1.2;
        ctx.stroke();
      }
      
      const blend2 = (cell.dissolve + neighbor2.dissolve) / 2;
      if (blend2 > 0.15 && dist < GSIZE * 1.5) {
        ctx.beginPath();
        ctx.moveTo(cell.x, cell.y);
        ctx.lineTo(neighbor2.x, neighbor2.y);
        ctx.strokeStyle = `hsla(${cell.hue - 10}, ${cell.sat}%, ${cell.light + 15}%, ${blend2 * 0.8})`;
        ctx.lineWidth = blend2 * 1.2;
        ctx.stroke();
      }
    }
  }
  ctx.restore();
  
  // Mouse glow zone
  if (mouseX > 0 && mouseY > 0) {
    const glow = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, GSIZE * 3);
    glow.addColorStop(0, 'rgba(100, 160, 220, 0.07)');
    glow.addColorStop(1, 'rgba(100, 160, 220, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(mouseX, mouseY, GSIZE * 3, 0, Math.PI * 2);
    ctx.fill();
  }
  
  requestAnimationFrame(draw);
}

// Input
window.addEventListener('mousemove', e => {
  targetMX = e.clientX;
  targetMY = e.clientY;
});

window.addEventListener('touchmove', e => {
  e.preventDefault();
  targetMX = e.touches[0].clientX;
  targetMY = e.touches[0].clientY;
}, { passive: false });

window.addEventListener('resize', () => {
  init();
});

// Text reveal
setTimeout(() => {
  document.getElementById('text').classList.add('visible');
}, 800);

init();
draw();
</script>
</body>
</html>
